<div id="app" class="tk-app">
  <noscript>Trackerele au nevoie de JavaScript activat.</noscript>
</div>
<script>
/*
 * Trackere — nucleul comun.
 * Expune `window.TK`: construire DOM, formatare (lei, procente, date în română),
 * utilitare de dată, preferințe per vizitator, dialoguri în pagină și
 * depozitul de date (localStorage + sincronizare în cont prin capabilitatea `db`).
 * Scripturi clasice (fără module), ca aplicația să meargă și deschisă direct din fișier.
 */
(function () {
  'use strict';

  var TK = (window.TK = window.TK || {});

  /* ----------------------------------------------------------- înregistrare */

  // Trackerele se încarcă înaintea cadrului (app.js), deci doar le punem în coadă aici.
  TK._registry = TK._registry || [];
  TK.register = function (def) {
    TK._registry.push(def);
  };

  /* ------------------------------------------------------------------ DOM */

  // h('div', {class: 'x', onclick: fn, dataset: {id: 1}}, 'text', child, [more])
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) {
      for (var k in attrs) {
        if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
        var v = attrs[k];
        if (v == null || v === false) continue;
        if (k === 'class' || k === 'className') el.className = v;
        else if (k === 'style' && typeof v === 'object') {
          for (var s in v) {
            if (s.indexOf('--') === 0) el.style.setProperty(s, v[s]);
            else el.style[s] = v[s];
          }
        } else if (k === 'dataset') {
          for (var d in v) el.dataset[d] = v[d];
        } else if (k === 'html') el.innerHTML = v;
        else if (k.slice(0, 2) === 'on' && typeof v === 'function') {
          el.addEventListener(k.slice(2).toLowerCase(), v);
        } else if (k === 'value' || k === 'checked' || k === 'selected' || k === 'disabled' || k === 'indeterminate') {
          el[k] = v;
        } else if (v === true) el.setAttribute(k, '');
        else el.setAttribute(k, String(v));
      }
    }
    for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }

  function append(el, child) {
    if (child == null || child === false || child === true) return;
    if (Array.isArray(child)) {
      for (var i = 0; i < child.length; i++) append(el, child[i]);
    } else if (child instanceof Node) el.appendChild(child);
    else el.appendChild(document.createTextNode(String(child)));
  }

  function clear(el) {
    while (el.firstChild) el.removeChild(el.firstChild);
    return el;
  }

  function esc(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  TK.h = h;
  TK.append = append;
  TK.clear = clear;
  TK.esc = esc;

  /* -------------------------------------------------------------- general */

  TK.uid = function () {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  };

  TK.clone = function (obj) {
    return obj == null ? obj : JSON.parse(JSON.stringify(obj));
  };

  TK.debounce = function (fn, ms) {
    var t;
    function d() {
      var args = arguments, self = this;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(self, args); }, ms);
    }
    d.flush = function () { clearTimeout(t); fn(); };
    d.cancel = function () { clearTimeout(t); };
    return d;
  };

  TK.sum = function (arr, fn) {
    var s = 0;
    for (var i = 0; i < arr.length; i++) {
      var v = fn ? fn(arr[i], i) : arr[i];
      if (typeof v === 'number' && isFinite(v)) s += v;
    }
    return s;
  };

  TK.groupBy = function (arr, fn) {
    var out = {};
    for (var i = 0; i < arr.length; i++) {
      var k = fn(arr[i]);
      (out[k] = out[k] || []).push(arr[i]);
    }
    return out;
  };

  // ratio sigur: 0 dacă numitorul e 0
  TK.ratio = function (a, b) {
    return b ? a / b : 0;
  };

  /* ----------------------------------------------------------- formatare */

  var NBSP = ' ';

  function groupThousands(intStr) {
    return intStr.replace(/\B(?=(\d{3})+(?!\d))/g, NBSP);
  }

  // 1500.5 -> "1 500,50"
  function num(n, dec) {
    if (dec == null) dec = 2;
    if (n == null || n === '' || !isFinite(n)) return '—';
    var neg = n < 0;
    var fixed = Math.abs(Number(n)).toFixed(dec);
    var parts = fixed.split('.');
    var out = groupThousands(parts[0]) + (parts[1] ? ',' + parts[1] : '');
    return (neg && Number(fixed) !== 0 ? '−' : '') + out;
  }

  var fmt = {
    num: num,
    // 1500 -> "1 500,00 lei"
    lei: function (n, dec) {
      if (n == null || n === '' || !isFinite(n)) return '—';
      return num(n, dec == null ? 2 : dec) + NBSP + 'lei';
    },
    // 1500 -> "1 500 lei" (pentru axe și spații mici)
    leiShort: function (n) {
      if (n == null || !isFinite(n)) return '—';
      var a = Math.abs(n);
      if (a >= 1e6) return num(n / 1e6, a >= 1e7 ? 0 : 1) + NBSP + 'mil.';
      if (a >= 1e4) return num(n / 1e3, 0) + NBSP + 'mii';
      return num(n, 0);
    },
    // 0.6667 -> "66,67%"
    pct: function (ratio, dec) {
      if (ratio == null || !isFinite(ratio)) return '—';
      return num(ratio * 100, dec == null ? 2 : dec) + '%';
    },
    // "1 500,50" / "1.500,50" / "1500.5" / "1,500.50" / "1.500" -> număr ; gol sau invalid -> null
    // Virgula e zecimală (convenția românească); punctul urmat de grupuri de 3 cifre e separator de mii.
    parseNum: function (str) {
      if (typeof str === 'number') return isFinite(str) ? str : null;
      if (str == null) return null;
      var s = String(str).trim().replace(/\s*lei$/i, '').replace(/[\s  ]/g, '').replace(/−/g, '-');
      if (s === '') return null;
      var neg = s.charAt(0) === '-';
      if (neg || s.charAt(0) === '+') s = s.slice(1);
      var v;
      if (/^\d+(,\d+)?$/.test(s)) v = Number(s.replace(',', '.'));                                     // 1500,50
      else if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) v = Number(s.replace(/\./g, '').replace(',', '.')); // 1.500,50
      else if (/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) v = Number(s.replace(/,/g, ''));                  // 1,500.50
      else if (/^\d+(\.\d+)?$/.test(s)) v = Number(s);                                                // 1500.5
      else return null;
      return isFinite(v) ? (neg ? -v : v) : null;
    },
  };

  /* ---------------------------------------------------------------- date */

  var MONTHS = ['Ianuarie', 'Februarie', 'Martie', 'Aprilie', 'Mai', 'Iunie', 'Iulie', 'August', 'Septembrie', 'Octombrie', 'Noiembrie', 'Decembrie'];
  var MONTHS_SHORT = ['ian.', 'feb.', 'mar.', 'apr.', 'mai', 'iun.', 'iul.', 'aug.', 'sept.', 'oct.', 'nov.', 'dec.'];
  var WEEKDAYS = ['Luni', 'Marți', 'Miercuri', 'Joi', 'Vineri', 'Sâmbătă', 'Duminică'];
  var WEEKDAYS_SHORT = ['Lu', 'Ma', 'Mi', 'Jo', 'Vi', 'Sâ', 'Du'];

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  var date = {
    MONTHS: MONTHS,
    MONTHS_SHORT: MONTHS_SHORT,
    WEEKDAYS: WEEKDAYS,
    WEEKDAYS_SHORT: WEEKDAYS_SHORT,

    // Date -> "2026-09-27" (ora locală)
    iso: function (d) {
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    },
    today: function () { return date.iso(new Date()); },
    // "2026-09-27" -> Date la miezul nopții local
    parse: function (iso) {
      if (!iso) return null;
      var p = String(iso).split('-');
      if (p.length < 3) return null;
      var d = new Date(+p[0], +p[1] - 1, +p[2]);
      return isNaN(d) ? null : d;
    },
    make: function (y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }, // m: 0-11
    year: function (iso) { return +String(iso).slice(0, 4); },
    month: function (iso) { return +String(iso).slice(5, 7) - 1; }, // 0-11
    day: function (iso) { return +String(iso).slice(8, 10); },
    ym: function (iso) { return String(iso).slice(0, 7); }, // "2026-09"
    daysInMonth: function (y, m) { return new Date(y, m + 1, 0).getDate(); },
    addDays: function (iso, n) {
      var d = date.parse(iso);
      d.setDate(d.getDate() + n);
      return date.iso(d);
    },
    // zile de la a la b (b - a), ignorând ora de vară
    diffDays: function (a, b) {
      var da = date.parse(a), db = date.parse(b);
      if (!da || !db) return null;
      return Math.round((Date.UTC(db.getFullYear(), db.getMonth(), db.getDate()) - Date.UTC(da.getFullYear(), da.getMonth(), da.getDate())) / 864e5);
    },
    // 0 = luni … 6 = duminică
    weekday: function (iso) {
      var d = date.parse(iso);
      return (d.getDay() + 6) % 7;
    },
    // luni din săptămâna care conține ziua
    startOfWeek: function (iso) { return date.addDays(iso, -date.weekday(iso)); },
    // zilele lunii împărțite în bucăți de 7 începând cu ziua 1 (ca în foile de calcul)
    // -> [[1..7],[8..14],…]
    chunkWeeks: function (y, m) {
      var n = date.daysInMonth(y, m), out = [];
      for (var d = 1; d <= n; d += 7) {
        var w = [];
        for (var i = d; i < d + 7 && i <= n; i++) w.push(i);
        out.push(w);
      }
      return out;
    },
    // grilă de calendar (săptămâni luni→duminică) cu zile din lunile vecine
    // -> [[{iso, day, inMonth}, …7], …]
    calendarGrid: function (y, m) {
      var first = date.make(y, m, 1);
      var start = date.startOfWeek(first);
      var last = date.make(y, m, date.daysInMonth(y, m));
      var end = date.addDays(date.startOfWeek(last), 6);
      var weeks = [], cur = start;
      while (date.diffDays(cur, end) >= 0) {
        var w = [];
        for (var i = 0; i < 7; i++) {
          w.push({ iso: cur, day: date.day(cur), inMonth: date.month(cur) === m && date.year(cur) === y });
          cur = date.addDays(cur, 1);
        }
        weeks.push(w);
      }
      return weeks;
    },
  };

  // "2026-01-05" -> "05 ian. 2026"
  fmt.date = function (iso) {
    var d = date.parse(iso);
    if (!d) return '—';
    return pad(d.getDate()) + ' ' + MONTHS_SHORT[d.getMonth()] + ' ' + d.getFullYear();
  };
  // "2026-01-05" -> "05 ian."
  fmt.dateShort = function (iso) {
    var d = date.parse(iso);
    if (!d) return '—';
    return pad(d.getDate()) + ' ' + MONTHS_SHORT[d.getMonth()];
  };
  fmt.month = function (m) { return MONTHS[m]; };
  fmt.monthYear = function (y, m) { return MONTHS[m] + ' ' + y; };
  // 1 -> "1 zi", 5 -> "5 zile", 25 -> "25 de zile"
  fmt.days = function (n) {
    var a = Math.abs(n);
    if (a === 1) return n + ' zi';
    if (a === 0 || a % 100 < 20) return n + ' zile';
    return n + ' de zile';
  };

  TK.fmt = fmt;
  TK.date = date;

  /* ------------------------------------------------ preferințe per vizitator */

  var PREF_PREFIX = 'tk:pref:';
  TK.prefs = {
    get: function (key, def) {
      try {
        var raw = localStorage.getItem(PREF_PREFIX + key);
        return raw == null ? def : JSON.parse(raw);
      } catch (e) { return def; }
    },
    set: function (key, val) {
      try { localStorage.setItem(PREF_PREFIX + key, JSON.stringify(val)); } catch (e) { /* stocare indisponibilă */ }
    },
    scope: function (ns) {
      return {
        get: function (k, def) { return TK.prefs.get(ns + ':' + k, def); },
        set: function (k, v) { TK.prefs.set(ns + ':' + k, v); },
      };
    },
  };

  /* ------------------------------------------------------------- UI: dialoguri */

  var ui = {};
  var toastTimer;

  ui.toast = function (msg) {
    var el = document.querySelector('.tk-toast');
    if (!el) {
      el = h('div', { class: 'tk-toast', role: 'status', 'aria-live': 'polite' });
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.hidden = false;
    el.classList.add('is-visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      el.classList.remove('is-visible');
      el.hidden = true;
    }, 2600);
  };

  // Deschide o fereastră modală. Returnează funcția close().
  // opts: {title, content: Node|string, actions: [{label, kind:'primary|ghost|danger', onClick(close) -> false ca să rămână deschisă}], onClose}
  ui.modal = function (opts) {
    var prevFocus = document.activeElement;
    var box = h('div', { class: 'tk-modal__box', role: 'dialog', 'aria-modal': 'true', 'aria-label': opts.title || 'Dialog' });
    var backdrop = h('div', { class: 'tk-modal' }, box);
    var closed = false;

    var appRoot = document.getElementById('app');
    function close() {
      if (closed) return;
      closed = true;
      document.removeEventListener('keydown', onKey, true);
      backdrop.remove();
      if (appRoot && !document.querySelector('.tk-modal')) appRoot.inert = false;
      if (opts.onClose) opts.onClose();
      if (prevFocus && prevFocus.focus) {
        try { prevFocus.focus(); } catch (e) { /* elementul poate lipsi */ }
      }
    }
    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); close(); return; }
      if (e.key !== 'Tab') return;
      // focusul rămâne în fereastră
      var items = Array.prototype.filter.call(
        box.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'),
        function (el) { return !el.disabled && el.offsetParent !== null; });
      if (!items.length) return;
      var first = items[0], last = items[items.length - 1];
      if (e.shiftKey && (document.activeElement === first || !box.contains(document.activeElement))) {
        e.preventDefault(); last.focus();
      } else if (!e.shiftKey && (document.activeElement === last || !box.contains(document.activeElement))) {
        e.preventDefault(); first.focus();
      }
    }

    if (opts.title) box.appendChild(h('h2', { class: 'tk-modal__title' }, opts.title));
    if (opts.content != null) {
      box.appendChild(typeof opts.content === 'string' ? h('p', { class: 'tk-muted' }, opts.content) : opts.content);
    }
    var actions = (opts.actions || [{ label: 'Închide', kind: 'ghost' }]).map(function (a) {
      return h('button', {
        type: a.submit ? 'submit' : 'button',
        form: a.submit ? a.form : null,
        class: 'tk-btn' + (a.kind ? ' tk-btn--' + a.kind : ''),
        onclick: a.submit ? null : function () {
          var r = a.onClick ? a.onClick(close) : undefined;
          if (r !== false) close();
        },
      }, a.label);
    });
    box.appendChild(h('div', { class: 'tk-modal__actions' }, actions));

    backdrop.addEventListener('mousedown', function (e) { if (e.target === backdrop) close(); });
    document.addEventListener('keydown', onKey, true);
    document.body.appendChild(backdrop);
    if (appRoot) appRoot.inert = true;

    var focusable = box.querySelector('input, select, textarea, button');
    if (focusable) setTimeout(function () { focusable.focus(); }, 0);
    return close;
  };

  // Confirmare în pagină (confirm() nu funcționează în vizualizator).
  // -> Promise<boolean>
  ui.confirm = function (opts) {
    opts = opts || {};
    return new Promise(function (resolve) {
      var done = false;
      function finish(v) { if (!done) { done = true; resolve(v); } }
      ui.modal({
        title: opts.title || 'Ești sigur?',
        content: opts.text || null,
        onClose: function () { finish(false); },
        actions: [
          { label: opts.cancel || 'Anulează', kind: 'ghost', onClick: function () { finish(false); } },
          { label: opts.ok || 'Confirmă', kind: opts.danger ? 'danger' : 'primary', onClick: function () { finish(true); } },
        ],
      });
    });
  };

  // Formular în fereastră modală.
  // fields: [{name, label, type:'text|number|money|date|select|checks|textarea|checkbox|color', options:[{value,label}]|[string], value, required, placeholder, min, max, step, hint}]
  //   'checks' = mai multe bife dintr-o listă; value și rezultatul sunt tablouri de valori.
  // -> Promise<object|null>  (null = anulat). Sumele (`money`/`number`) sunt returnate ca număr sau null.
  ui.form = function (opts) {
    return new Promise(function (resolve) {
      var formId = 'tk-form-' + TK.uid();
      var done = false;
      function finish(v) { if (!done) { done = true; resolve(v); } }

      var controls = {};
      var form = h('form', { id: formId, class: 'tk-stack', novalidate: true });
      (opts.fields || []).forEach(function (f) {
        var id = formId + '-' + f.name;
        var ctl;
        if (f.type === 'select') {
          ctl = h('select', { id: id, class: 'tk-select', name: f.name },
            (f.options || []).map(function (o) {
              var val = typeof o === 'object' ? o.value : o;
              var lab = typeof o === 'object' ? o.label : o;
              return h('option', { value: val, selected: String(val) === String(f.value) }, lab);
            }));
        } else if (f.type === 'checks') {
          var sel = Array.isArray(f.value) ? f.value.map(String) : [];
          ctl = h('div', { id: id, class: 'tk-checks', role: 'group', 'aria-label': f.label },
            (f.options || []).map(function (o, i) {
              var val = typeof o === 'object' ? o.value : o;
              var lab = typeof o === 'object' ? o.label : o;
              return h('label', { class: 'tk-checks__item' },
                h('input', { type: 'checkbox', class: 'tk-check', id: id + '-' + i, value: String(val), checked: sel.indexOf(String(val)) !== -1 }),
                h('span', null, lab));
            }));
          if (!(f.options || []).length) ctl.appendChild(h('span', { class: 'tk-muted' }, f.empty || '—'));
        } else if (f.type === 'textarea') {
          ctl = h('textarea', { id: id, class: 'tk-textarea', name: f.name, rows: f.rows || 3, placeholder: f.placeholder }, f.value || '');
        } else if (f.type === 'checkbox') {
          ctl = h('input', { id: id, type: 'checkbox', class: 'tk-check', name: f.name, checked: !!f.value });
        } else {
          var isNum = f.type === 'number' || f.type === 'money';
          ctl = h('input', {
            id: id,
            class: 'tk-input',
            name: f.name,
            type: isNum ? 'text' : (f.type || 'text'),
            inputmode: isNum ? 'decimal' : null,
            value: f.value == null ? '' : (f.type === 'money' ? num(f.value, 2).replace(/ /g, ' ') : f.value),
            placeholder: f.placeholder,
            min: f.min, max: f.max, step: f.step,
            autocomplete: 'off',
          });
        }
        controls[f.name] = { el: ctl, def: f };
        var label = h(f.type === 'checks' ? 'span' : 'label', { class: 'tk-label', for: f.type === 'checks' ? null : id }, f.label + (f.required ? ' *' : ''));
        if (f.type === 'checkbox') {
          form.appendChild(h('div', { class: 'tk-field tk-field--inline' }, ctl, label));
        } else {
          form.appendChild(h('div', { class: 'tk-field' }, label, ctl, f.hint ? h('small', { class: 'tk-muted' }, f.hint) : null));
        }
      });
      var err = h('p', { class: 'tk-form-error', role: 'alert', hidden: true });
      form.appendChild(err);

      var close;
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var out = {}, bad = null;
        for (var name in controls) {
          var c = controls[name], f = c.def, v;
          if (f.type === 'checkbox') v = c.el.checked;
          else if (f.type === 'checks') v = Array.prototype.map.call(c.el.querySelectorAll('input:checked'), function (x) { return x.value; });
          else if (f.type === 'number' || f.type === 'money') {
            v = fmt.parseNum(c.el.value);
            if (c.el.value.trim() !== '' && v == null) bad = bad || ('„' + f.label + '” trebuie să fie un număr.');
          } else v = c.el.value.trim();
          if (f.required && (v == null || v === '' || (Array.isArray(v) && !v.length))) bad = bad || ('Completează „' + f.label + '”.');
          out[name] = v;
        }
        if (!bad && opts.validate) bad = opts.validate(out) || null;
        if (bad) {
          err.textContent = bad;
          err.hidden = false;
          return;
        }
        finish(out);
        close();
      });

      var actions = [{ label: opts.cancel || 'Anulează', kind: 'ghost', onClick: function () { finish(null); } }];
      if (opts.onDelete) {
        actions.unshift({
          label: opts.deleteLabel || 'Șterge',
          kind: 'danger',
          onClick: function () { finish({ __delete: true }); },
        });
      }
      actions.push({ label: opts.submit || 'Salvează', kind: 'primary', submit: true, form: formId });

      close = ui.modal({
        title: opts.title,
        content: form,
        onClose: function () { finish(null); },
        actions: actions,
      });
    });
  };

  TK.ui = ui;

  /* ------------------------------------------------------ platforma artifact */

  // Promisiune spre o capabilitate a vizualizatorului claude.ai sau null
  // (fișier local, alt host, capabilitate neacordată).
  TK.capability = function (name) {
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        return window.claude.use(name).catch(function () { return null; });
      }
    } catch (e) { /* ignorăm */ }
    return Promise.resolve(null);
  };

  // Salvează un fișier: prin capabilitatea `downloads` în vizualizator,
  // altfel printr-un link local (fișier deschis direct din disc).
  TK.saveFile = function (filename, text, mime) {
    return TK.capability('downloads').then(function (dl) {
      if (dl) {
        return dl.save({ filename: filename, data: new Blob([text], { type: mime || 'application/json' }) })
          .then(function () { return true; })
          .catch(function () { return false; });
      }
      if (window.claude) return false; // în vizualizator, un link de descărcare e blocat
      try {
        var blob = new Blob([text], { type: mime || 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = h('a', { href: url, download: filename, hidden: true });
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
        return true;
      } catch (e) { return false; }
    });
  };

  // Deschide selectorul de fișiere și citește un JSON. -> Promise<object|null>
  TK.pickJSON = function () {
    return new Promise(function (resolve) {
      var input = h('input', { type: 'file', accept: 'application/json,.json', hidden: true });
      input.addEventListener('change', function () {
        var file = input.files && input.files[0];
        input.remove();
        if (!file) return resolve(null);
        var reader = new FileReader();
        reader.onload = function () {
          try { resolve(JSON.parse(reader.result)); } catch (e) { resolve({ __error: 'Fișierul nu este un JSON valid.' }); }
        };
        reader.onerror = function () { resolve({ __error: 'Fișierul nu a putut fi citit.' }); };
        reader.readAsText(file);
      });
      document.body.appendChild(input);
      input.click();
    });
  };

  /* ------------------------------------------------------------ depozit date */

  var LOCAL_PREFIX = 'tk:data:v1:';
  var MAX_DOC_BYTES = 250 * 1024;

  function readLocal(key) {
    try {
      var raw = localStorage.getItem(LOCAL_PREFIX + key);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function writeLocal(key, state) {
    try { localStorage.setItem(LOCAL_PREFIX + key, JSON.stringify(state)); return true; } catch (e) { return false; }
  }

  /*
   * Store: starea unui tracker.
   *  - pornește din localStorage (sau din datele demo),
   *  - la fiecare commit() scrie local imediat și în cont (db) după o pauză,
   *  - când contul are o versiune mai nouă (alt dispozitiv), o adoptă și anunță `onReplace`.
   */
  function Store(key, def) {
    this.key = key;
    this.def = def;
    this.listeners = [];
    this.cloudRef = null;
    this.writing = false;
    this.pending = false;
    this.status = 'local'; // 'local' | 'cloud' | 'error'
    var s = readLocal(key);
    this.state = s ? this._migrate(s) : this._fresh(true);
    this._pushCloud = TK.debounce(this._flushCloud.bind(this), 700);
  }

  Store.prototype._fresh = function (demo) {
    var s = demo ? this.def.createDemo() : this.def.createEmpty();
    s.meta = { v: this.def.version || 1, rev: TK.uid(), updatedAt: 0, demo: !!demo };
    return s;
  };

  Store.prototype._migrate = function (s) {
    if (!s || typeof s !== 'object') return this._fresh(true);
    s.meta = s.meta || { v: 1, rev: TK.uid(), updatedAt: 0, demo: false };
    if (this.def.migrate) s = this.def.migrate(s) || s;
    return s;
  };

  Store.prototype.get = function () { return this.state; };

  // Salvează starea curentă (după ce ai modificat-o pe loc).
  Store.prototype.commit = function () {
    var m = this.state.meta || (this.state.meta = {});
    m.rev = TK.uid();
    m.updatedAt = Date.now();
    writeLocal(this.key, this.state);
    if (this.cloudRef) this._pushCloud();
  };

  // Înlocuiește toată starea (import, resetare) și anunță ascultătorii.
  Store.prototype.replace = function (next, opts) {
    this.state = this._migrate(next);
    if (!opts || !opts.fromCloud) this.commit();
    else writeLocal(this.key, this.state);
    this._emit();
  };

  Store.prototype.reset = function (demo) {
    this.replace(this._fresh(!!demo));
  };

  Store.prototype.onReplace = function (fn) {
    this.listeners.push(fn);
    var self = this;
    return function () { self.listeners = self.listeners.filter(function (f) { return f !== fn; }); };
  };

  Store.prototype._emit = function () {
    for (var i = 0; i < this.listeners.length; i++) {
      try { this.listeners[i](this.state); } catch (e) { console.error(e); }
    }
  };

  Store.prototype._flushCloud = function () {
    var self = this;
    if (!this.cloudRef) return;
    if (this.writing) { this.pending = true; return; }
    var body = TK.clone(this.state);
    var size = JSON.stringify(body).length;
    if (size > MAX_DOC_BYTES) {
      this.status = 'error';
      ui.toast('Datele sunt prea mari pentru sincronizare. Sunt salvate doar în acest browser.');
      TK.emitStatus();
      return;
    }
    this.writing = true;
    this.cloudRef.set(body).then(function () {
      self.status = 'cloud';
    }, function (e) {
      self.status = 'error';
      console.warn('Sincronizare eșuată', e);
      if (e && e.code === 'unavailable') setTimeout(function () { self._pushCloud(); }, 1500 + Math.random() * 1500);
    }).then(function () {
      self.writing = false;
      TK.emitStatus();
      if (self.pending) { self.pending = false; self._flushCloud(); }
    });
  };

  // Utilizatorul scrie acum într-un câmp al paginii?
  function isEditing() {
    var a = document.activeElement;
    if (!a || !a.closest || !a.closest('#tk-main')) return false;
    if (a.isContentEditable || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT') return true;
    return a.tagName === 'INPUT' && !/^(checkbox|radio|button|submit|reset|range|color|file)$/i.test(a.type);
  }

  // Compară versiunea din cont cu cea locală și o păstrează pe cea mai nouă.
  Store.prototype._consider = function (remote) {
    var self = this;
    var local = this.state.meta || {};
    var rmeta = (remote && remote.meta) || {};
    if (rmeta.rev === local.rev) return;
    if ((local.updatedAt || 0) > (rmeta.updatedAt || 0)) {
      // Modificări locale mai noi (făcute înainte să se conecteze contul sau în timpul editării).
      this._pushCloud();
      return;
    }
    if (isEditing()) {
      // Nu schimbăm datele sub cursor: reîncercăm după ce utilizatorul termină de scris.
      this._waiting = remote;
      if (!this._waitTimer) {
        this._waitTimer = setInterval(function () {
          if (isEditing()) return;
          clearInterval(self._waitTimer);
          self._waitTimer = null;
          var r = self._waiting;
          self._waiting = null;
          // lasă trackerul să-și salveze textul (debounce), apoi decide
          setTimeout(function () { self._consider(r); TK.emitStatus(); }, 600);
        }, 800);
      }
      return;
    }
    this.replace(TK.clone(remote), { fromCloud: true });
  };

  // Leagă depozitul de documentul `trackers/<key>` din baza de date a artifactului.
  Store.prototype.attachCloud = function (db) {
    var self = this;
    try { this.cloudRef = db.doc('trackers/' + this.key); } catch (e) { return; }
    this.cloudRef.onSnapshot(function (snap) {
      self.status = 'cloud';
      if (!snap.exists) {
        // Contul nu are încă datele: urcăm ce a lucrat utilizatorul local (nu și demo-ul neatins).
        if (self.state.meta && self.state.meta.updatedAt) self._pushCloud();
        TK.emitStatus();
        return;
      }
      if (snap.metadata && snap.metadata.hasPendingWrites) return;
      self._consider(snap.data());
      TK.emitStatus();
    }, function (e) {
      self.status = 'error';
      self.cloudRef = null;
      console.warn('Sincronizare oprită', e);
      TK.emitStatus();
    });
  };

  TK.Store = Store;

  // starea sincronizării pentru bara de sus
  var statusListeners = [];
  TK.onStatus = function (fn) { statusListeners.push(fn); };
  TK.emitStatus = function () {
    for (var i = 0; i < statusListeners.length; i++) statusListeners[i]();
  };
})();

</script>
<script>
/*
 * Trackere — grafice SVG fără dependențe.
 * TK.charts.donut / pie / bars / hbars / area / legend
 * Culorile vin din tokenii CSS (--chart-1…8, --chart-plan, --chart-fact, --chart-track …),
 * textul din tokenii de cerneală. Fiecare grafic se redesenează la schimbarea lățimii
 * și are tooltip la hover / atingere (elementele cu atributul data-tip).
 */
(function () {
  'use strict';

  var TK = (window.TK = window.TK || {});
  var fmt = function (v) { return TK.fmt.num(v, 0); };

  function seriesColor(c, i) {
    return c || 'var(--chart-' + ((i % 8) + 1) + ')';
  }

  function attrEsc(s) { return TK.esc(s); }

  function niceStep(range, count) {
    if (!(range > 0)) return 1;
    var raw = range / count;
    var mag = Math.pow(10, Math.floor(Math.log10(raw)));
    var n = raw / mag;
    var step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
    return step * mag;
  }

  function niceScale(max, count) {
    var step = niceStep(max, count || 4);
    var top = Math.max(step, Math.ceil(max / step) * step);
    var ticks = [];
    for (var v = 0; v <= top + step / 2; v += step) ticks.push(v);
    return { max: top, ticks: ticks };
  }

  // Drum pentru o bară verticală cu capătul de sus rotunjit (r px), bază dreaptă.
  function barPathV(x, y, w, h, r) {
    x = +x; y = +y; w = +w; h = +h;
    if (h <= 0) return '';
    r = Math.min(r, w / 2, h);
    return 'M' + x + ',' + (y + h) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y +
      'H' + (x + w - r) + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'V' + (y + h) + 'Z';
  }
  // Bară orizontală cu capătul din dreapta rotunjit.
  function barPathH(x, y, w, h, r) {
    x = +x; y = +y; w = +w; h = +h;
    if (w <= 0) return '';
    r = Math.min(r, h / 2, w);
    return 'M' + x + ',' + y + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) +
      'V' + (y + h - r) + 'Q' + (x + w) + ',' + (y + h) + ' ' + (x + w - r) + ',' + (y + h) + 'H' + x + 'Z';
  }

  // Curbă monotonă (Fritsch–Carlson) prin puncte [[x,y],…]
  function monotonePath(pts) {
    var n = pts.length;
    if (n === 0) return '';
    if (n === 1) return 'M' + pts[0][0] + ',' + pts[0][1];
    var dx = [], dy = [], m = [], t = [];
    for (var i = 0; i < n - 1; i++) {
      dx[i] = pts[i + 1][0] - pts[i][0];
      dy[i] = pts[i + 1][1] - pts[i][1];
      m[i] = dy[i] / dx[i];
    }
    t[0] = m[0];
    t[n - 1] = m[n - 2];
    for (i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
    for (i = 0; i < n - 1; i++) {
      if (m[i] === 0) { t[i] = 0; t[i + 1] = 0; continue; }
      var a = t[i] / m[i], b = t[i + 1] / m[i], s = a * a + b * b;
      if (s > 9) { var k = 3 / Math.sqrt(s); t[i] = k * a * m[i]; t[i + 1] = k * b * m[i]; }
    }
    var d = 'M' + pts[0][0] + ',' + pts[0][1];
    for (i = 0; i < n - 1; i++) {
      var h3 = dx[i] / 3;
      d += 'C' + (pts[i][0] + h3) + ',' + (pts[i][1] + t[i] * h3) + ' ' +
        (pts[i + 1][0] - h3) + ',' + (pts[i + 1][1] - t[i + 1] * h3) + ' ' +
        pts[i + 1][0] + ',' + pts[i + 1][1];
    }
    return d;
  }

  /* --------------------------------------------------------------- tooltip */

  var tip;
  function ensureTip() {
    if (!tip) {
      tip = document.createElement('div');
      tip.className = 'tk-tip';
      tip.setAttribute('role', 'tooltip');
      tip.hidden = true;
      document.body.appendChild(tip);
    }
    return tip;
  }
  function showTip(target, x, y) {
    var t = ensureTip();
    t.textContent = '';
    String(target.getAttribute('data-tip')).split('\n').forEach(function (line, i) {
      var row = document.createElement('div');
      if (i === 0) row.className = 'tk-tip__title';
      row.textContent = line;
      t.appendChild(row);
    });
    t.hidden = false;
    var r = t.getBoundingClientRect();
    var left = Math.min(window.innerWidth - r.width - 8, Math.max(8, x + 12));
    var top = y - r.height - 12;
    if (top < 8) top = y + 16;
    t.style.left = left + 'px';
    t.style.top = top + 'px';
  }
  function hideTip() { if (tip) tip.hidden = true; }

  var activeMark = null;
  function markOn(el) {
    if (activeMark === el) return;
    markOff();
    activeMark = el;
    el.classList.add('is-hover');
    var g = el.closest('.tk-chart');
    if (g && el.hasAttribute('data-x')) {
      var line = g.querySelector('.tk-crosshair');
      if (line) {
        line.setAttribute('x1', el.getAttribute('data-x'));
        line.setAttribute('x2', el.getAttribute('data-x'));
        line.style.opacity = 1;
      }
      var dot = g.querySelector('.tk-crossdot');
      if (dot && el.hasAttribute('data-y')) {
        dot.setAttribute('cx', el.getAttribute('data-x'));
        dot.setAttribute('cy', el.getAttribute('data-y'));
        dot.style.opacity = 1;
      }
    }
  }
  function markOff() {
    if (!activeMark) return;
    activeMark.classList.remove('is-hover');
    var g = activeMark.closest('.tk-chart');
    if (g) {
      var line = g.querySelector('.tk-crosshair');
      if (line) line.style.opacity = 0;
      var dot = g.querySelector('.tk-crossdot');
      if (dot) dot.style.opacity = 0;
    }
    activeMark = null;
  }

  document.addEventListener('pointermove', function (e) {
    var el = e.target && e.target.closest ? e.target.closest('.tk-chart [data-tip]') : null;
    if (el) { markOn(el); showTip(el, e.clientX, e.clientY); } else { markOff(); hideTip(); }
  }, { passive: true });
  document.addEventListener('pointerdown', function (e) {
    var el = e.target && e.target.closest ? e.target.closest('.tk-chart [data-tip]') : null;
    if (el) { markOn(el); showTip(el, e.clientX, e.clientY); } else { markOff(); hideTip(); }
  }, { passive: true });
  window.addEventListener('scroll', function () { markOff(); hideTip(); }, { passive: true, capture: true });

  /* ------------------------------------------------------------ montare */

  // Desenează în `el` și redesenează când lățimea se schimbă.
  function mount(el, opts, draw, kind) {
    el.classList.add('tk-chart');
    if (kind) el.classList.add('tk-chart--' + kind);
    var lastW = -1;
    function render() {
      var w = Math.round(el.clientWidth) || opts.width || 480;
      if (w === lastW) return;
      lastW = w;
      el.innerHTML = draw(w);
    }
    render();
    if (el._tkRO) el._tkRO.disconnect();
    if (typeof ResizeObserver !== 'undefined') {
      el._tkRO = new ResizeObserver(function () { render(); });
      el._tkRO.observe(el);
    }
    return el;
  }

  function svgOpen(w, h, label) {
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h +
      '" role="img" aria-label="' + attrEsc(label || 'Grafic') + '" preserveAspectRatio="xMinYMin meet">';
  }

  function legendHTML(items) {
    return '<div class="tk-legend">' + items.map(function (it) {
      return '<span class="tk-legend__item"><span class="tk-swatch" style="background:' + it.color + '"></span>' +
        attrEsc(it.label) + (it.value != null ? ' <span class="tk-muted">' + attrEsc(it.value) + '</span>' : '') + '</span>';
    }).join('') + '</div>';
  }

  /* ---------------------------------------------------------------- donut */

  /*
   * Inel de progres.
   * opts: {value: 0..1 (sau value + max), top: 'PROGRES', main: '81,7%' (implicit procentul),
   *        sub: '304 / 372', color, size: 150, thickness: 14, label}
   */
  function donut(el, opts) {
    opts = opts || {};
    var ratio = opts.max != null ? TK.ratio(opts.value, opts.max) : (opts.value || 0);
    ratio = Math.max(0, ratio);
    var main = opts.main != null ? opts.main : TK.fmt.pct(ratio, 1);
    var label = opts.label || ((opts.top ? opts.top + ': ' : '') + main + (opts.sub ? ' (' + opts.sub + ')' : ''));
    return mount(el, opts, function (w) {
      var size = Math.min(opts.size || 150, w);
      var th = opts.thickness || Math.max(10, Math.round(size * 0.1));
      var r = (size - th) / 2, c = size / 2, circ = 2 * Math.PI * r;
      var shown = Math.min(ratio, 1);
      var s = svgOpen(size, size, label);
      s += '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" style="fill:none;stroke:var(--chart-track)" stroke-width="' + th + '"/>';
      if (shown > 0) {
        s += '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" style="fill:none;stroke:' + (opts.color || 'var(--chart-plan)') +
          '" stroke-width="' + th + '" stroke-dasharray="' + (circ * shown).toFixed(2) + ' ' + circ.toFixed(2) +
          '" transform="rotate(-90 ' + c + ' ' + c + ')" data-tip="' + attrEsc(label) + '"/>';
      }
      var inner = size - 2 * th;
      // textul central se micșorează ca să nu atingă inelul
      var fs = Math.min(Math.round(size * 0.14), Math.floor(inner * 0.8 / (Math.max(4, String(main).length) * 0.56)));
      var hasTop = !!opts.top, hasSub = !!opts.sub;
      var y = c + fs * 0.35 + (hasTop && !hasSub ? fs * 0.35 : 0) - (hasSub && !hasTop ? fs * 0.3 : 0);
      if (hasTop) {
        s += '<text x="' + c + '" y="' + (y - fs * 1.05) + '" text-anchor="middle" class="tk-chart__cap" style="fill:var(--ink-3);font-size:' +
          Math.max(8, Math.round(size * 0.06)) + 'px;letter-spacing:.08em">' + attrEsc(String(opts.top).toUpperCase()) + '</text>';
      }
      s += '<text x="' + c + '" y="' + y + '" text-anchor="middle" class="tk-chart__big" style="fill:' + (opts.mainColor || 'var(--terra)') +
        ';font-size:' + fs + 'px;font-weight:600">' + attrEsc(main) + '</text>';
      if (hasSub) {
        s += '<text x="' + c + '" y="' + (y + fs * 1.1) + '" text-anchor="middle" style="fill:var(--ink-2);font-size:' +
          Math.max(9, Math.round(size * 0.075)) + 'px">' + attrEsc(opts.sub) + '</text>';
      }
      return '<div class="tk-chart__center">' + s + '</svg></div>';
    }, 'donut');
  }

  /* ------------------------------------------------------------------ pie */

  /*
   * Plăcintă / inel pe categorii.
   * opts: {data: [{label, value, color}], hole: 0..0.8 (0 = plăcintă), format(v), legend: true|false,
   *        legendValues: true, size: 170, label, center: 'text în gol'}
   */
  function pie(el, opts) {
    opts = opts || {};
    var f = opts.format || fmt;
    var data = (opts.data || []).filter(function (d) { return d.value > 0; });
    var total = TK.sum(data, function (d) { return d.value; });
    return mount(el, opts, function (w) {
      var stack = w < 360 || opts.legendBelow;
      var size = Math.min(opts.size || 170, stack ? w : w * 0.5);
      var r = size / 2 - 2, c = size / 2, hole = (opts.hole || 0) * r;
      var s = svgOpen(size, size, opts.label || 'Distribuție');
      if (!total) {
        s += '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" style="fill:var(--chart-track)"/>';
        s += '<text x="' + c + '" y="' + (c + 4) + '" text-anchor="middle" style="fill:var(--ink-3);font-size:12px">Fără date</text>';
      } else if (data.length === 1) {
        var d0 = data[0], col0 = seriesColor(d0.color, 0);
        s += '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" style="fill:' + col0 + '" data-tip="' +
          attrEsc(d0.label + '\n' + f(d0.value) + ' · 100%') + '"/>';
      } else {
        var a0 = -Math.PI / 2;
        data.forEach(function (d, i) {
          var a1 = a0 + (d.value / total) * Math.PI * 2;
          var large = a1 - a0 > Math.PI ? 1 : 0;
          var x0 = c + r * Math.cos(a0), y0 = c + r * Math.sin(a0);
          var x1 = c + r * Math.cos(a1), y1 = c + r * Math.sin(a1);
          var path = 'M' + c + ',' + c + 'L' + x0.toFixed(2) + ',' + y0.toFixed(2) + 'A' + r + ',' + r + ' 0 ' + large + ' 1 ' + x1.toFixed(2) + ',' + y1.toFixed(2) + 'Z';
          s += '<path d="' + path + '" style="fill:' + seriesColor(d.color, i) + ';stroke:var(--surface)" stroke-width="2" stroke-linejoin="round" data-tip="' +
            attrEsc(d.label + '\n' + f(d.value) + ' · ' + TK.fmt.pct(d.value / total, 1)) + '"/>';
          a0 = a1;
        });
      }
      if (hole > 0) {
        s += '<circle cx="' + c + '" cy="' + c + '" r="' + hole + '" style="fill:var(--surface)"/>';
        if (opts.center) {
          s += '<text x="' + c + '" y="' + (c + 5) + '" text-anchor="middle" style="fill:var(--ink);font-size:' + Math.round(size * 0.1) + 'px;font-weight:600">' + attrEsc(opts.center) + '</text>';
        }
      }
      s += '</svg>';
      var legend = opts.legend === false ? '' : legendHTML(data.map(function (d, i) {
        return {
          label: d.label,
          color: seriesColor(d.color, i),
          value: opts.legendValues === false ? null : TK.fmt.pct(d.value / total, 1),
        };
      }));
      return '<div class="tk-chart__pie' + (stack ? ' is-stacked' : '') + '">' + s + legend + '</div>';
    }, 'pie');
  }

  /* ----------------------------------------------------------------- bars */

  /*
   * Bare verticale grupate.
   * opts: {labels: [...], series: [{name, values: [...], color}], height: 200, format(v),
   *        yFormat(v), yMax, axis: true, valueLabels: false, sublabels: [...] (rând sub etichete),
   *        colorFn(value, index, seriesIndex) -> culoare, legend: auto, label}
   */
  function bars(el, opts) {
    opts = opts || {};
    var f = opts.format || fmt;
    var yf = opts.yFormat || TK.fmt.leiShort;
    var labels = opts.labels || [];
    var series = opts.series || [];
    var multi = series.length > 1;
    return mount(el, opts, function (w) {
      var H = opts.height || 200;
      var axis = opts.axis !== false;
      var subH = opts.sublabels ? 14 : 0;
      var m = { l: axis ? 44 : 4, r: 4, t: opts.valueLabels ? 16 : 8, b: 18 + subH };
      var pw = Math.max(10, w - m.l - m.r), ph = H - m.t - m.b;
      var max = opts.yMax || 0;
      series.forEach(function (s) { s.values.forEach(function (v) { if (v > max) max = v; }); });
      var scale = niceScale(max || 1, 4);
      if (opts.yMax) scale = { max: opts.yMax, ticks: opts.yTicks || [0, opts.yMax / 2, opts.yMax] };
      var n = labels.length || 1;
      var band = pw / n;
      var groupW = band * (n > 20 ? 0.72 : 0.64);
      var gap = multi ? 2 : 0;
      var bw = Math.max(1, (groupW - gap * (series.length - 1)) / Math.max(1, series.length));
      var y = function (v) { return m.t + ph - (Math.max(0, v) / scale.max) * ph; };
      var s = svgOpen(w, H, opts.label || 'Grafic cu bare');
      if (axis) {
        scale.ticks.forEach(function (t) {
          var yy = y(t).toFixed(1);
          s += '<line x1="' + m.l + '" x2="' + (w - m.r) + '" y1="' + yy + '" y2="' + yy + '" style="stroke:var(--chart-grid)" stroke-width="1"/>';
          s += '<text x="' + (m.l - 6) + '" y="' + (+yy + 3) + '" text-anchor="end" style="fill:var(--ink-3);font-size:10px">' + attrEsc(yf(t)) + '</text>';
        });
      } else {
        s += '<line x1="' + m.l + '" x2="' + (w - m.r) + '" y1="' + (m.t + ph) + '" y2="' + (m.t + ph) + '" style="stroke:var(--chart-grid)" stroke-width="1"/>';
      }
      var every = Math.max(1, Math.ceil(n / Math.floor(pw / 22)));
      labels.forEach(function (lab, i) {
        var gx = m.l + band * i + (band - groupW) / 2;
        series.forEach(function (se, si) {
          var v = se.values[i] || 0;
          var x = gx + si * (bw + gap);
          var col = (opts.colorFn && opts.colorFn(v, i, si)) || seriesColor(se.color, si);
          var yy = y(v), hh = m.t + ph - yy;
          var tipTxt = (lab != null ? lab : '') + (opts.tipTitle ? opts.tipTitle(i) : '') + '\n' + (multi ? se.name + ': ' : '') + f(v);
          if (hh > 0.5) {
            s += '<path d="' + barPathV(x.toFixed(2), yy.toFixed(2), bw.toFixed(2), hh.toFixed(2), Math.min(4, bw / 2)) + '" style="fill:' + col + '"/>';
          }
          // zonă de hover mai mare decât bara
          s += '<rect x="' + x.toFixed(2) + '" y="' + m.t + '" width="' + bw.toFixed(2) + '" height="' + ph + '" style="fill:transparent" data-tip="' + attrEsc(tipTxt) + '"/>';
          if (opts.valueLabels && !multi) {
            s += '<text x="' + (x + bw / 2).toFixed(2) + '" y="' + (yy - 4).toFixed(2) + '" text-anchor="middle" style="fill:var(--ink-2);font-size:10px">' + attrEsc(f(v)) + '</text>';
          }
        });
        if (i % every === 0) {
          s += '<text x="' + (m.l + band * i + band / 2).toFixed(2) + '" y="' + (m.t + ph + 13) + '" text-anchor="middle" style="fill:var(--ink-3);font-size:10px">' + attrEsc(lab) + '</text>';
          if (opts.sublabels) {
            s += '<text x="' + (m.l + band * i + band / 2).toFixed(2) + '" y="' + (m.t + ph + 13 + subH) + '" text-anchor="middle" style="fill:var(--terra);font-size:9px">' + attrEsc(opts.sublabels[i]) + '</text>';
          }
        }
      });
      s += '</svg>';
      var legend = (opts.legend === true || (opts.legend !== false && multi))
        ? legendHTML(series.map(function (se, i) { return { label: se.name, color: seriesColor(se.color, i) }; }))
        : '';
      return legend + s;
    }, 'bars');
  }

  /* ---------------------------------------------------------------- hbars */

  /*
   * Bare orizontale grupate (ex. flux de numerar Plan vs Fapt).
   * opts: {labels, series: [{name, values, color}], format(v), xFormat(v), labelWidth, rowHeight, label}
   */
  function hbars(el, opts) {
    opts = opts || {};
    var f = opts.format || fmt;
    var xf = opts.xFormat || TK.fmt.leiShort;
    var labels = opts.labels || [];
    var series = opts.series || [];
    return mount(el, opts, function (w) {
      var lw = Math.min(opts.labelWidth || 104, Math.round(w * 0.36));
      var barH = opts.barHeight || 8, gap = 2;
      var rowH = opts.rowHeight || Math.max(24, series.length * (barH + gap) + 12);
      var m = { l: lw, r: 26, t: 4, b: 20 };
      var H = m.t + m.b + rowH * labels.length;
      var pw = Math.max(10, w - m.l - m.r);
      var max = 0;
      series.forEach(function (s) { s.values.forEach(function (v) { if (v > max) max = v; }); });
      var scale = niceScale(max || 1, w < 420 ? 2 : 4);
      var x = function (v) { return m.l + (Math.max(0, v) / scale.max) * pw; };
      var s = svgOpen(w, H, opts.label || 'Grafic cu bare orizontale');
      scale.ticks.forEach(function (t) {
        var xx = x(t).toFixed(1);
        s += '<line x1="' + xx + '" x2="' + xx + '" y1="' + m.t + '" y2="' + (H - m.b) + '" style="stroke:var(--chart-grid)" stroke-width="1"/>';
        s += '<text x="' + xx + '" y="' + (H - 6) + '" text-anchor="middle" style="fill:var(--ink-3);font-size:10px">' + attrEsc(xf(t)) + '</text>';
      });
      labels.forEach(function (lab, i) {
        var top = m.t + rowH * i;
        var blockH = series.length * barH + (series.length - 1) * gap;
        var by = top + (rowH - blockH) / 2;
        s += '<text x="' + (m.l - 8) + '" y="' + (top + rowH / 2 + 3.5).toFixed(1) + '" text-anchor="end" style="fill:var(--ink-2);font-size:11px">' + attrEsc(lab) + '</text>';
        var tipLines = [lab];
        series.forEach(function (se, si) { tipLines.push(se.name + ': ' + f(se.values[i] || 0)); });
        series.forEach(function (se, si) {
          var v = se.values[i] || 0;
          var yy = by + si * (barH + gap);
          var ww = x(v) - m.l;
          if (ww > 0.5) {
            s += '<path d="' + barPathH(m.l, yy.toFixed(2), ww.toFixed(2), barH, Math.min(4, barH / 2)) + '" style="fill:' + seriesColor(se.color, si) + '"/>';
          }
        });
        s += '<rect x="0" y="' + top + '" width="' + w + '" height="' + rowH + '" style="fill:transparent" data-tip="' + attrEsc(tipLines.join('\n')) + '"/>';
      });
      s += '</svg>';
      var legend = opts.legend === false ? '' : legendHTML(series.map(function (se, i) { return { label: se.name, color: seriesColor(se.color, i) }; }));
      return legend + s;
    }, 'hbars');
  }

  /* ----------------------------------------------------------------- area */

  /*
   * Curbă cu arie (dinamică pe zile).
   * opts: {labels, values (null = lipsă), max: 1, height: 150, format(v), color, fill, tips: [...] (text tooltip per punct), label}
   */
  function area(el, opts) {
    opts = opts || {};
    var f = opts.format || function (v) { return TK.fmt.pct(v, 0); };
    var labels = opts.labels || [];
    var values = opts.values || [];
    return mount(el, opts, function (w) {
      var H = opts.height || 150;
      var m = { l: 4, r: 4, t: 10, b: opts.axisLabels === false ? 6 : 18 };
      var pw = Math.max(10, w - m.l - m.r), ph = H - m.t - m.b;
      var n = values.length;
      var max = opts.max != null ? opts.max : Math.max.apply(null, values.filter(function (v) { return v != null; }).concat([1]));
      var band = pw / Math.max(1, n);
      var X = function (i) { return m.l + band * i + band / 2; };
      var Y = function (v) { return m.t + ph - (Math.min(max, Math.max(0, v)) / (max || 1)) * ph; };
      var pts = [];
      values.forEach(function (v, i) { if (v != null) pts.push([+X(i).toFixed(2), +Y(v).toFixed(2)]); });
      var col = opts.color || 'var(--chart-fact)';
      var s = svgOpen(w, H, opts.label || 'Dinamică');
      s += '<line x1="' + m.l + '" x2="' + (w - m.r) + '" y1="' + (m.t + ph) + '" y2="' + (m.t + ph) + '" style="stroke:var(--chart-grid)" stroke-width="1"/>';
      if (pts.length > 1) {
        var line = monotonePath(pts);
        var areaPath = line + 'L' + pts[pts.length - 1][0] + ',' + (m.t + ph) + 'L' + pts[0][0] + ',' + (m.t + ph) + 'Z';
        s += '<path d="' + areaPath + '" style="fill:' + (opts.fill || 'var(--rose-soft)') + '"/>';
        s += '<path d="' + line + '" style="fill:none;stroke:' + col + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
      } else if (pts.length === 1) {
        s += '<circle cx="' + pts[0][0] + '" cy="' + pts[0][1] + '" r="4" style="fill:' + col + '"/>';
      }
      s += '<line class="tk-crosshair" x1="0" x2="0" y1="' + m.t + '" y2="' + (m.t + ph) + '" style="stroke:var(--ink-3);opacity:0" stroke-width="1" stroke-dasharray="3 3"/>';
      s += '<circle class="tk-crossdot" cx="0" cy="0" r="4.5" style="fill:' + col + ';stroke:var(--surface);opacity:0" stroke-width="2"/>';
      var every = Math.max(1, Math.ceil(n / Math.floor(pw / 22)));
      values.forEach(function (v, i) {
        var tipTxt = (opts.tips && opts.tips[i]) || (String(labels[i] != null ? labels[i] : i + 1) + '\n' + (v == null ? '—' : f(v)));
        s += '<rect x="' + (m.l + band * i).toFixed(2) + '" y="' + m.t + '" width="' + band.toFixed(2) + '" height="' + ph +
          '" style="fill:transparent" data-x="' + X(i).toFixed(2) + '"' + (v != null ? ' data-y="' + Y(v).toFixed(2) + '"' : '') + ' data-tip="' + attrEsc(tipTxt) + '"/>';
        if (opts.axisLabels !== false && i % every === 0) {
          s += '<text x="' + X(i).toFixed(2) + '" y="' + (H - 5) + '" text-anchor="middle" style="fill:var(--ink-3);font-size:10px">' + attrEsc(labels[i]) + '</text>';
        }
      });
      return s + '</svg>';
    }, 'area');
  }

  /* --------------------------------------------------------------- legend */

  // Legendă HTML de sine stătătoare: TK.charts.legend([{label, color, value}]) -> Node
  function legend(items) {
    var wrap = document.createElement('div');
    wrap.innerHTML = legendHTML(items.map(function (it, i) {
      return { label: it.label, color: seriesColor(it.color, i), value: it.value };
    }));
    return wrap.firstChild;
  }

  TK.charts = {
    donut: donut,
    pie: pie,
    bars: bars,
    hbars: hbars,
    area: area,
    legend: legend,
    color: seriesColor,
    niceScale: niceScale,
  };
})();

<script>
/*
 * Tracker financiar — venituri, cheltuieli, facturi, datorii și economii (plan vs fapt).
 *
 * Forma stării (JSON simplu):
 * {
 *   categories: { venit: [nume…], cheltuiala: […], factura: […], datorie: […], economie: […] },
 *                 // ordinea = ordinea de afișare; culoarea din grafice = indexul în listă
 *   transactions: [{ id, date: 'YYYY-MM-DD', type: 'venit'|'cheltuiala'|'factura'|'datorie'|'economie',
 *                    category, amount (număr pozitiv), note, auto? }],   // auto: plată introdusă în coloana „Achitat”
 *   plans: { 'YYYY-MM': { venit: {categorie: sumă}, cheltuiala: {…}, factura: {…}, datorie: {…}, economie: {…} } },
 *   bills: { [categorie factură]: { dueDay } },            // TERMEN = ziua din lună
 *   debts: { [categorie datorie]: { dueDay, total } },      // total = suma inițială a creditului (opțional)
 *   goals: { [categorie economie]: { target } },            // ținta de acumulat
 *   openingBalance: număr,                                   // soldul dinaintea primei luni
 *   noPlan: { [tip]: true },                                 // tabele fără coloana „Plan” (doar „Achitat”)
 *   noPlanCats: { [tip]: { [categorie]: true } },            // categorii fără plan (sumă fixă): Plan „—”, needitabil
 *   parents: { [tip]: { [subcategorie]: categorie-grupă } }, // subcategorii (un singur nivel): ex. Mașină → Ulei, Combustibil
 *                 // Rândul grupei arată suma subcategoriilor (plus sumele puse direct pe grupă); se editează subcategoriile.
 *   monthCats: { 'YYYY-MM': { venit: [nume…] } },           // sursele de venit adăugate explicit într-o lună
 *                 // Veniturile sunt pe lună: o sursă apare într-o lună doar dacă a fost adăugată acolo sau are plan / sume
 *                 // în acea lună; ștergerea dintr-o lună nu atinge celelalte luni (lista globală rămâne în Setări).
 *   notes: { 'YYYY': 'text' }                                // notițele din rezumatul anual
 * }
 * „Sold reportat” al unei luni = openingBalance + (venituri − toate ieșirile) din toate lunile anterioare.
 * „Acumulat” la economii = suma tuturor tranzacțiilor „economie” ale categoriei până la sfârșitul lunii văzute.
 * Luna / anul selectate și filtrele stau în api.prefs (nu în stare).
 */
(function () {
  'use strict';

  var TK = window.TK;
  var h = TK.h;
  var fmt = TK.fmt;
  var D = TK.date;

  var TYPES = ['venit', 'cheltuiala', 'factura', 'datorie', 'economie'];
  // tipurile ale căror categorii se aleg separat în fiecare lună
  var PER_MONTH = ['venit'];
  function perMonth(type) { return PER_MONTH.indexOf(type) !== -1; }
  var OUT = ['cheltuiala', 'factura', 'datorie', 'economie'];
  var LABEL = { venit: 'Venit', cheltuiala: 'Cheltuială', factura: 'Factură', datorie: 'Datorie', economie: 'Economie' };
  var PLURAL = { venit: 'Venituri', cheltuiala: 'Cheltuieli', factura: 'Facturi', datorie: 'Datorii', economie: 'Economii' };
  var TONE = { venit: 'good', cheltuiala: 'rose', factura: 'terra', datorie: 'gold', economie: 'blue' };
  // mod procent: 'out' = mai puțin e mai bine (depășirea e marcată), 'in' = mai mult e mai bine
  var MODE = { venit: 'in', cheltuiala: 'out', factura: 'out', datorie: 'out', economie: 'in' };
  var PALETTE = [
    'var(--chart-1)', 'var(--chart-2)', 'var(--chart-3)', 'var(--chart-4)',
    'var(--chart-5)', 'var(--chart-6)', 'var(--chart-7)', 'var(--chart-8)',
  ];
  // eticheta coloanei cu suma realizată: la venituri „Încasat”, la restul „Achitat”
  var PAID_LABEL = { venit: 'Încasat', cheltuiala: 'Achitat', factura: 'Achitat', datorie: 'Achitat', economie: 'Achitat' };
  var FLOW_COLOR = { cheltuiala: 'var(--chart-fact)', factura: 'var(--chart-3)', datorie: 'var(--chart-6)', economie: 'var(--chart-1)', ramas: 'var(--chart-4)' };
  var MONTHS = D.MONTHS;

  /* ------------------------------------------------------------ utilitare */

  function r2(n) { return Math.round((+n || 0) * 100) / 100; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymOf(y, m) { return y + '-' + pad(m + 1); }
  function ymParts(ym) { return { y: +ym.slice(0, 4), m: +ym.slice(5, 7) - 1 }; }
  function addMonths(ym, n) {
    var p = ymParts(ym);
    var t = p.y * 12 + p.m + n;
    return ymOf(Math.floor(t / 12), ((t % 12) + 12) % 12);
  }
  function isYm(v) { return typeof v === 'string' && /^\d{4}-(0[1-9]|1[0-2])$/.test(v); }
  function todayYm() { return D.ym(D.today()); }
  function sumObj(o) {
    var s = 0;
    if (o) for (var k in o) if (Object.prototype.hasOwnProperty.call(o, k)) s += +o[k] || 0;
    return s;
  }
  function money(v) { return v ? fmt.num(v) : '—'; }
  function periodText(ym) {
    var p = ymParts(ym);
    return fmt.date(D.make(p.y, p.m, 1)) + ' – ' + fmt.date(D.make(p.y, p.m, D.daysInMonth(p.y, p.m)));
  }

  /* ---------------------------------------------------------- agregare */

  function emptyBucket() {
    var b = { tot: {}, n: 0 };
    TYPES.forEach(function (t) { b[t] = {}; b.tot[t] = 0; });
    return b;
  }

  // Parcurge o singură dată tranzacțiile: ym -> {tip: {categorie: sumă}, tot: {tip: sumă}}
  function buildIndex(state) {
    var months = {};
    var list = state.transactions || [];
    for (var i = 0; i < list.length; i++) {
      var t = list[i];
      if (!t || !t.date || TYPES.indexOf(t.type) === -1) continue;
      var ym = t.date.slice(0, 7);
      var b = months[ym] || (months[ym] = emptyBucket());
      var a = +t.amount || 0;
      b[t.type][t.category] = (b[t.type][t.category] || 0) + a;
      b.tot[t.type] += a;
      b.n++;
    }
    var keys = Object.keys(months).sort();
    var run = +state.openingBalance || 0;
    var before = {}; // ym -> sold la începutul lunii (doar pt lunile cu date)
    keys.forEach(function (k) {
      before[k] = run;
      run += netOf(months[k].tot);
    });
    return { months: months, keys: keys, before: before, end: run, opening: +state.openingBalance || 0 };
  }

  function netOf(tot) {
    return tot.venit - tot.cheltuiala - tot.factura - tot.datorie - tot.economie;
  }

  function openingFor(idx, ym) {
    var s = idx.opening;
    for (var i = 0; i < idx.keys.length; i++) {
      var k = idx.keys[i];
      if (k >= ym) break;
      s += netOf(idx.months[k].tot);
    }
    return s;
  }

  function monthModel(state, idx, ym) {
    var b = idx.months[ym] || emptyBucket();
    var p = (state.plans || {})[ym] || {};
    var m = { ym: ym, fact: {}, plan: {}, planTot: {}, planEff: {}, factTot: {}, n: b.n };
    var noPlan = state.noPlan || {}, noPlanCats = state.noPlanCats || {};
    TYPES.forEach(function (t) {
      m.fact[t] = b[t];
      m.plan[t] = p[t] || {};
      m.planTot[t] = sumObj(p[t]);
      m.factTot[t] = b.tot[t];
      // sumele fixe (tabel fără plan sau categorie „fără plan”) contează în plan cu cât s-a plătit
      var fixed = noPlan[t] ? b.tot[t] : sumObj(Object.keys(noPlanCats[t] || {}).reduce(function (o, c) { o[c] = b[t][c] || 0; return o; }, {}));
      m.planEff[t] = m.planTot[t] + fixed;
    });
    m.factOut = m.factTot.cheltuiala + m.factTot.factura + m.factTot.datorie + m.factTot.economie;
    m.planOut = m.planEff.cheltuiala + m.planEff.factura + m.planEff.datorie + m.planEff.economie;
    m.opening = openingFor(idx, ym);
    m.closing = m.opening + m.factTot.venit - m.factOut;
    m.planClosing = m.opening + m.planEff.venit - m.planOut;
    m.hasPlan = TYPES.some(function (t) { return Object.keys(m.plan[t]).length > 0; });
    return m;
  }

  function yearModel(state, idx, y) {
    var Y = { y: y, months: [], plan: {}, planEff: {}, fact: {}, planCat: {}, factCat: {}, hasPlan: false };
    TYPES.forEach(function (t) { Y.plan[t] = 0; Y.planEff[t] = 0; Y.fact[t] = 0; Y.planCat[t] = {}; Y.factCat[t] = {}; });
    for (var m = 0; m < 12; m++) {
      var mm = monthModel(state, idx, ymOf(y, m));
      Y.months.push(mm);
      TYPES.forEach(function (t) {
        Y.plan[t] += mm.planTot[t];
        Y.planEff[t] += mm.planEff[t];
        Y.fact[t] += mm.factTot[t];
        var k;
        for (k in mm.plan[t]) Y.planCat[t][k] = (Y.planCat[t][k] || 0) + (+mm.plan[t][k] || 0);
        for (k in mm.fact[t]) Y.factCat[t][k] = (Y.factCat[t][k] || 0) + mm.fact[t][k];
      });
    }
    Y.hasPlan = Y.months.some(function (mm) { return mm.hasPlan; });
    Y.planOut = Y.planEff.cheltuiala + Y.planEff.factura + Y.planEff.datorie + Y.planEff.economie;
    Y.factOut = Y.fact.cheltuiala + Y.fact.factura + Y.fact.datorie + Y.fact.economie;
    Y.opening = Y.months[0].opening;
    Y.closing = Y.opening + Y.fact.venit - Y.factOut;
    Y.planClosing = Y.opening + Y.planEff.venit - Y.planOut;
    return Y;
  }

  // sumă cumulată pe categorie (până la o dată inclusiv), pentru economii / datorii
  function cumulative(state, type, cat, untilIso) {
    var s = 0, list = state.transactions;
    for (var i = 0; i < list.length; i++) {
      var t = list[i];
      if (t.type === type && t.category === cat && t.date <= untilIso) s += +t.amount || 0;
    }
    return s;
  }

  /* ---------------------------------------------------------- demo & gol */

  var DEFAULT_CATS = {
    venit: ['Salariu', 'Afacere', 'Proiecte extra', 'Dobânzi la depozit'],
    cheltuiala: ['Alimente', 'Transport', 'Casă', 'Îmbrăcăminte', 'Sănătate', 'Îngrijire personală', 'Educație', 'Cadouri',
      'Animale de companie', 'Restaurante și cafenele', 'Distracție', 'Dezvoltare personală'],
    factura: ['Internet', 'Electricitate', 'Apă', 'Telefonie mobilă', 'Gaz', 'Încălzire'],
    datorie: ['Credit de consum', 'Ipotecă', 'Credit auto'],
    economie: ['Vacanță', 'Nuntă', 'Mașină', 'Acțiuni', 'Criptomonede', 'Renovare apartament', 'MacBook'],
  };
  var DEFAULT_BILLS = { 'Internet': 3, 'Telefonie mobilă': 8, 'Electricitate': 10, 'Apă': 12, 'Gaz': 15, 'Încălzire': 18 };
  var DEFAULT_DEBTS = { 'Credit de consum': { dueDay: 1, total: 36000 }, 'Ipotecă': { dueDay: 10, total: 900000 }, 'Credit auto': { dueDay: 15, total: 120000 } };
  var DEFAULT_GOALS = { 'Vacanță': 15000, 'Nuntă': 20000, 'Mașină': 15000, 'Acțiuni': 10000, 'Criptomonede': 5000, 'Renovare apartament': 40000, 'MacBook': 30000 };

  function baseState() {
    var s = {
      categories: TK.clone(DEFAULT_CATS),
      transactions: [],
      plans: {},
      bills: {},
      debts: {},
      goals: {},
      openingBalance: 0,
      notes: {},
    };
    Object.keys(DEFAULT_BILLS).forEach(function (k) { s.bills[k] = { dueDay: DEFAULT_BILLS[k] }; });
    Object.keys(DEFAULT_DEBTS).forEach(function (k) { s.debts[k] = { dueDay: DEFAULT_DEBTS[k].dueDay, total: 0 }; });
    Object.keys(DEFAULT_GOALS).forEach(function (k) { s.goals[k] = { target: 0 }; });
    return s;
  }

  function createEmpty() { return baseState(); }

  function mulberry32(seed) {
    return function () {
      seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function createDemo() {
    var s = baseState();
    var today = D.today();
    var Y = D.year(today), CM = D.month(today), TD = D.day(today);
    var rnd = mulberry32(20260101 + Y);
    function rr(a, b, step) { step = step || 1; return Math.round((a + rnd() * (b - a)) / step) * step; }
    function pick(arr) { return arr[Math.floor(rnd() * arr.length)]; }
    var seq = 0;
    var tx = [];

    Object.keys(DEFAULT_DEBTS).forEach(function (k) { s.debts[k] = TK.clone(DEFAULT_DEBTS[k]); });
    Object.keys(DEFAULT_GOALS).forEach(function (k) { s.goals[k] = { target: DEFAULT_GOALS[k] }; });
    s.openingBalance = 18500;
    s.notes[String(Y)] = 'Obiectiv: fond de urgență de 3 salarii până în decembrie.\nDin octombrie: +500 lei lunar la „Renovare apartament”.\nVerifică tarifele la gaz înainte de sezonul rece.';

    var cold = [0, 1, 2, 10, 11];
    var saved = {};
    Object.keys(DEFAULT_GOALS).forEach(function (k) { saved[k] = 0; });

    for (var m = 0; m <= CM; m++) {
      var dim = D.daysInMonth(Y, m);
      var limit = m === CM ? TD : dim;
      var add = function (day, type, cat, amount, note) {
        day = Math.max(1, Math.min(dim, day));
        if (day > limit || !(amount > 0)) return;
        seq++;
        tx.push({ id: 'd' + seq.toString(36), date: D.make(Y, m, day), type: type, category: cat, amount: r2(amount), note: note || '' });
      };
      var isCold = cold.indexOf(m) !== -1;

      // venituri
      add(5, 'venit', 'Salariu', m >= 6 ? 23500 : 22000, 'Salariu net');
      add(20, 'venit', 'Afacere', rr(6000, 9000, 100), 'Încasări magazin online');
      if (rnd() < 0.55) add(rr(12, 25), 'venit', 'Proiecte extra', rr(2500, 6000, 100), pick(['Proiect freelance', 'Traduceri', 'Consultanță']));
      add(28, 'venit', 'Dobânzi la depozit', rr(280, 330, 0.01), 'Dobândă depozit la termen');

      // facturi
      add(3, 'factura', 'Internet', 250, 'Abonament internet');
      add(8, 'factura', 'Telefonie mobilă', rnd() < 0.3 ? 165 : 150, 'Abonament mobil');
      add(10, 'factura', 'Electricitate', isCold ? rr(640, 760, 0.01) : rr(480, 620, 0.01), 'Energie electrică');
      add(12, 'factura', 'Apă', rr(215, 285, 0.01), 'Apă și canalizare');
      add(15, 'factura', 'Gaz', isCold ? rr(900, 1500, 0.01) : (m === 3 || m === 9 ? rr(380, 600, 0.01) : rr(150, 250, 0.01)), 'Gaze naturale');
      if (isCold) add(18, 'factura', 'Încălzire', rr(1800, 2600, 0.01), 'Agent termic');
      else if (m === 3) add(18, 'factura', 'Încălzire', rr(800, 1000, 0.01), 'Agent termic');

      // datorii
      add(1, 'datorie', 'Credit de consum', 3000, 'Rată lunară');
      add(10, 'datorie', 'Ipotecă', 7500, 'Rată ipotecă');
      add(15, 'datorie', 'Credit auto', 4000, 'Rată credit auto');

      // economii (se opresc când ținta e atinsă)
      var saveTo = function (day, cat, amount, note) {
        var left = DEFAULT_GOALS[cat] - saved[cat];
        var a = Math.min(amount, left);
        if (a <= 0 || day > limit) return;
        saved[cat] += a;
        add(day, 'economie', cat, a, note);
      };
      saveTo(6, 'Vacanță', 2000, 'Pușculița de vacanță');
      saveTo(6, 'Nuntă', 1500, 'Cont economii nuntă');
      saveTo(21, 'Mașină', 1000, 'Avans mașină');
      if (rnd() < 0.6) saveTo(21, 'Acțiuni', 1000, 'ETF global');
      if (rnd() < 0.4) saveTo(25, 'Criptomonede', 500, 'Cumpărare lunară');
      if (m % 2 === 0) saveTo(6, 'Renovare apartament', 1000, 'Fond renovare');
      saveTo(25, 'MacBook', 800, 'Pentru laptop nou');

      // cheltuieli
      var n, i;
      n = 7 + Math.floor(rnd() * 3);
      for (i = 0; i < n; i++) add(rr(1, dim), 'cheltuiala', 'Alimente', rr(180, 520, 0.1), pick(['Supermarket', 'Piața Centrală', 'Brutărie', 'Cumpărături săptămânale', 'Fructe și legume']));
      for (i = 0; i < 4; i++) add(rr(1, dim), 'cheltuiala', 'Transport', rr(100, 350, 1), pick(['Carburant', 'Taxi', 'Parcare', 'Carburant', 'Spălătorie auto']));
      n = 1 + (rnd() < 0.5 ? 1 : 0);
      for (i = 0; i < n; i++) add(rr(1, dim), 'cheltuiala', 'Casă', rr(150, 900, 1), pick(['Detergenți și consumabile', 'Veselă', 'Reparație robinet', 'Lenjerie de pat']));
      if (rnd() < 0.55) add(rr(1, dim), 'cheltuiala', 'Îmbrăcăminte', rr(400, 1600, 10), pick(['Încălțăminte', 'Geacă', 'Haine copii', 'Blugi']));
      if (rnd() < 0.6) add(rr(1, dim), 'cheltuiala', 'Sănătate', rr(150, 700, 1), pick(['Farmacie', 'Analize', 'Stomatolog', 'Vitamine']));
      add(rr(1, dim), 'cheltuiala', 'Îngrijire personală', rr(200, 450, 10), pick(['Frizerie', 'Cosmetice', 'Manichiură']));
      if (rnd() < 0.5) add(rr(1, dim), 'cheltuiala', 'Educație', rr(250, 600, 10), pick(['Cărți', 'Curs online', 'Rechizite']));
      if (rnd() < 0.45 || m === 2) add(rr(1, dim), 'cheltuiala', 'Cadouri', rr(200, 800, 10), pick(['Cadou zi de naștere', 'Flori', 'Cadou nuntă prieteni']));
      add(rr(1, dim), 'cheltuiala', 'Animale de companie', rr(180, 450, 1), pick(['Hrană pisică', 'Veterinar', 'Nisip și accesorii']));
      for (i = 0; i < 3; i++) add(rr(1, dim), 'cheltuiala', 'Restaurante și cafenele', rr(120, 450, 1), pick(['Cafenea', 'Cină în oraș', 'Prânz de afaceri', 'Pizza acasă']));
      n = 1 + (rnd() < 0.5 ? 1 : 0);
      for (i = 0; i < n; i++) add(rr(1, dim), 'cheltuiala', 'Distracție', rr(100, 400, 10), pick(['Cinema', 'Concert', 'Bowling', 'Teatru']));
      add(rr(1, dim), 'cheltuiala', 'Dezvoltare personală', rr(250, 700, 10), pick(['Sală de sport', 'Abonament aplicație', 'Atelier fotografie']));
    }

    tx.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    s.transactions = tx;

    // planuri pentru toate lunile anului
    for (var pm = 0; pm < 12; pm++) {
      var c = cold.indexOf(pm) !== -1;
      s.plans[ymOf(Y, pm)] = {
        venit: { 'Salariu': pm >= 6 ? 23500 : 22000, 'Afacere': 7000, 'Proiecte extra': 3000, 'Dobânzi la depozit': 300 },
        cheltuiala: {
          'Alimente': 3000, 'Transport': 900, 'Casă': 700, 'Îmbrăcăminte': 600, 'Sănătate': 400, 'Îngrijire personală': 350,
          'Educație': 300, 'Cadouri': pm === 11 ? 1500 : 300, 'Animale de companie': 300, 'Restaurante și cafenele': 500,

  // Curăță datele (inclusiv cele importate): nu trebuie să blocheze niciodată trackerul.

  function validIso(v) {
    if (typeof v !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(v)) return false;
    var y = +v.slice(0, 4), m = +v.slice(5, 7), d = +v.slice(8, 10);
    return y >= 1900 && y <= 2200 && m >= 1 && m <= 12 && d >= 1 && d <= D.daysInMonth(y, m - 1);

    var base = baseState();
    // categorii: liste de nume unice, nevide
    var hadCats = isObj(s.categories);
    var cats = {};
    TYPES.forEach(function (t) {
      var src = hadCats && Array.isArray(s.categories[t]) ? s.categories[t] : (hadCats ? [] : base.categories[t]);

      src.forEach(function (c) { c = catName(c); if (c && out.indexOf(c) === -1) out.push(c); });

    function ensureCat(t, c) { if (cats[t].indexOf(c) === -1) cats[t].push(c); }

    // tranzacții: dată ISO validă, tip cunoscut, sumă pozitivă
    var seen = {};
    s.transactions = (Array.isArray(s.transactions) ? s.transactions : []).filter(function (t) {
      return isObj(t) && validIso(t.date) && TYPES.indexOf(t.type) !== -1 && posNum(t.amount) != null;
    }).map(function (t) {
      var c = catName(t.category) || 'Fără categorie';

    var plans = {};

      Object.keys(s.plans).forEach(function (ym) {
        var p = s.plans[ym];
        if (!isYm(ym) || !isObj(p)) return;
        var outP = {};
        TYPES.forEach(function (t) {
          if (!isObj(p[t])) return;
          var o = {};
          Object.keys(p[t]).forEach(function (k) {

    function day(v) { var n = +v; return isFinite(n) && n >= 1 && n <= 31 && n % 1 === 0 ? n : null; }

    function cleanMap(src, type, fn) {

    }

    s.debts = cleanMap(s.debts, 'datorie', function (o) { return { dueDay: day(o.dueDay), total: nonNeg(o.total) }; });

    if (isObj(s.monthCats)) Object.keys(s.monthCats).forEach(function (ym) {

  // culori fixe pe entitate; la coliziune (mai multe entități decât culori) trece la următoarea liberă
  function assignColors(items) {

  /* ----------------------------------------------------------- montare */

    /* ---- categorii: redenumire / ștergere / editare (Setări și direct din tabele) ---- */
    function usage(type, cat) {

      s.transactions.forEach(function (t) { if (t.type === type && t.category === cat) { n++; sum += +t.amount || 0; } });
      Object.keys(s.plans).forEach(function (k) { var p = s.plans[k][type]; if (p && p[cat]) months++; });
      return { n: n, sum: sum, months: months };
    }
    /* ---- grupe: categorie → subcategorii (un singur nivel) ---- */
    function parentMap(type) { return (S().parents || {})[type] || {}; }
    function parentOf(type, c) { return parentMap(type)[c] || null; }
    function kidsOf(type, c) { var pm = parentMap(type); return S().categories[type].filter(function (k) { return pm[k] === c; }); }
    function setParent(type, c, parent) {

    // Rândurile în ordinea de afișare: fiecare grupă urmată de subcategoriile ei (vizibile).

    function grouped(type, cats) {

      var out = [];

        kids.forEach(function (k) { if (show[k]) out.push({ c: k, depth: 1, kids: [] }); });

    function rollup(type, map) {

      var plan = (s.plans[ym] || {})[type] || {};

    }

    function pinCat(ym, type, cat) {

    // Scoate o categorie dintr-o singură lună: planul, sumele și fixarea din acea lună. Celelalte luni rămân.
    function removeFromMonth(type, cat, ym) {
      var s = S();

      s.transactions = s.transactions.filter(function (t) { return !(t.type === type && t.category === cat && t.date.slice(0, 7) === ym); });
      api.commit();
    }
    function askRemoveFromMonth(type, cat, ym, after) {
      var s = S();
      var p = ymParts(ym), label = fmt.monthYear(p.y, p.m).toLowerCase();
      var tx = s.transactions.filter(function (t) { return t.type === type && t.category === cat && t.date.slice(0, 7) === ym; });
      var plan = +(((s.plans[ym] || {})[type] || {})[cat]) || 0;
      var done = function () {
