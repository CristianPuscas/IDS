        if (after) after();
      };
      if (!tx.length && !plan) { done(); return; }
      var parts = [];
      if (plan) parts.push('planul de ' + fmt.lei(plan));
      if (tx.length) parts.push(tx.length + (tx.length === 1 ? ' sumă încasată' : ' sume încasate') + ' (' + fmt.lei(TK.sum(tx, function (t) { return +t.amount || 0; })) + ')');
      TK.ui.confirm({
        title: 'Scoți „' + cat + '” din ' + label + '?',
        text: 'Se șterg doar din ' + label + ': ' + parts.join(' și ') + '. În celelalte luni „' + cat + '” rămâne neschimbat.',
        ok: 'Scoate din ' + label, danger: true,
      }).then(function (yes) { if (yes) done(); });
    }

    function extraMap(type) { return type === 'factura' ? 'bills' : type === 'datorie' ? 'debts' : type === 'economie' ? 'goals' : null; }

    function isNoPlanCat(type, cat) { return !!(S().noPlanCats[type] || {})[cat]; }
    function setNoPlanCat(type, cat, on) {
      var s = S();
      var m = s.noPlanCats[type] || (s.noPlanCats[type] = {});
      if (on) m[cat] = true; else delete m[cat];
      if (!Object.keys(m).length) delete s.noPlanCats[type];
    }
    function rename(type, oldN, newN) {
      var s = S();
      if (isNoPlanCat(type, oldN)) { setNoPlanCat(type, oldN, false); setNoPlanCat(type, newN, true); }
      var cats = s.categories[type];
      cats[cats.indexOf(oldN)] = newN;
      s.transactions.forEach(function (t) { if (t.type === type && t.category === oldN) t.category = newN; });
      Object.keys(s.plans).forEach(function (k) {
        var p = s.plans[k][type];
        if (p && Object.prototype.hasOwnProperty.call(p, oldN)) { p[newN] = p[oldN]; delete p[oldN]; }
      });
      var mk = extraMap(type);
      if (mk && s[mk][oldN]) { s[mk][newN] = s[mk][oldN]; delete s[mk][oldN]; }
      Object.keys(s.monthCats).forEach(function (k) {
        var arr = s.monthCats[k][type];
        if (arr && arr.indexOf(oldN) !== -1) arr[arr.indexOf(oldN)] = newN;
      });
      var pm = s.parents[type];
      if (pm) {
        if (pm[oldN]) { pm[newN] = pm[oldN]; delete pm[oldN]; }
        Object.keys(pm).forEach(function (k) { if (pm[k] === oldN) pm[k] = newN; });
      }
      prefsCategoryChanged(type, oldN, newN);
      api.commit();
    }
    function remove(type, cat) {
      var s = S();
      setNoPlanCat(type, cat, false);
      s.categories[type] = s.categories[type].filter(function (c) { return c !== cat; });
      s.transactions = s.transactions.filter(function (t) { return !(t.type === type && t.category === cat); });
      Object.keys(s.plans).forEach(function (k) {
        var p = s.plans[k];
        if (p[type]) { delete p[type][cat]; if (!Object.keys(p[type]).length) delete p[type]; }
        if (!Object.keys(p).length) delete s.plans[k];
      });
      var mk = extraMap(type);
      if (mk) delete s[mk][cat];
      Object.keys(s.monthCats).forEach(function (k) { unpinCat(k, type, cat); });
      // subcategoriile unei grupe șterse devin categorii principale
      setParent(type, cat, null);
      kidsOf(type, cat).forEach(function (k) { setParent(type, k, null); });
      prefsCategoryChanged(type, cat, null);
      api.commit();
    }

    function askRemove(type, cat, after) {
      var u = usage(type, cat);
      if (!u.n && !u.months) {
        remove(type, cat);
        TK.ui.toast('Categoria „' + cat + '” a fost ștearsă.');
        if (after) after();
        return;
      }
      var parts = [];
      if (u.n) parts.push(u.n + (u.n === 1 ? ' tranzacție' : ' tranzacții') + ' în valoare de ' + fmt.lei(u.sum));
      if (u.months) parts.push('sume planificate în ' + u.months + (u.months === 1 ? ' lună' : ' luni'));
      TK.ui.confirm({
        title: 'Ștergi categoria „' + cat + '”?',
        text: 'Categoria are ' + parts.join(' și ') + '. Dacă o ștergi, se șterg și acestea, iar totalurile lunilor respective vor scădea. Ca să le păstrezi, redenumește categoria în loc s-o ștergi.',
        ok: 'Șterge categoria și datele ei', danger: true,
      }).then(function (yes) {
        if (!yes) return;
        remove(type, cat);
        TK.ui.toast('Categoria „' + cat + '” și datele ei au fost șterse.');
        if (after) after();
      });
    }

    var NOUN = { venit: 'sursă de venit', cheltuiala: 'categorie', factura: 'factură', datorie: 'credit', economie: 'obiectiv' };

    // Formular pentru o categorie: nouă (cat = null) sau existentă. ym = luna pentru câmpul „Plan”.
    function categoryForm(type, cat, ym, after) {
      var s = S();
      var mk = extraMap(type);
      var ex = cat && mk ? (s[mk][cat] || {}) : {};
      var plan = cat && ym ? +(((s.plans[ym] || {})[type] || {})[cat]) || null : null;
      var p = ym ? ymParts(ym) : null;
      var monthly = perMonth(type) && !!ym;
      // la veniturile pe lună: sursele create deja (în alte luni) care nu apar încă în luna aceasta
      var existing = monthly && !cat ? s.categories[type].filter(function (c) { return visibleCats(type, ym).indexOf(c) === -1; }) : [];
      var fields = [];
      if (existing.length) {
        fields.push({
          name: 'pick', label: 'Alege o sursă creată deja', type: 'select', value: '',
          options: [{ value: '', label: '— sursă nouă (scrie numele mai jos) —' }].concat(existing.map(function (c) { return { value: c, label: c }; })),
        });
      }
      fields.push({
        name: 'name', label: existing.length ? 'Sau scrie o sursă nouă' : 'Nume', type: 'text', value: cat || '', required: !existing.length,
        placeholder: type === 'factura' ? 'ex. Televiziune' : type === 'venit' ? 'ex. Salariu' : '',
        hint: monthly && !cat ? 'Se adaugă doar în ' + fmt.monthYear(ymParts(ym).y, ymParts(ym).m).toLowerCase() + '.' : null,
      });
      // grupa: orice categorie principală de același tip (o grupă nu poate fi pusă într-o altă grupă)
      var isGroup = !!cat && kidsOf(type, cat).length > 0;
      var groupOpts = s.categories[type].filter(function (c) { return c !== cat && !parentOf(type, c); });
      if (!isGroup && groupOpts.length) {
        fields.push({
          name: 'parent', label: 'Face parte din grupa', type: 'select', value: cat ? (parentOf(type, cat) || '') : '',
          options: [{ value: '', label: '— niciuna (categorie principală) —' }].concat(groupOpts.map(function (c) { return { value: c, label: c }; })),
          hint: 'Alege o categorie ca să o transformi în grupă, iar aceasta devine subcategoria ei (ex. Mașină → Ulei).',
        });
      }
      if (type === 'factura' || type === 'datorie') fields.push({ name: 'due', label: 'Termen (ziua din lună)', type: 'number', value: ex.dueDay || null, placeholder: '1–31' });
      if (type === 'datorie') fields.push({ name: 'total', label: 'Total credit (lei)', type: 'money', value: ex.total || null, hint: 'Opțional: pentru „Rămas de plătit”.' });
      if (type === 'economie') fields.push({ name: 'target', label: 'Țintă (lei)', type: 'money', value: ex.target || null });
      var showPlan = !!p && !s.noPlan[type] && !isGroup;
      if (showPlan) {
        fields.push({ name: 'noPlanCat', label: 'Fără plan (sumă fixă): completez doar „' + PAID_LABEL[type] + '”', type: 'checkbox', value: cat ? isNoPlanCat(type, cat) : false });
        fields.push({ name: 'plan', label: 'Plan pentru ' + fmt.monthYear(p.y, p.m).toLowerCase() + ' (lei)', type: 'money', value: plan });
        fields.push({ name: 'allMonths', label: monthly ? 'Adaugă-l cu același plan în toate lunile din ' + p.y : 'Același plan în toate lunile din ' + p.y, type: 'checkbox', value: !cat && !monthly });
      }
      TK.ui.form({
        title: cat ? 'Editează „' + cat + '”' : 'Adaugă ' + NOUN[type],
        fields: fields,
        submit: cat ? 'Salvează' : 'Adaugă',
        onDelete: !!cat,
        deleteLabel: monthly ? 'Scoate din lună' : 'Șterge',
        validate: function (v) {
          if (v.pick) v.name = v.pick;
          if (!v.name) return 'Alege o sursă din listă sau scrie numele uneia noi.';
          var name = v.name.replace(/\s+/g, ' ');
          if (name !== cat && S().categories[type].indexOf(name) !== -1) {
            // la veniturile pe lună, o sursă existentă se poate adăuga într-o lună în care nu apare încă
            if (!(monthly && !cat && visibleCats(type, ym).indexOf(name) === -1)) return 'Există deja „' + name + '”' + (monthly ? ' în această lună.' : '.');
          }
          if (v.due != null && (v.due < 1 || v.due > 31 || v.due % 1)) return 'Termenul este o zi din lună, de la 1 la 31.';
          if ((v.total != null && v.total < 0) || (v.target != null && v.target < 0) || (v.plan != null && v.plan < 0)) return 'Sumele nu pot fi negative.';
          return null;
        },
      }).then(function (v) {
        if (!v) return;
        if (v.__delete) { if (monthly) askRemoveFromMonth(type, cat, ym, after); else askRemove(type, cat, after); return; }
        var name = v.name.replace(/\s+/g, ' ');
        var s2 = S();
        if (!cat && s2.categories[type].indexOf(name) === -1) s2.categories[type].push(name);
        else if (cat && name !== cat) rename(type, cat, name);
        if (monthly) pinCat(ym, type, name);
        if (Object.prototype.hasOwnProperty.call(v, 'parent')) {
          setParent(type, name, v.parent || null);
        }
        if (mk) {
          var e = s2[mk][name] || (s2[mk][name] = {});
          if (type === 'factura' || type === 'datorie') e.dueDay = v.due || null;
          if (type === 'datorie') e.total = v.total ? r2(v.total) : 0;
          if (type === 'economie') e.target = v.target ? r2(v.target) : 0;
        }
        if (showPlan && v.noPlanCat) {
          // fără plan: ștergem planurile categoriei din toate lunile
          setNoPlanCat(type, name, true);
          Object.keys(s2.plans).forEach(function (k) { setPlanRaw(k, type, name, null); });
          api.commit();
        } else if (showPlan && v.allMonths) {
          setNoPlanCat(type, name, false);
          for (var mm = 0; mm < 12; mm++) setPlanRaw(ymOf(p.y, mm), type, name, v.plan);
          api.commit();
        } else if (showPlan) {
          setNoPlanCat(type, name, false);
          setPlan(ym, type, name, v.plan);
        } else api.commit();
        TK.ui.toast(cat ? '„' + name + '” a fost salvat.' : '„' + name + '” a fost adăugat.');
        if (after) after();
      });
    }

    // Celula cu numele categoriei: un clic deschide editarea.
    function catCell(type, cat, ym, after) {
      var grip = h('span', { class: 'fin-drag', title: 'Trage ca să muți', 'aria-hidden': 'true', dataset: { type: type, cat: cat } });
      grip.addEventListener('pointerdown', function (e) { startDrag(e, grip, type, cat, after); });
      return h('td', { class: 'fin-cat', title: cat },
        h('span', { class: 'fin-cat-in' }, grip,
          h('button', { type: 'button', class: 'fin-cat-btn', 'aria-label': 'Editează ' + cat, onclick: function () { categoryForm(type, cat, ym, after); } }, cat)));
    }

    /* ---- mutare prin tragere: sus / jos în același tabel sau în alt tabel (alt tip) ---- */
    function startDrag(e, grip, type, cat, after) {
      if (e.button != null && e.button !== 0) return;
      e.preventDefault();
      var row = grip.closest('tr');
      var ghost = h('div', { class: 'fin-ghost' }, cat);
      document.body.appendChild(ghost);
      row.classList.add('is-dragging');
      var marked = null, target = null;
      function place(x, y) { ghost.style.left = (x + 12) + 'px'; ghost.style.top = (y - 14) + 'px'; }
      function clearMark() { if (marked) marked.classList.remove('is-drop-before', 'is-drop-after', 'is-drop-end'); marked = null; }
      function find(x, y) {
        var el = document.elementFromPoint(x, y);
        var tr = el && el.closest ? el.closest('tr') : null;
        var tb = el && el.closest ? el.closest('tbody[data-ftype]') : null;
        if (!tb) return null;
        var g = tr && tr.querySelector('.fin-drag');
        if (g) {
          var r = tr.getBoundingClientRect();
          return { type: tb.dataset.ftype, before: g.dataset.cat, after: y > r.top + r.height / 2, el: tr };
        }
        return { type: tb.dataset.ftype, before: null, el: tr || tb };
      }
      function move(ev) {
        // derulare automată lângă marginile ecranului
        if (ev.clientY < 60) window.scrollBy(0, -14);
        else if (ev.clientY > window.innerHeight - 60) window.scrollBy(0, 14);
        place(ev.clientX, ev.clientY);
        clearMark();
        target = find(ev.clientX, ev.clientY);
        if (target && target.el) {
          marked = target.el;
          marked.classList.add(target.before ? (target.after ? 'is-drop-after' : 'is-drop-before') : 'is-drop-end');
        }
      }
      function end(ev) {
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', end);
        document.removeEventListener('pointercancel', end);
        ghost.remove();
        row.classList.remove('is-dragging');
        clearMark();
        if (ev.type === 'pointercancel' || !target) return;
        dropCategory(type, cat, target, after);
      }
      place(e.clientX, e.clientY);
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', end);
      document.addEventListener('pointercancel', end);
    }

    function dropCategory(type, cat, t, after) {
      var s = S();
      var to = t.type;
      if (TYPES.indexOf(to) === -1) return;
      if (to === type) {
        var arr = s.categories[type];
        var from = arr.indexOf(cat);
        if (from === -1 || t.before === cat) return;
        arr.splice(from, 1);
        var at = t.before ? arr.indexOf(t.before) + (t.after ? 1 : 0) : arr.length;
        arr.splice(at, 0, cat);
        api.commit();
        if (after) after();
        return;
      }
      if (s.categories[to].indexOf(cat) !== -1) {
        TK.ui.toast('În ' + PLURAL[to] + ' există deja „' + cat + '”.');
        return;
      }
      var u = usage(type, cat);
      var doMove = function () {
        var s2 = S();
        s2.categories[type] = s2.categories[type].filter(function (c) { return c !== cat; });
        var arr2 = s2.categories[to];
        var at2 = t.before ? arr2.indexOf(t.before) + (t.after ? 1 : 0) : arr2.length;
        arr2.splice(Math.max(0, at2), 0, cat);
        s2.transactions.forEach(function (x) { if (x.type === type && x.category === cat) { x.type = to; delete x.auto; } });
        Object.keys(s2.plans).forEach(function (k) {
          var p = s2.plans[k];
          if (p[type] && Object.prototype.hasOwnProperty.call(p[type], cat)) {
            (p[to] || (p[to] = {}))[cat] = p[type][cat];
            delete p[type][cat];
            if (!Object.keys(p[type]).length) delete p[type];
          }
        });
        var mFrom = extraMap(type), mTo = extraMap(to);
        var old = mFrom ? s2[mFrom][cat] : null;
        if (mFrom) delete s2[mFrom][cat];
        if (mTo && !s2[mTo][cat]) {
          var due = old && old.dueDay ? old.dueDay : null;
          s2[mTo][cat] = to === 'factura' ? { dueDay: due } : to === 'datorie' ? { dueDay: due, total: 0 } : { target: 0 };
        }
        if (isNoPlanCat(type, cat)) { setNoPlanCat(type, cat, false); setNoPlanCat(to, cat, true); }
        setParent(type, cat, null);
        kidsOf(type, cat).forEach(function (k) { setParent(type, k, null); });
        prefsCategoryChanged(type, cat, null);
        api.commit();
        TK.ui.toast('„' + cat + '” a fost mutat în ' + PLURAL[to] + '.');
        if (after) after();
      };
      if (!u.n && !u.months) { doMove(); return; }
      var parts = [];
      if (u.n) parts.push(u.n + (u.n === 1 ? ' tranzacție' : ' tranzacții'));
      if (u.months) parts.push('planurile din ' + u.months + (u.months === 1 ? ' lună' : ' luni'));
      TK.ui.confirm({
        title: 'Muți „' + cat + '” în ' + PLURAL[to] + '?',
        text: 'Categoria trece din ' + PLURAL[type] + ' în ' + PLURAL[to] + ', împreună cu ' + parts.join(' și ') + '. Totalurile lunilor se recalculează.',
        ok: 'Mută în ' + PLURAL[to],
      }).then(function (yes) { if (yes) doMove(); });
    }
    // Comutator „Cu plan” pentru un tabel: fără plan rămâne doar coloana Achitat / Încasat.
    function planToggle(type, after, id) {
      var on = !S().noPlan[type];
      return h('label', { class: 'fin-plan-toggle', for: id, title: 'Afișează sau ascunde coloanele Plan și Progres' },
        h('input', {
          type: 'checkbox', class: 'tk-toggle', id: id, checked: on,
          onchange: function (e) {
            if (e.target.checked) delete S().noPlan[type]; else S().noPlan[type] = true;
            api.commit();
            if (after) after();
          },
        }),
        h('span', null, 'Cu plan'));
    }
    function addCatButton(type, ym, after, id) {
      return h('button', { type: 'button', class: 'tk-btn tk-btn--sm tk-btn--ghost fin-add-cat', id: id, onclick: function () { categoryForm(type, null, ym, after); } }, '+ Adaugă ' + NOUN[type]);
    }

    /* ---- plan editabil în celulă ---- */
    function setPlan(ym, type, cat, v) {
      setPlanRaw(ym, type, cat, v);
      api.commit();
    }
    function setPlanRaw(ym, type, cat, v) {
      var s = S();
      if (v) pinCat(ym, type, cat);
      var p = s.plans[ym] || (s.plans[ym] = {});
      var pt = p[type] || (p[type] = {});
      if (v == null || v === 0) delete pt[cat];
      else pt[cat] = r2(v);
      if (!Object.keys(pt).length) delete p[type];
      if (!Object.keys(p).length) delete s.plans[ym];
    }
    // Totalul realizat fără categoriile fără plan (pentru procentul din rândul Total).
    function factWithPlan(m, type) {
      return TK.sum(S().categories[type], function (c) { return isNoPlanCat(type, c) ? 0 : (m.fact[type][c] || 0); });
    }
    function lockedPlanTd() {
      return h('td', { class: 'num fin-locked', title: 'Fără plan (sumă fixă). Se schimbă din fereastra categoriei.' }, '—');
    }
    function planInput(ym, type, cat, idx, where, rerender) {
      var cur = +(((S().plans[ym] || {})[type] || {})[cat]) || 0;
      var id = 'fin-plan-' + where + '-' + type + '-' + idx;
      var shown = cur ? fmt.num(cur) : '';
      var inp = h('input', {
        class: 'tk-cell-input', id: id, type: 'text', inputmode: 'decimal', autocomplete: 'off',
        value: shown, placeholder: '—', 'aria-label': 'Plan ' + cat + ' (lei)', dataset: { plan: where + '-' + type },
      });
      var done = false;
      function save(focusNext) {
        if (done) return;
        var raw = inp.value.trim();
        var v = fmt.parseNum(raw);
        if (raw !== '' && (v == null || v < 0)) {
          TK.ui.toast('Scrie o sumă validă, de exemplu 1 500,00.');
          inp.value = shown;
          return;
        }
        if ((v || 0) === cur) { inp.value = shown; if (focusNext) moveNext(); return; }
        done = true;
        var nextId = focusNext ? nextPlanId() : null;
        setPlan(ym, type, cat, v);
        setTimeout(function () {
          rerender();
          if (nextId) restoreFocus({ id: nextId, all: true });
        }, 0);
      }
      function nextPlanId() {
        var list = Array.prototype.slice.call(document.querySelectorAll('input[data-plan="' + where + '-' + type + '"]'));
        var i = list.indexOf(inp);
        return list[i + 1] ? list[i + 1].id : null;
      }
      function moveNext() {
        var id2 = nextPlanId();
        if (id2) restoreFocus({ id: id2, all: true }); else inp.blur();
      }
      inp.addEventListener('focus', function () {
        setTimeout(function () { if (document.activeElement === inp) { try { inp.select(); } catch (e) { /* */ } } }, 0);
      });
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); save(true); }
        else if (e.key === 'Escape') { inp.value = shown; inp.blur(); }
      });
      inp.addEventListener('change', function () { save(false); });
      return inp;
    }

    /* ---- „Achitat” editabil în celulă (facturi, datorii) ----
     * Suma scrisă devine totalul plătit în lună pentru categorie: plățile din Tranzacții rămân,
     * iar diferența e o singură plată „auto” (creată, modificată sau ștearsă aici). */
    function setPaid(ym, type, cat, x) {
      var s = S();
      pinCat(ym, type, cat);
      var inMonth = s.transactions.filter(function (t) { return t.type === type && t.category === cat && t.date.slice(0, 7) === ym; });
      var manual = TK.sum(inMonth, function (t) { return t.auto ? 0 : +t.amount || 0; });
      var need = r2((x || 0) - manual);
      if (need < -0.004) {
        TK.ui.toast('Ai deja ' + fmt.lei(manual) + ' în Tranzacții pentru „' + cat + '” în această lună. Micșorează suma acolo.');
        return false;
      }
      s.transactions = s.transactions.filter(function (t) { return !(t.auto && inMonth.indexOf(t) !== -1); });
      if (need > 0.004) {
        s.transactions.push({ id: TK.uid(), date: payDate(type, cat, ym), type: type, category: cat, amount: need, note: PAID_LABEL[type] + ' din tracker', auto: true });
      }
      api.commit();
      return true;
    }
    // Adaugă o sumă peste ce e deja achitat în lună (o tranzacție nouă, vizibilă în Tranzacții).
    function addPayment(ym, type, cat, amount, date, note) {
      pinCat(ym, type, cat);
      S().transactions.push({ id: TK.uid(), date: date || payDate(type, cat, ym), type: type, category: cat, amount: r2(amount), note: note || '' });
      api.commit();
    }
    // Fereastra „Sume”: lista sumelor unei categorii (editare / ștergere) + adăugarea uneia noi.
    // La economii lista cuprinde toate depunerile până la sfârșitul lunii (ca „Acumulat”).
    function amountsDialog(ym, type, cat, rerender) {
      var p = ymParts(ym);
      var monthEnd = D.make(p.y, p.m, D.daysInMonth(p.y, p.m));
      var cumulativeScope = type === 'economie';
      var list = S().transactions.filter(function (t) {
        if (t.type !== type || t.category !== cat) return false;
        return cumulativeScope ? t.date <= monthEnd : t.date.slice(0, 7) === ym;
      }).sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });

                  .then(function (yes) {

        h('div', { class: 'tk-field' }, h('label', { class: 'tk-label', for: 'fin-am-date' }, 'Data'), date),

      form.addEventListener('submit', function (e) {

          ? h('div', { class: 'tk-scroll fin-am-list' }, h('table', { class: 'tk-table tk-table--dense fin-table' },

    function paidInput(ym, type, cat, fact, idx, where, rerender) {
      var id = 'fin-paid-in-' + where + '-' + type + '-' + idx;
      var shown = fact ? fmt.num(fact) : '';
      var inp = h('input', {
        class: 'tk-cell-input', id: id, type: 'text', inputmode: 'decimal', autocomplete: 'off',
        value: shown, placeholder: '—', 'aria-label': PAID_LABEL[type] + ' ' + cat + ' (lei)',
        title: 'Scrie totalul sau +50 ca să adaugi 50 la suma existentă',
      });
      var done = false;
      function save() {
        if (done) return;
        var raw = inp.value.trim();
        // „+50” sau „+ 50” = adaugă peste suma existentă
        var plus = /^\+/.test(raw) ? fmt.parseNum(raw.slice(1)) : null;
        if (/^\+/.test(raw)) {
          if (!(plus > 0)) { TK.ui.toast('După „+” scrie suma de adăugat, de exemplu +50.'); inp.value = shown; return; }
          done = true;
          addPayment(ym, type, cat, plus);
          TK.ui.toast('Am adăugat ' + fmt.lei(plus) + ' la „' + cat + '”.');
          setTimeout(rerender, 0);
          return;
        }
        var v = fmt.parseNum(raw);
        if (raw !== '' && (v == null || v < 0)) {
          TK.ui.toast('Scrie o sumă validă, de exemplu 1 500,00.');
          inp.value = shown;
          return;
        }
        if (r2(v || 0) === r2(fact)) { inp.value = shown; return; }
        done = true;
        if (!setPaid(ym, type, cat, v)) { inp.value = shown; done = false; return; }
        setTimeout(rerender, 0);
      }
      inp.addEventListener('focus', function () {
        setTimeout(function () { if (document.activeElement === inp) { try { inp.select(); } catch (e) { /* */ } } }, 0);
      });
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); inp.blur(); }
        else if (e.key === 'Escape') { inp.value = shown; inp.blur(); }
      });
      inp.addEventListener('change', save);
      var plusBtn = h('button', {
        type: 'button', class: 'tk-icon-btn fin-plus', id: id + '-add', title: 'Sume: adaugă, modifică sau șterge', 'aria-label': 'Sumele pentru ' + cat,
        onclick: function () { amountsDialog(ym, type, cat, rerender); },
      }, '+');
      return h('span', { class: 'fin-paid-wrap' }, inp, plusBtn);
    }

    /* ---- resetarea unei luni: tranzacțiile și planul ei; categoriile, setările și celelalte luni rămân ---- */
    function resetMonth(ym, after) {
      var s = S();
      var p = ymParts(ym);
      var label = fmt.monthYear(p.y, p.m);
      var nTx = s.transactions.filter(function (t) { return t.date.slice(0, 7) === ym; }).length;
      var hasPlan = !!(s.plans[ym] && Object.keys(s.plans[ym]).some(function (t) { return Object.keys(s.plans[ym][t] || {}).length; }));
      if (!nTx && !hasPlan) { TK.ui.toast(label + ' este deja goală.'); return; }
      var parts = [];
      if (nTx) parts.push(nTx + (nTx === 1 ? ' tranzacție (sumă)' : ' tranzacții (sume)'));
      if (hasPlan) parts.push('planul lunii');
      TK.ui.confirm({
        title: 'Resetezi ' + label + '?',
        text: 'Se șterg ' + parts.join(' și ') + '. Categoriile, facturile, datoriile, țintele de economii și celelalte luni rămân neschimbate.',
        ok: 'Resetează luna',
        danger: true,
      }).then(function (yes) {
        if (!yes) return;
        s.transactions = s.transactions.filter(function (t) { return t.date.slice(0, 7) !== ym; });
        delete s.plans[ym];
        delete s.monthCats[ym];
        api.commit();
        after();
        TK.ui.toast(label + ' a fost resetată.');
      });
    }

    /* ---- selector de lună ---- */
    function monthPicker(ym, onChange, idp) {
      var p = ymParts(ym);
      var years = yearsRange();
      if (years.indexOf(p.y) === -1) years.push(p.y);
      var msel = h('select', { class: 'tk-cell-input', id: idp + '-m', 'aria-label': 'Luna' },
        MONTHS.map(function (n, i) { return h('option', { value: String(i), selected: i === p.m }, n); }));
      var ysel = h('select', { class: 'tk-cell-input', id: idp + '-y', 'aria-label': 'Anul' },
        years.map(function (y) { return h('option', { value: String(y), selected: y === p.y }, String(y)); }));
      msel.addEventListener('change', function () { onChange(ymOf(p.y, +msel.value)); });
      ysel.addEventListener('change', function () { onChange(ymOf(+ysel.value, p.m)); });
      return h('div', { class: 'fin-mpick' },
        h('button', { type: 'button', class: 'tk-icon-btn', id: idp + '-prev', 'aria-label': 'Luna anterioară', onclick: function () { onChange(addMonths(ym, -1)); } }, '‹'),
        msel, ysel,
        h('button', { type: 'button', class: 'tk-icon-btn', id: idp + '-next', 'aria-label': 'Luna următoare', onclick: function () { onChange(addMonths(ym, 1)); } }, '›'));
    }

    /* ---- formular tranzacție (adăugare / editare) ---- */
    function kindOptions() {
      var out = [];
      TYPES.forEach(function (t) {
        S().categories[t].forEach(function (c) { var pc = parentOf(t, c); out.push({ value: t + '|' + c, label: LABEL[t] + ' · ' + (pc ? pc + ' › ' : '') + c }); });
      });
      return out;
    }
    function defaultDateFor(ym) {
      var t = D.today();
      if (D.ym(t) === ym) return t;
      var p = ymParts(ym);
      return D.make(p.y, p.m, ym < D.ym(t) ? D.daysInMonth(p.y, p.m) : 1);
    }
    function txForm(tx, defaults) {
      var isNew = !tx;
      var cur = tx || defaults || {};
      return TK.ui.form({
        title: isNew ? 'Tranzacție nouă' : 'Editează tranzacția',
        fields: [
          { name: 'date', label: 'Data', type: 'date', value: cur.date, required: true },
          { name: 'kind', label: 'Tip și categorie', type: 'select', options: kindOptions(), value: (cur.type || 'cheltuiala') + '|' + (cur.category || ''), required: true },
          { name: 'amount', label: 'Sumă (lei)', type: 'money', value: cur.amount, required: true, placeholder: '0,00' },
          { name: 'note', label: 'Notă', type: 'text', value: cur.note || '', placeholder: 'opțional' },
        ],
        submit: isNew ? 'Adaugă tranzacția' : 'Salvează',
        onDelete: !isNew,
        deleteLabel: 'Șterge tranzacția',
        validate: function (v) {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(v.date || '')) return 'Alege o dată validă.';
          if (!(v.amount > 0)) return 'Suma trebuie să fie mai mare decât zero.';
          if (!v.kind) return 'Alege tipul și categoria.';
          return null;
        },
      }).then(function (v) {
        if (!v) return false;
        var s = S();
        if (v.__delete) {
          s.transactions = s.transactions.filter(function (t) { return t !== tx; });
          api.commit();
          TK.ui.toast('Tranzacția a fost ștearsă.');
          return true;
        }
        var cut = v.kind.indexOf('|');
        var rec = tx || { id: TK.uid() };
        rec.date = v.date;
        rec.type = v.kind.slice(0, cut);
        rec.category = v.kind.slice(cut + 1);
        rec.amount = r2(v.amount);
        rec.note = v.note || '';
        if (isNew) s.transactions.push(rec);
        api.commit();
        TK.ui.toast(isNew ? 'Tranzacția a fost adăugată.' : 'Tranzacția a fost salvată.');
        return true;
      });
    }

    /* ---- bifă facturi / datorii ---- */
    function payDate(type, cat, ym) {
      if (D.ym(D.today()) === ym) return D.today();
      var p = ymParts(ym);
      var map = type === 'factura' ? S().bills : type === 'datorie' ? S().debts : {};
      var dd = +((map[cat] || {}).dueDay) || 1;
      return D.make(p.y, p.m, Math.max(1, Math.min(dd, D.daysInMonth(p.y, p.m))));
    }
    function onTick(cb, type, cat, m, rerender) {
      var plan = +m.plan[type][cat] || 0, fact = m.fact[type][cat] || 0;
      if (!cb.checked) {
        cb.checked = true;
        TK.ui.toast('„' + cat + '” e plătită integral. Ca s-o debifezi, micșorează sau șterge plata din Tranzacții.');
        return;
      }
      if (!(plan > 0)) {
        cb.checked = false;
        TK.ui.toast('Setează mai întâi suma planificată pentru „' + cat + '”.');
        return;
      }
      var missing = r2(plan - fact);
      var date = payDate(type, cat, m.ym);
      TK.ui.confirm({
        title: 'Marchezi „' + cat + '” ca plătită?',
        text: 'Se adaugă o plată de ' + fmt.lei(missing) + ' (cât lipsește până la plan), cu data ' + fmt.date(date) + '.',
        ok: 'Adaugă plata',
      }).then(function (yes) {
        if (!yes) { cb.checked = false; return; }
        S().transactions.push({ id: TK.uid(), date: date, type: type, category: cat, amount: missing, note: 'Achitat din tracker', auto: true });
        api.commit();
        TK.ui.toast('Plata pentru „' + cat + '” a fost adăugată.');
        rerender();
      });
    }

    function billTable(m, type, where, rerender, opts) {
      opts = opts || {};
      var s = S();
      var cats = s.categories[type];
      var map = type === 'factura' ? s.bills : s.debts;
      var monthEnd = (function () { var p = ymParts(m.ym); return D.make(p.y, p.m, D.daysInMonth(p.y, p.m)); })();
      var showLeft = type === 'datorie' && cats.some(function (c) { return (map[c] || {}).total > 0; });
      var usePlan = !s.noPlan[type];
      var head = usePlan
        ? [th(h('span', { class: 'tk-sr' }, 'Plătit'), 'chk'), th('Categorie'), th('Termen', 'fin-due'), th('Plan', 'num', { colspan: 2 }), th('Achitat', 'num', { colspan: 2 }), th('Progres', 'num')]
        : [th('Categorie'), th('Termen', 'fin-due'), th('Achitat', 'num', { colspan: 2 })];
      if (showLeft) head.push(th('Rămas de plătit', 'num', { colspan: 2 }));
      var rows = grouped(type, cats).map(function (g, i) {
        var c = g.c;
        var plan = +m.plan[type][c] || 0, fact = m.fact[type][c] || 0;
        if (g.kids.length) {
          var gp = withKids(g, m.plan[type]), gf = withKids(g, m.fact[type]);
          var gcells = usePlan ? [
            h('td', { class: 'chk' }),
            markRow(catCell(type, c, m.ym, rerender), g),
            h('td', { class: 'tk-center fin-due' }, '—'),
            curTd(), h('td', { class: 'num fin-group-v' }, money(gp)),
            curTd(), h('td', { class: 'num fin-group-v', title: groupTitle(g) }, money(gf)),
            pctTd(gf, gp, 'out'),
          ] : [
            markRow(catCell(type, c, m.ym, rerender), g),
            h('td', { class: 'tk-center fin-due' }, '—'),
            curTd(), h('td', { class: 'num fin-group-v', title: groupTitle(g) }, money(gf)),
          ];
          if (showLeft) {
            var gl = TK.sum([c].concat(g.kids), function (k) { var tt = +(map[k] || {}).total || 0; return tt ? Math.max(0, tt - cumulative(s, type, k, monthEnd)) : 0; });
            gcells.push(curTd(), h('td', { class: 'num fin-group-v' }, gl ? fmt.num(gl) : '—'));
          }
          return h('tr', { class: 'fin-group-row' }, gcells);
        }
        var paid = plan > 0 && fact >= plan - 0.004;
        var cb = h('input', { type: 'checkbox', class: 'tk-check', id: 'fin-paid-' + where + '-' + type + '-' + i, checked: paid, 'aria-label': c + ' plătită' });
        cb.addEventListener('change', function () { onTick(cb, type, c, m, rerender); });
        var due = (map[c] || {}).dueDay;
        var locked = isNoPlanCat(type, c);
        var cells = usePlan ? [
          h('td', { class: 'chk' }, locked ? null : cb),
          markRow(catCell(type, c, m.ym, rerender), g),
          h('td', { class: 'tk-center fin-due' }, due ? String(due) : '—'),
          curTd(), locked ? lockedPlanTd() : h('td', { class: 'num' }, planInput(m.ym, type, c, i, where, rerender)),
          curTd(), h('td', { class: 'num' }, paidInput(m.ym, type, c, fact, i, where, rerender)),
          pctTd(fact, plan, 'out'),
        ] : [
          markRow(catCell(type, c, m.ym, rerender), g),
          h('td', { class: 'tk-center fin-due' }, due ? String(due) : '—'),
          curTd(), h('td', { class: 'num' }, paidInput(m.ym, type, c, fact, i, where, rerender)),
        ];
        if (showLeft) {
          var tot = +(map[c] || {}).total || 0;
          var left = tot ? Math.max(0, tot - cumulative(s, type, c, monthEnd)) : null;
          cells.push(curTd(), h('td', { class: 'num' }, tot ? fmt.num(left) : '—'));
        }
        return h('tr', { class: [paid && usePlan ? 'fin-paid' : '', g.depth ? 'fin-sub-row' : ''].join(' ').trim() || null }, cells);
      });
      var cols = usePlan ? ['', '', '', 'cur', 'num', 'cur', 'num', 'num'] : ['', '', 'cur', 'num'];
      if (showLeft) cols.push('cur', 'num');
      var pad = Math.max(0, (opts.minRows || 0) - rows.length);
      var foot = usePlan
        ? [h('th', { colspan: 3, scope: 'row' }, 'Total'), curTd(), numTd(m.planTot[type]), curTd(), numTd(m.factTot[type]), pctTd(factWithPlan(m, type), m.planTot[type], 'out')]
        : [h('th', { colspan: 2, scope: 'row' }, 'Total'), curTd(), numTd(m.factTot[type])];
      if (showLeft) {
        var leftTot = TK.sum(cats, function (c) { var tot = +(map[c] || {}).total || 0; return tot ? Math.max(0, tot - cumulative(s, type, c, monthEnd)) : 0; });
        foot.push(curTd(), numTd(leftTot));
      }
      return [h('div', { class: 'tk-card__body tk-card__body--flush tk-scroll' },
        h('table', { class: 'tk-table tk-table--dense fin-table' },
          h('thead', null, h('tr', null, head)),
          h('tbody', { dataset: { ftype: type } }, rows, emptyRows(pad, cols)),
          h('tfoot', null, h('tr', null, foot)))),
        h('div', { class: 'fin-cat-tools' }, addCatButton(type, m.ym, rerender, 'fin-addcat-' + where + '-' + type), planToggle(type, rerender, 'fin-useplan-' + where + '-' + type))];
    }

            if (!v) { TK.ui.toast('Numele nu poate fi gol.'); name.value = c; return; }
            if (v === c) { name.value = c; return; }
            if (S().categories[type].indexOf(v) !== -1) { TK.ui.toast('Există deja categoria „' + v + '”.'); name.value = c; return; }
            rename(type, c, v);
            TK.ui.toast('Categoria a fost redenumită în „' + v + '”. Tranzacțiile și planurile au fost actualizate.');
            setTimeout(render, 0);
          });
          var ci = cats.indexOf(c);
          var cells = [h('td', { class: 'idx' }, h('span', { class: 'tk-swatch', style: { '--c': PALETTE[ci % PALETTE.length] }, 'aria-hidden': 'true' })), markRow(h('td', { title: g.depth ? 'Subcategorie a grupei „' + parentOf(type, c) + '”' : groupTitle(g) }, name), g)];
          var ex = mk ? (s[mk][c] || (s[mk][c] = type === 'factura' ? { dueDay: 1 } : type === 'datorie' ? { dueDay: 1, total: 0 } : { target: 0 })) : null;
          if (type === 'factura' || type === 'datorie') {
            cells.push(h('td', { class: 'num' }, numInput(base + '-due', 'Termen ' + c + ' (ziua din lună)', ex.dueDay, function (v) { ex.dueDay = v || null; }, true)));
          }
          if (type === 'datorie') cells.push(h('td', { class: 'num' }, numInput(base + '-total', 'Total credit ' + c, ex.total, function (v) { ex.total = v; })));
          if (type === 'economie') cells.push(h('td', { class: 'num' }, numInput(base + '-target', 'Țintă ' + c, ex.target, function (v) { ex.target = v; })));
          cells.push(h('td', { class: 'fin-actions' },
            h('button', { type: 'button', class: 'tk-icon-btn', id: base + '-up', 'aria-label': 'Mută „' + c + '” mai sus', disabled: i === 0, onclick: function () { move(type, i, -1); } }, '↑'),
            h('button', { type: 'button', class: 'tk-icon-btn', id: base + '-down', 'aria-label': 'Mută „' + c + '” mai jos', disabled: i === cats.length - 1, onclick: function () { move(type, i, 1); } }, '↓'),
            h('button', { type: 'button', class: 'tk-icon-btn fin-del', id: base + '-del', 'aria-label': 'Șterge categoria „' + c + '”', onclick: function () { askRemove(type, c, render); } }, '✕')));
          return h('tr', null, cells);
        });

        var addId = 'fin-set-' + type + '-new';
        var addInp = h('input', { class: 'tk-input', id: addId, type: 'text', placeholder: 'Categorie nouă', autocomplete: 'off' });
        var addForm = h('form', { class: 'fin-set-add', novalidate: true },
          h('label', { class: 'tk-sr', for: addId }, 'Categorie nouă pentru ' + PLURAL[type].toLowerCase()),
          addInp,
          h('button', { type: 'submit', class: 'tk-btn tk-btn--sm', id: addId + '-btn' }, 'Adaugă'));
        addForm.addEventListener('submit', function (e) {
          e.preventDefault();
          var v = addInp.value.trim().replace(/\s+/g, ' ');
          if (!v) { addInp.focus(); return; }
          if (S().categories[type].indexOf(v) !== -1) { TK.ui.toast('Există deja categoria „' + v + '”.'); return; }
          S().categories[type].push(v);
          var mk2 = extraMap(type);
          if (mk2) S()[mk2][v] = type === 'factura' ? { dueDay: 1 } : type === 'datorie' ? { dueDay: 1, total: 0 } : { target: 0 };
          api.commit();
          TK.ui.toast('Categoria „' + v + '” a fost adăugată.');
          render();
          restoreFocus({ id: addId });
        });

        return h('article', { class: 'tk-card' + (type === 'venit' || type === 'economie' ? ' tk-card--sage' : ''), id: 'fin-set-card-' + type },
          cardHead([PLURAL[type] + ' ', h('b', null, '· categorii')], type === 'venit' || type === 'economie' ? 'sage' : null),
          h('div', { class: 'tk-card__body tk-card__body--flush tk-scroll' },
            h('table', { class: 'tk-table tk-table--dense fin-table fin-set-table' },
              h('thead', null, h('tr', null, head)),
              h('tbody', null, rows.length ? rows : h('tr', null, h('td', { colspan: head.length, class: 'tk-muted tk-center' }, 'Nicio categorie.'))))),
          h('div', { class: 'tk-card__body fin-set-foot' }, addForm));
      }

      function move(type, i, d) {
        var cats = S().categories[type];
        var j = i + d;
        if (j < 0 || j >= cats.length) return;
        var tmp = cats[i]; cats[i] = cats[j]; cats[j] = tmp;
        api.commit();
        render();
        restoreFocus({ id: 'fin-set-' + type + '-' + j + (d < 0 ? '-up' : '-down') });
      }


      render();
    }

    /* ---- pornire ---- */
    if (route === 'tranzactii') viewTransactions();
    else if (route === 'trackere') viewTrackers();
    else if (route === 'anual') viewYear();
    else if (route === 'setari') viewSettings();
    else viewMonth();

    return {
      unmount: function () { cleanups.forEach(function (fn) { try { fn(); } catch (e) { /* */ } }); },
    };
  }

  // expus pentru teste
  TK.financeModel = { buildIndex: buildIndex, monthModel: monthModel, yearModel: yearModel, cumulative: cumulative };

  var DEF = {
    id: 'finance',
    slug: 'finante',
    name: 'Tracker financiar',
    short: 'Finanțe',
    tone: 'rose',
    tagline: 'Venituri, cheltuieli, facturi, datorii și economii — plan și realizat, pe lună și pe an.',
    version: 1,
    createDemo: createDemo,
    createEmpty: createEmpty,
    migrate: migrate,
    summary: summary,
    mount: mount,
  };

  TK.register(DEF);
})();

</script>
<script>
/*
 * Tracker de obiceiuri — analiza lunară a obiceiurilor zilnice, liste săptămânale și lunare.
 *
 * Forma stării (JSON, compactă):
 * {
 *   habits:  [{ id: 'h1', name: 'Antrenament', goal: 26 | null,   // zile-țintă pe lună (opțional)
 *               createdAt: '2026-01-01',                          // prima zi în care obiceiul contează
 *               createdYm: '2026-01',                             // = luna lui createdAt (vizibilitate pe luni)
 *               sched?: { days: [0, 2, 4] } | { perWeek: 3 },   // program: doar în anumite zile (0 = luni) sau de N ori pe săptămână; lipsă = zilnic
 *               archivedYm?: '2026-10' }],   // oprit din prima zi a acestei luni; vizibil în lunile createdYm ≤ ym < archivedYm
 *   checks:  { '2026-09': { h1: '0110…' } },   // câte un caracter pe zi a lunii ('1' = bifat), lungime = zilele lunii
 *   weekly:  { '2026-09': [ [ {id, text, done} ], … ] },  // o listă pe fiecare săptămână (TK.date.chunkWeeks: 1–7, 8–14, …)
 *   monthly: { '2026-09': [ {id, text, done} ] },          // maximum 28 de acțiuni pe lună
 *   meta: {…}  // gestionat de cadru
 * }
 * Luna afișată și săptămâna aleasă stau în api.prefs ('ym', 'week'), nu în date.
 *
 * Calcule — o zi „eligibilă” pentru un obicei: ziua ≥ createdAt și ziua ≤ azi (zilele viitoare nu se pot bifa
 * și nu intră la numitor; lunile trecute se socotesc întregi):
 *   % pe zi       = obiceiuri bifate în zi / obiceiuri eligibile în acea zi
 *   % lunar       = total bifate / Σ zile eligibile ale tuturor obiceiurilor   („304 / 372”)
 *   % pe obicei   = zile bifate / zilele lui eligibile din lună
 * Programul unui obicei:
 *   - „doar în anumite zile”: celelalte zile sunt libere (nu intră nici la numitor, nici la numărător);
 *   - „de N ori pe săptămână” (săptămânile grilei: 1–7, 8–14, …): pe săptămână contează cel mult N bifări, iar ținta
 *     intră la numitor doar când nu mai poate fi atinsă; în graficul pe zile obiceiul apare doar în zilele bifate.
 */
(function () {
  'use strict';

  var TK = window.TK, h = TK.h, D = TK.date, F = TK.fmt;

  var MAX_HABITS = 30, MAX_MONTHLY = 28, MAX_WEEKLY = 15;
  var MONTHS_LOWER = D.MONTHS.map(function (s) { return s.toLowerCase(); });
  var VIEWS = [
    { sub: '', label: 'Zilnic' },
    { sub: 'saptamanal', label: 'Săptămânal' },
    { sub: 'lunar', label: 'Lunar' },
  ];

  /* ------------------------------------------------------------ utilitare */

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymOf(y, m) { return y + '-' + pad(m + 1); }
  function ymY(ym) { return +ym.slice(0, 4); }
  function ymM(ym) { return +ym.slice(5, 7) - 1; }
  function shiftYm(ym, k) {
    var y = ymY(ym), m = ymM(ym) + k;
    y += Math.floor(m / 12);
    m = ((m % 12) + 12) % 12;
    return ymOf(y, m);
  }
  function validYm(v) { return typeof v === 'string' && /^\d{4}-(0[1-9]|1[0-2])$/.test(v); }
  function pct0(r) { return Math.round(r * 100) + '%'; }
  function zeros(n) { var a = []; for (var i = 0; i < n; i++) a.push(0); return a; }
  function uid(p) { return (p || 'x') + TK.uid(); }

  function normalize(st) {
    if (!Array.isArray(st.habits)) st.habits = [];
    st.habits.forEach(function (hb) {
      // migrare: obiceiurile vechi aveau doar luna creării
      if (!hb.createdAt || !/^\d{4}-\d{2}-\d{2}$/.test(hb.createdAt)) hb.createdAt = (validYm(hb.createdYm) ? hb.createdYm : '2000-01') + '-01';
      hb.createdYm = hb.createdAt.slice(0, 7);
      hb.sched = cleanSched(hb.sched);
      if (!hb.sched) delete hb.sched;
    });
    if (!st.checks || typeof st.checks !== 'object') st.checks = {};
    if (!st.weekly || typeof st.weekly !== 'object') st.weekly = {};
    if (!st.monthly || typeof st.monthly !== 'object') st.monthly = {};
    return st;
  }

  // Program valid sau null (= în fiecare zi).
  function cleanSched(v) {
    if (!v || typeof v !== 'object') return null;
    if (Array.isArray(v.days)) {
      var days = v.days.filter(function (d, i, a) { return d === (d | 0) && d >= 0 && d <= 6 && a.indexOf(d) === i; }).sort();
      return days.length && days.length < 7 ? { days: days } : null;
    }
    var n = +v.perWeek;
    return n >= 1 && n <= 6 ? { perWeek: Math.round(n) } : null;
  }
  function schedLabel(sc, long) {
    if (!sc) return long ? 'În fiecare zi' : '7/7';
    if (sc.perWeek) return long ? sc.perWeek + (sc.perWeek === 1 ? ' dată' : ' ori') + ' pe săptămână' : sc.perWeek + '×/săpt.';
    if (long) return 'Doar ' + sc.days.map(function (d) { return D.WEEKDAYS[d].toLowerCase(); }).join(', ');
    return sc.days.length <= 3 ? sc.days.map(function (d) { return D.WEEKDAYS_SHORT[d]; }).join(' ') : sc.days.length + ' zile';
  }

  function isVisible(hb, ym) {
    return (!hb.createdYm || hb.createdYm <= ym) && (!hb.archivedYm || ym < hb.archivedYm);
  }
  function visibleHabits(st, ym) {
    return st.habits.filter(function (hb) { return isVisible(hb, ym); });
  }
  function activeCount(st) {
    return st.habits.filter(function (hb) { return !hb.archivedYm; }).length;
  }

  function getBits(st, ym, hid) {
    var mc = st.checks[ym];
    return (mc && mc[hid]) || '';
  }
  function setBit(st, ym, hid, d, on, n) {
    var mc = st.checks[ym] || (st.checks[ym] = {});
    var s = mc[hid] || '';
    while (s.length < n) s += '0';
    s = s.slice(0, d - 1) + (on ? '1' : '0') + s.slice(d);
    if (s.indexOf('1') === -1) delete mc[hid];
    else mc[hid] = s;
    if (!Object.keys(mc).length) delete st.checks[ym];
  }

  // Prima zi a lunii (1-based) în care obiceiul contează: n + 1 dacă nu contează deloc.
  function firstDay(hb, ym, n) {
    var ca = hb.createdAt || '';
    if (ca.slice(0, 7) < ym) return 1;
    if (ca.slice(0, 7) > ym) return n + 1;
    return D.day(ca);
  }

  // Toate cifrele unei luni. Se numără doar zilele eligibile (≥ createdAt și ≤ azi) și, după program, doar zilele care contează.
  function monthStats(st, ym, today) {
    var y = ymY(ym), m = ymM(ym), n = D.daysInMonth(y, m);
    var hs = visibleHabits(st, ym);
    var tYm = D.ym(today);
    var lastDay = ym < tYm ? n : ym === tYm ? D.day(today) : 0; // ultima zi care se poate bifa
    var wd1 = D.weekday(D.make(y, m, 1));
    var weeks = D.chunkWeeks(y, m);
    var perDay = zeros(n), eligible = zeros(n), perHabit = [], denHabit = [], fullHabit = [], starts = [];
    var total = 0, max = 0, goalsMet = 0, goalsSet = 0;
    hs.forEach(function (hb) {
      var s = getBits(st, ym, hb.id), c = 0, den = 0, full = 0, from = firstDay(hb, ym, n);
      var sc = cleanSched(hb.sched);
      function on(d) { return s.charCodeAt(d - 1) === 49; }
      if (sc && sc.perWeek) {
        weeks.forEach(function (w) {
          var len = 0, done = 0, free = 0;
          w.forEach(function (d) {
            if (d < from) return;
            len++;
            if (d > lastDay) { free++; return; }
            if (on(d)) { done++; perDay[d - 1]++; eligible[d - 1]++; }
            else if (d === lastDay && ym === tYm) free++; // azi se mai poate bifa
          });
          if (!len) return;
          var target = len === 7 ? sc.perWeek : Math.min(len, Math.round(sc.perWeek * len / 7));
          full += target;
          if (w[0] > lastDay) return; // săptămână viitoare
          var got = Math.min(done, target);
          c += got;
          den += got + Math.max(0, target - got - free); // lipsa intră doar când nu mai poate fi recuperată
        });
      } else {
        for (var d = from; d <= n; d++) {
          if (sc && sc.days.indexOf((wd1 + d - 1) % 7) === -1) continue; // zi liberă
          full++;
          if (d > lastDay) continue;
          den++;
          eligible[d - 1]++;
          if (on(d)) { c++; perDay[d - 1]++; }
        }
      }
      starts.push(from);
      perHabit.push(c);
      denHabit.push(den);
      fullHabit.push(full);
      total += c;
      max += den;
      if (hb.goal) { goalsSet++; if (c >= hb.goal) goalsMet++; }
    });
    var rate = perHabit.map(function (c, i) { return TK.ratio(c, denHabit[i]); });
    var order = hs.map(function (_, i) { return i; }).sort(function (a, b) {
      return rate[b] - rate[a] || perHabit[b] - perHabit[a] || a - b;
    });
    return {
      ym: ym, y: y, m: m, n: n, hs: hs, perDay: perDay, eligible: eligible, perHabit: perHabit, denHabit: denHabit,
      fullHabit: fullHabit, starts: starts, rate: rate, total: total, max: max,
      goalsMet: goalsMet, goalsSet: goalsSet, lastDay: lastDay, order: order,
      // null = zi fără obiceiuri eligibile (viitoare sau înainte de primul obicei)
      dayRatio: perDay.map(function (c, i) { return eligible[i] ? c / eligible[i] : null; }),
    };
  }

  // Data de la care contează un obicei adăugat în timp ce privești luna `ym`:
  //  - o lună trecută → prima zi a acelei luni (completezi istoricul);
  //  - luna curentă sau una viitoare → azi (nu scade procentul zilelor deja trecute;
  //    dacă bifezi totuși o zi anterioară din luna curentă, data de start se mută pe acea zi).
  function createdAtFor(ym, today) {
    return ym < D.ym(today) ? ym + '-01' : today;
  }

  function listStats(items) {
    var done = items.filter(function (it) { return it.done; }).length;
    return { done: done, total: items.length, ratio: TK.ratio(done, items.length) };
  }

  function weekRange(w, m) {
    return pad(w[0]) + '–' + pad(w[w.length - 1]) + ' ' + D.MONTHS_SHORT[m];
  }

  /* ------------------------------------------------------------ date demo */

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // [nume, consecvență, tipar] — tipar: 'wd' mai bine în zilele lucrătoare, 'we' mai bine în weekend, 'sun' pauză duminica
  var DEMO_HABITS = [
    ['Antrenament', 0.9, 'sun'],
    ['Citit 30 de minute', 0.6, 'we'],
    ['Studiu engleză', 0.85, 'wd'],
    ['Meditație', 0.8, null],
    ['Fără rețele sociale până la prânz', 0.84, null],
    ['Planificarea zilei', 0.88, 'wd'],
    ['Evidența finanțelor', 0.8, null],
    ['10 000 de pași', 0.78, 'we'],
    ['Lucru la proiect', 0.66, 'wd'],
    ['Somn 8 ore', 0.74, 'we'],
    ['Jurnal / reflecție', 0.93, null],
    ['Fără dulciuri', 0.96, null],
  ];
  var DEMO_WEEKLY = ['Planificarea săptămânii', 'Planificarea meniului', 'Lecție curs online', 'Revizuirea finanțelor', 'Cumpărături mari', 'Plimbare lungă'];
  var DEMO_MONTHLY = ['Curățenie generală', 'Planificarea lunii', 'Curățarea emailului', 'Detox digital', 'Vizită la părinți'];

  function createDemo() {
    var today = D.today();
    var Y = D.year(today), M = D.month(today);
    var rnd = mulberry32(20260917);
    var seq = 0;
    function iid() { seq++; return 'd' + seq.toString(36); }
    var st = createEmpty();
    var start = ymOf(Y, 0);
    st.habits = DEMO_HABITS.map(function (d, i) {
      return { id: 'h' + (i + 1), name: d[0], goal: Math.max(18, Math.min(28, Math.round(d[1] * 30) - 1)), createdAt: start + '-01', createdYm: start };
    });
    for (var m = 0; m <= M; m++) {
      var ym = ymOf(Y, m), n = D.daysInMonth(Y, m);
      var bits = st.habits.map(function () { return ''; });
      for (var d = 1; d <= n; d++) {
        var iso = D.make(Y, m, d);
        var future = iso > today;
        var wd = D.weekday(iso), weekend = wd >= 5;
        var dayF = (rnd() - 0.62) * 0.3; // zile bune și zile mai slabe
        DEMO_HABITS.forEach(function (hd, i) {
          var p = hd[1] + dayF * (1 - hd[1] + 0.25);
          if (hd[2] === 'wd') p += weekend ? -0.18 : 0.05;
          else if (hd[2] === 'we') p += weekend ? 0.12 : -0.04;
          else if (hd[2] === 'sun' && wd === 6) p -= 0.45;
          var r = rnd();
          bits[i] += !future && r < p ? '1' : '0';
        });
      }
      var mc = {};
      st.habits.forEach(function (hb, i) { if (bits[i].indexOf('1') !== -1) mc[hb.id] = bits[i]; });
      if (Object.keys(mc).length) st.checks[ym] = mc;
    }
    // liste săptămânale și lunare pentru ultimele 4 luni
    for (m = Math.max(0, M - 3); m <= M; m++) {
      ym = ymOf(Y, m);
      st.weekly[ym] = D.chunkWeeks(Y, m).map(function (w) {
        var first = D.make(Y, m, w[0]), last = D.make(Y, m, w[w.length - 1]);
        var state = last < today ? 'past' : first <= today ? 'now' : 'future';
        var list = [];
        DEMO_WEEKLY.forEach(function (t, i) {
          if (i >= 3 && rnd() < 0.55) return;
          var done = state === 'past' ? rnd() < 0.85 : state === 'now' ? (i < 2 || rnd() < 0.3) : false;
          list.push({ id: iid(), text: t, done: done });
        });
        return list;
      });
      var cur = m === M;
      st.monthly[ym] = DEMO_MONTHLY.filter(function (t, i) { return i < 3 || rnd() < 0.7; }).map(function (t, i) {
        return { id: iid(), text: t, done: cur ? i < 2 || (i === 2 && D.day(today) > 20) : rnd() < 0.85 };
      });
    }
    return st;
  }

  function createEmpty() {
    return { habits: [], checks: {}, weekly: {}, monthly: {} };
  }

  /* ------------------------------------------------------------ sumar */

  function summary(st) {
    normalize(st);
    var today = D.today();
    var s = monthStats(st, D.ym(today), today);
    var best = s.order.length && s.denHabit[s.order[0]] ? s.hs[s.order[0]].name + ' · ' + pct0(s.rate[s.order[0]]) : '—';
    var ti = D.day(today) - 1;
    return [
      { label: 'Progres lunar', value: F.pct(TK.ratio(s.total, s.max), 1) },
      { label: 'Bifate azi', value: s.perDay[ti] + ' / ' + s.eligible[ti] },
      { label: 'Cel mai constant obicei', value: best },
    ];
  }

  /* ------------------------------------------------------------ montare */

  function mount(el, api) {
    var st = normalize(api.state);
    var today = D.today();
    var view = VIEWS.some(function (v) { return v.sub === api.route; }) ? api.route : '';
    var ym = api.prefs.get('ym', D.ym(today));
    if (!validYm(ym)) ym = D.ym(today);

    var tabs = h('div', { class: 'tk-tabs hb-tabs', role: 'tablist', 'aria-label': 'Secțiuni tracker obiceiuri' },
      VIEWS.map(function (v) {
        var on = v.sub === view;
        return h('button', {
          type: 'button', class: 'tk-tab' + (on ? ' is-active' : ''), role: 'tab',
          id: 'hb-tab-' + (v.sub || 'zilnic'), 'aria-selected': on ? 'true' : 'false',
          'aria-controls': 'hb-panel',
          onclick: function () { if (!on) api.go(v.sub); },
        }, v.label);
      }));
    var panel = h('div', { class: 'hb-panel', id: 'hb-panel', role: 'tabpanel', 'aria-labelledby': 'hb-tab-' + (view || 'zilnic') });
    el.appendChild(h('div', { class: 'hb-topline' }, tabs));
    el.appendChild(panel);

    function setYm(next) {
      if (!validYm(next)) return;
      ym = next;
      api.prefs.set('ym', ym);
      render();
    }

    function ctx() {
      var y = ymY(ym), m = ymM(ym);
      return { api: api, st: st, ym: ym, y: y, m: m, n: D.daysInMonth(y, m), today: today, setYm: setYm, rerender: render };
    }

    function render() {
      var sc = panel.querySelector('.hb-grid-scroll');
      var keep = sc ? sc.scrollLeft : 0;
      TK.clear(panel);
      var c = ctx();
      if (view === 'saptamanal') renderWeekly(panel, c);
      else if (view === 'lunar') renderMonthly(panel, c);
      else renderDaily(panel, c);
      var sc2 = panel.querySelector('.hb-grid-scroll');
      if (sc2 && keep) sc2.scrollLeft = keep;
      else if (!keep) scrollToToday(panel);
    }
    render();
    return { unmount: function () { TK.clear(el); } };
  }

  // Pe ecrane înguste, grilele derulează orizontal: aducem ziua de azi în vizor.
  function scrollToToday(panel) {
    var list = panel.querySelectorAll('.hb-grid-scroll, .hb-dyn-scroll');
    Array.prototype.forEach.call(list, function (sc) {
      if (sc.scrollWidth <= sc.clientWidth + 1) return;
      var th = sc.querySelector('thead .hb-r3 th.is-today');
      var name = sc.querySelector('thead .hb-r3 .tk-habit-grid__name');
      if (!th) return;
      var nameW = name ? name.offsetWidth : 0;
      var target = th.offsetLeft - nameW - (sc.clientWidth - nameW) / 2 + th.offsetWidth / 2;
      sc.scrollLeft = Math.max(0, target);
    });
  }

  /* ------------------------------------------------------------ antet (lună / an) */

  function buildHeader(c, sub) {
    var st = c.st;

  // Golește luna văzută: bifele din grilă, listele săptămânale și lista lunară. Obiceiurile rămân.
  function resetMonth(c) {
    var st = c.st, ym = c.ym;
    var monthName = D.MONTHS[c.m].toLowerCase() + ' ' + c.y;
    var checks = st.checks[ym] || {};
    var nChecks = Object.keys(checks).reduce(function (a, k) { return a + (checks[k].match(/1/g) || []).length; }, 0);
    var nWeekly = (st.weekly[ym] || []).reduce(function (a, w) { return a + (w ? w.length : 0); }, 0);
    var nMonthly = (st.monthly[ym] || []).length;
    if (!nChecks && !nWeekly && !nMonthly) { TK.ui.toast('Luna ' + monthName + ' este deja goală.'); return; }
    var parts = [];
    if (nChecks) parts.push(nChecks + (nChecks === 1 ? ' bifă' : ' bife') + ' din grilă');
    if (nWeekly) parts.push(nWeekly + (nWeekly === 1 ? ' sarcină săptămânală' : ' sarcini săptămânale'));
    if (nMonthly) parts.push(nMonthly + (nMonthly === 1 ? ' acțiune lunară' : ' acțiuni lunare'));
    TK.ui.confirm({
      title: 'Resetezi ' + monthName + '?',
      text: 'Se șterg ' + parts.join(', ') + '. Obiceiurile, programul lor și celelalte luni rămân neschimbate.',
      ok: 'Resetează luna',
      danger: true,
    }).then(function (yes) {
      if (!yes) return;
      delete st.checks[ym];
      delete st.weekly[ym];
      delete st.monthly[ym];
      c.api.commit();
      c.rerender();
      TK.ui.toast('Luna ' + monthName + ' a fost resetată.');
    });
  }

  /* ------------------------------------------------------------ vederea Zilnic */

  function dayMeta(c) {
    var out = [];
    var tIso = c.today;
    for (var d = 1; d <= c.n; d++) {
      var iso = D.make(c.y, c.m, d);
      out.push({ d: d, iso: iso, wd: D.weekday(iso), today: iso === tIso, future: iso > tIso });
    }
    return out;
  }

  // Cele trei rânduri de antet comune grilei și dinamicii: săptămâni, zile ale săptămânii, numere.
  function gridHead(c, days, labels) {
    var weeks = D.chunkWeeks(c.y, c.m);
    var r1 = h('tr', { class: 'hb-r1' }, h('th', { class: 'tk-habit-grid__week tk-habit-grid__name', scope: 'col' }, labels[0]));
    weeks.forEach(function (w, i) {

  }

      });

      refs.rows.forEach(function (r, i) {
        var cnt = s.perHabit[i], den = s.denHabit[i], full = s.fullHabit[i];
        var p = TK.ratio(cnt, den), goal = r.hb.goal;

        else r.bar.style.removeProperty('--g');
        r.bar.classList.toggle('has-goal', !!goal);
        r.bar.classList.toggle('tk-progress--sage', met);
        r.bar.classList.toggle('tk-progress--rose', !met);

        r.cnt.textContent = cnt + ' / ' + den;
        r.cnt.title = r.sc && r.sc.perWeek ? 'Țintă: ' + schedLabel(r.sc, true).toLowerCase() + ' · ' + cnt + ' bifări care contează din ' + den + ' datorate până acum (' + full + ' pe toată luna)'
          : den < s.n ? den + ' zile care contează până acum din ' + s.n + (r.sc ? ' (' + schedLabel(r.sc, true).toLowerCase() + ')' : '') : '';
      });

      TK.charts.donut(refs.sumDonut, { value: ratio, top: 'Progres', main: F.pct(ratio, 1), size: 96, thickness: 10 });
      refs.sumCount.textContent = frac;
      var el = s.lastDay;
      refs.sum.pct.textContent = pctTxt;
      refs.sum.done.textContent = String(s.total);
      refs.sum.left.textContent = String(s.max - s.total);
      refs.sum.total.textContent = String(s.max);
      refs.sum.avg.textContent = el && s.max ? F.num(s.total / el, 1) + ' / ' + F.num(s.max / el, s.max % el ? 1 : 0) : '—';
      refs.sum.goals.textContent = s.goalsSet ? s.goalsMet + ' / ' + s.goalsSet : '—';

      TK.charts.area(refs.area, {
        labels: days.map(function (dm) { return String(dm.d); }),
        values: s.dayRatio,
        max: 1, height: 118, axisLabels: false,
        tips: days.map(function (dm, i) { return dm.d + ' ' + MONTHS_LOWER[c.m] + '\n' + (s.dayRatio[i] != null ? pct0(s.dayRatio[i]) + ' · ' + s.perDay[i] + ' / ' + s.eligible[i] : dm.future ? 'zi viitoare' : 'fără obiceiuri'); }),

      });
      days.forEach(function (dm, i) {
        // zilele viitoare (și cele fără obiceiuri) rămân goale: nu intră la numitor

        refs.dyn.chk[i].textContent = t ? String(k) : '';
        refs.dyn.un[i].textContent = t ? String(t - k) : '';
        refs.dyn.tot[i].textContent = t ? String(t) : '';
      });

      TK.clear(refs.top);
      for (var r = 0; r < 10; r++) {
        var idx = s.order[r];
        if (idx == null) {
          refs.top.appendChild(h('tr', { class: 'is-empty' }, h('td', null, String(r + 1)), h('td'), h('td')));
          continue;
        }
        var p = s.rate[idx];
        refs.top.appendChild(h('tr', null,
          h('td', null, String(r + 1)),
          h('td', { class: 'hb-top-name', title: s.hs[idx].name }, s.hs[idx].name),
          h('td', { class: 'num' }, h('span', { class: 'tk-pct' + (p >= 1 ? ' is-full' : '') }, pct0(p)))));
      }
    }
    update();
  }

  /* programul unui obicei: zilnic, doar în anumite zile sau de N ori pe săptămână */
  function editSchedule(c, hb) {
    var sc = cleanSched(hb.sched);
    var mode = !sc ? 'daily' : sc.perWeek ? 'week' : 'days';
    var days = sc && sc.days ? sc.days.slice() : [0, 1, 2, 3, 4];
    var perWeek = sc && sc.perWeek ? sc.perWeek : 3;
    var err = h('p', { class: 'tk-form-error', role: 'alert', hidden: true });
    function radio(val, label) {
      var r = h('input', { type: 'radio', name: 'hb-sched-mode', value: val, checked: mode === val, onchange: function () { mode = val; sync(); } });
      return h('label', { class: 'hb-sd__opt' }, r, h('span', null, label));
    }
    var dayBtns = D.WEEKDAYS_SHORT.map(function (lab, d) {
      var b = h('button', {
        type: 'button', class: 'hb-sd__day', title: D.WEEKDAYS[d], 'aria-pressed': String(days.indexOf(d) !== -1),
        onclick: function () {
          var k = days.indexOf(d);
          if (k === -1) days.push(d); else days.splice(k, 1);
          b.setAttribute('aria-pressed', String(k === -1));
          mode = 'days'; sync();
        },
      }, lab);
      return b;
    });
    var nIn = h('select', { class: 'tk-select hb-sd__n', 'aria-label': 'De câte ori pe săptămână', onchange: function () { perWeek = +nIn.value; mode = 'week'; sync(); } },
      [1, 2, 3, 4, 5, 6].map(function (k) { return h('option', { value: String(k), selected: k === perWeek }, String(k)); }));
    var radios = [radio('daily', 'În fiecare zi'), radio('days', 'Doar în anumite zile'), radio('week', 'De un număr de ori pe săptămână')];
    function sync() {
      radios.forEach(function (l) { var r = l.querySelector('input'); r.checked = r.value === mode; });
      err.hidden = true;
    }
    var box = h('div', { class: 'tk-stack hb-sd' },
      h('p', { class: 'tk-muted' }, 'Zilele în care obiceiul nu e programat nu scad procentul. Poți totuși să le bifezi.'),
      radios[0],
      radios[1], h('div', { class: 'hb-sd__days', role: 'group', 'aria-label': 'Zilele săptămânii' }, dayBtns),
      radios[2], h('div', { class: 'hb-sd__week' }, nIn, h('span', null, 'ori pe săptămână (săptămânile grilei: 1–7, 8–14, …)')),
      err);
    TK.ui.modal({
      title: 'Program: ' + hb.name,
      content: box,
      actions: [
        { label: 'Anulează', kind: 'ghost' },
        { label: 'Salvează', kind: 'primary', onClick: function () {
          var next = mode === 'daily' ? null : mode === 'week' ? { perWeek: perWeek } : { days: days.slice() };
          if (mode === 'days' && !days.length) { err.textContent = 'Alege cel puțin o zi.'; err.hidden = false; return false; }
          next = cleanSched(next);
          if (next) hb.sched = next; else delete hb.sched;
          c.api.commit();
          c.rerender();
          TK.ui.toast('„' + hb.name + '”: ' + schedLabel(next, true).toLowerCase() + '.');
        } },
      ],
    });
  }

  /* mutare prin tragere de numărul din lista „Obiceiuri zilnice” */
  function moveHabit(c, hb, ref, after, refocus) {
    var arr = c.st.habits;
    if (hb === ref) return;
    var from = arr.indexOf(hb);
    if (from === -1 || arr.indexOf(ref) === -1) return;
    arr.splice(from, 1);
    arr.splice(arr.indexOf(ref) + (after ? 1 : 0), 0, hb);
    c.api.commit();
    c.rerender();
    if (refocus) {
      var el = document.getElementById('hb-name-' + hb.id);
      if (el) el.focus();
    }
  }

  function startDrag(e, c, hb, grip) {
    if (e.button != null && e.button !== 0) return;
    e.preventDefault();
    var row = grip.closest('tr');
    var body = row.parentNode;
    var ghost = h('div', { class: 'hb-ghost' }, hb.name);
    document.body.appendChild(ghost);
    row.classList.add('is-dragging');
    var marked = null, target = null;
    function place(x, y) { ghost.style.left = (x + 12) + 'px'; ghost.style.top = (y - 14) + 'px'; }
    function clearMark() { if (marked) marked.classList.remove('is-drop-before', 'is-drop-after'); marked = null; }
    function move(ev) {
      if (ev.clientY < 60) window.scrollBy(0, -14);
      else if (ev.clientY > window.innerHeight - 60) window.scrollBy(0, 14);
      place(ev.clientX, ev.clientY);
      clearMark();
      target = null;
      var el = document.elementFromPoint(ev.clientX, ev.clientY);
      var tr = el && el.closest ? el.closest('tr') : null;
      if (!tr || tr.parentNode !== body) return;
      var onAdd = tr.classList.contains('hb-addrow');
      if (onAdd) tr = tr.previousElementSibling;
      if (!tr || !tr.dataset.h) return;
      var ref = c.st.habits.filter(function (x) { return x.id === tr.dataset.h; })[0];
      if (!ref) return;
      var r = tr.getBoundingClientRect();
      var after = onAdd || ev.clientY > r.top + r.height / 2;
      target = { ref: ref, after: after };
      marked = tr;
      tr.classList.add(after ? 'is-drop-after' : 'is-drop-before');
    }
    function end(ev) {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', end);
      document.removeEventListener('pointercancel', end);
      ghost.remove();
      row.classList.remove('is-dragging');
      clearMark();
      if (ev.type === 'pointercancel' || !target) return;
      moveHabit(c, hb, target.ref, target.after);
    }
    place(e.clientX, e.clientY);
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', end);
    document.addEventListener('pointercancel', end);
  }

  function removeHabit(c, hb) {
    var st = c.st, api = c.api;
    var hasPast = (hb.createdAt || '').slice(0, 7) < c.ym;
    var monthName = D.MONTHS[c.m].toLowerCase() + ' ' + c.y;
    function purge() {
      st.habits = st.habits.filter(function (x) { return x !== hb; });
      Object.keys(st.checks).forEach(function (k) {
        delete st.checks[k][hb.id];
        if (!Object.keys(st.checks[k]).length) delete st.checks[k];
      });
      api.commit();
      c.rerender();
      TK.ui.toast('Obiceiul „' + hb.name + '” a fost șters.');
    }
    var actions = [{ label: 'Anulează', kind: 'ghost' }, { label: 'Șterge definitiv', kind: 'danger', onClick: purge }];
    if (hasPast) {
      actions.push({
        label: 'Oprește din ' + monthName, kind: 'primary', onClick: function () {
          hb.archivedYm = c.ym;
          Object.keys(st.checks).forEach(function (k) {
            if (k >= c.ym && st.checks[k][hb.id]) {
              delete st.checks[k][hb.id];
              if (!Object.keys(st.checks[k]).length) delete st.checks[k];
            }
          });
          api.commit();
          c.rerender();
          TK.ui.toast('„' + hb.name + '” nu mai apare din ' + monthName + '. Lunile trecute rămân neschimbate.');
        },
      });
    }
    TK.ui.modal({
      title: 'Elimini obiceiul „' + hb.name + '”?',
      content: hasPast
        ? 'Poți opri obiceiul începând cu ' + monthName + ' și păstra istoricul lunilor trecute, sau îl poți șterge definitiv împreună cu toate bifele.'
        : 'Obiceiul și bifele lui vor fi șterse.',
      actions: actions,
    });
  }

  function addForm(id, placeholder, max, count, onAdd) {

      class: 'tk-cell-input', id: id, maxlength: 80, autocomplete: 'off',

    });

  // Adaugă în `dst` textele din `src` care lipsesc (nebifate). -> câte au fost adăugate
  function mergeList(dst, src, max) {
    var have = {};
    dst.forEach(function (it) { have[it.text.toLowerCase()] = 1; });
    var added = 0;
    src.forEach(function (it) {
      if (dst.length >= max || have[it.text.toLowerCase()]) return;
      dst.push({ id: uid('i'), text: it.text, done: false });
      have[it.text.toLowerCase()] = 1;
      added++;
    });
    return added;
  }

  /* ------------------------------------------------------------ vederea Săptămânal */

  function renderWeekly(root, c) {
    var st = c.st, api = c.api;
    var weeks = D.chunkWeeks(c.y, c.m);
    var sel = api.prefs.get('week', 'all');
    if (sel !== 'all' && !(sel >= 0 && sel < weeks.length)) sel = 'all';

    function list(wi, create) {
      var arr = st.weekly[c.ym];
      if (!arr && create) arr = st.weekly[c.ym] = weeks.map(function () { return []; });
      if (!arr) return [];
      while (create && arr.length < weeks.length) arr.push([]);
      if (!arr[wi] && create) arr[wi] = [];
      return arr[wi] || [];
    }
    function prevList(wi) {
      if (wi > 0) return list(wi - 1);
      var pym = shiftYm(c.ym, -1), arr = st.weekly[pym];
      return (arr && arr[arr.length - 1]) || [];
    }
    function selection() {
      return sel === 'all' ? weeks.map(function (_, i) { return i; }) : [sel];
    }

    var selEl = h('select', {
      id: 'hb-week-sel', class: 'tk-cell-input',
      onchange: function () { sel = selEl.value === 'all' ? 'all' : +selEl.value; api.prefs.set('week', sel); c.rerender(); },
    }, h('option', { value: 'all', selected: sel === 'all' }, 'Toate'),
      weeks.map(function (w, i) { return h('option', { value: String(i), selected: sel === i }, 'Săptămâna ' + (i + 1) + ' · ' + weekRange(w, c.m)); }));
    var stats = statsCard('Obiceiuri', 'săptămânale', 'Săptămânal',
      h('div', { class: 'tk-kv hb-week-kv' }, h('label', { class: 'tk-kv__k', for: 'hb-week-sel' }, 'Alege săptămâna'), h('span', { class: 'tk-kv__v' }, selEl)));

    function updateStats() {
      var all = [];
      selection().forEach(function (wi) { all = all.concat(list(wi)); });
      stats.set(listStats(all));
    }

    var cols = h('div', { class: 'hb-weeks' + (sel === 'all' ? '' : ' is-single') });
    var colEls = {};
    function buildCol(wi) {
      var w = weeks[wi], items = list(wi);
      var ls = listStats(items);
      var pctEl = h('span', { class: 'tk-pct' }, F.pct(ls.ratio, 0));
      var bar = h('span', { class: 'tk-progress tk-progress--bar tk-progress--sage hb-wbar', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': String(Math.round(ls.ratio * 100)), 'aria-label': 'Progres săptămâna ' + (wi + 1), style: { '--p': (ls.ratio * 100).toFixed(1) + '%' } });
      var foot = h('b', null, ls.done + ' / ' + ls.total);
      function refresh() {
        var l2 = listStats(list(wi));
        pctEl.textContent = F.pct(l2.ratio, 0);
        pctEl.classList.toggle('is-full', l2.total > 0 && l2.ratio >= 1);
        bar.style.setProperty('--p', (l2.ratio * 100).toFixed(1) + '%');
        bar.setAttribute('aria-valuenow', String(Math.round(l2.ratio * 100)));
        foot.textContent = l2.done + ' / ' + l2.total;
        updateStats();
      }
      function rebuild(focusAdd) {
        var fresh = buildCol(wi);
        colEls[wi].replaceWith(fresh);
        colEls[wi] = fresh;
        updateStats();
        if (focusAdd) { var a = document.getElementById('hb-wadd-' + wi); if (a) a.focus(); }
      }
      var ul = h('ul', { class: 'hb-items', 'aria-label': 'Lista săptămânii ' + (wi + 1) });
      items.forEach(function (it) {
        ul.appendChild(itemRow('hb-w' + wi, it, function () { api.commit(); refresh(); }, function () {
          var arr = list(wi, true);
          arr.splice(arr.indexOf(it), 1);
          api.commit();
          rebuild(false);
          TK.ui.toast('„' + it.text + '” a fost șters.');
        }));
      });
      ul.appendChild(addForm('hb-wadd-' + wi, '+ Adaugă…', MAX_WEEKLY, items.length, function (v) {
        list(wi, true).push({ id: uid('i'), text: v, done: false });
        api.commit();
        rebuild(true);
      }));

  function renderMonthly(root, c) {
    var st = c.st, api = c.api;
    function list(create) {
      if (!st.monthly[c.ym] && create) st.monthly[c.ym] = [];

    main.appendChild(build());

      h('div', { class: 'hb-lists__main' }, main)));
    stats.set(listStats(list()));
  }

  /* ------------------------------------------------------------ înregistrare */

  var DEF = {
    id: 'habits',
    slug: 'obiceiuri',
    name: 'Tracker de obiceiuri',
    short: 'Obiceiuri',
    tone: 'sage',
    tagline: 'Bifezi ce ai făcut, iar procentele, graficele și topul se calculează singure.',
    version: 1,
    createDemo: createDemo,
    createEmpty: createEmpty,
    migrate: normalize,

  TK.register(DEF);

  // expus pentru teste
  TK._habits = { monthStats: monthStats, listStats: listStats, createDemo: createDemo, normalize: normalize, createdAtFor: createdAtFor };
})();
