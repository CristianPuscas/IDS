<!--
  Saltbox 3PL Calculator — results card logic as one Webflow Code Embed.
  Reads the left card (inputs with data-calc-input) and writes the right card
  (native elements with IDs sb-3pl-annual, sb-sb-annual, sb-gap-num, sb-gap-pct,
  sb-cpo-current, sb-cpo-saltbox, sb-insight). Logic and copy match the base coded calculator.
  Place this Embed anywhere on the page (e.g. at the bottom of the results card).
-->
<script>
  (function () {
    if (window.__calc3plInit) return;
    window.__calc3plInit = true;

    function boot() {
      var fmt0 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
      var fmt2 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 });
      var fmtPct = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 });

      // Modeling constants
      var RETURNS_RATE = 0.05;      // 5% returns rate applied to monthly order volume
      var AVG_CARRIER_RATE = 8.00;  // baseline $/order when shipping markup is entered as a %
      var SALTBOX_MONTHLY = 349;    // Access plan published rate

      // Left card: inputs
      var inputs = {};
      document.querySelectorAll('[data-calc-input]').forEach(function (el) { inputs[el.dataset.calcInput] = el; });

      // Right card: outputs
      var $ = function (id) { return document.getElementById(id); };
      var out = {
        threePLAnnual: $('sb-3pl-annual'),
        sbAnnual:      $('sb-sb-annual'),
        gapNum:        $('sb-gap-num'),
        gapPct:        $('sb-gap-pct'),
        cpoCurrent:    $('sb-cpo-current'),
        cpoSaltbox:    $('sb-cpo-saltbox'),
        insight:       $('sb-insight')
      };

      var markupMode = 'dollar';

      // Missing field or empty value counts as 0; accepts "3,50" as well as "3.50"
      function n(key) {
        var el = inputs[key];
        if (!el) return 0;
        var v = parseFloat(String(el.value).replace(',', '.'));
        return isFinite(v) && v >= 0 ? v : 0;
      }

      function set(el, text) { if (el) el.textContent = text; }

      function recalc() {
        var orders    = n('orders');
        var pickpack  = n('pickpack');
        var storage   = n('storage');
        var account   = n('account');
        var receiving = n('receiving');
        var returns   = n('returns');

        var markupPerOrder = markupMode === 'dollar'
          ? n('markup-dollar')
          : (n('markup-percent') / 100) * AVG_CARRIER_RATE;

        var monthlyPickpack = orders * pickpack;
        var monthlyShipping = orders * markupPerOrder;
        var monthlyReturns  = orders * RETURNS_RATE * returns;
        var monthlyAll      = storage + account + receiving + monthlyPickpack + monthlyShipping + monthlyReturns;
        var annual3pl       = monthlyAll * 12;
        var annualSaltbox   = SALTBOX_MONTHLY * 12;
        var gap             = annual3pl - annualSaltbox;
        var gapPct          = annual3pl > 0 ? (gap / annual3pl) * 100 : 0;
        var cpoCurrent      = orders > 0 ? monthlyAll / orders : 0;
        var cpoSaltbox      = orders > 0 ? SALTBOX_MONTHLY / orders : 0;

        set(out.threePLAnnual, fmt0.format(annual3pl));
        set(out.sbAnnual,      fmt0.format(annualSaltbox));
        set(out.gapNum,        fmt0.format(Math.max(0, gap)));
        set(out.gapPct,        fmtPct.format(Math.max(0, gapPct)) + '%');
        set(out.cpoCurrent,    fmt2.format(cpoCurrent));
        set(out.cpoSaltbox,    fmt2.format(cpoSaltbox));

        // Plain-language insight, written from real inputs
        if (out.insight) {
          var msg;
          if (orders === 0 || monthlyAll === 0) {
            msg = '<strong>Add your numbers.</strong> Even rough estimates work. The math is built to surface the gap, not catch you on a decimal.';
          } else if (gap <= 0) {
            msg = '<strong>Tight margins on your side.</strong> Your 3PL fees come in under or near a Saltbox membership floor. The fuller picture (carrier rates, labor flexibility) is worth a call to map out.';
          } else {
            var ordersLabel = new Intl.NumberFormat('en-US').format(orders);
            msg = '<strong>What this means.</strong> At ' + ordersLabel + ' orders/month, you\'re paying about ' + fmt2.format(cpoCurrent) + ' per order to your 3PL. The gap above shows the delta vs. a Saltbox membership floor, before Parsel shipping rates and Saltbox Operations Services labor are layered in.';
          }
          out.insight.innerHTML = msg;
        }
      }

      // Wire input listeners
      Object.keys(inputs).forEach(function (k) { inputs[k].addEventListener('input', recalc); });

      // Wire markup toggle (native Webflow buttons with data-markup)
      var toggleBtns  = document.querySelectorAll('.calculator3pl_toggle-button[data-markup]');
      var dollarWrap  = document.querySelector('[data-markup-input="dollar"]');
      var percentWrap = document.querySelector('[data-markup-input="percent"]');
      toggleBtns.forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.preventDefault();
          markupMode = btn.dataset.markup;
          toggleBtns.forEach(function (b) {
            var on = b === btn;
            b.classList.toggle('is-active', on);
            b.setAttribute('aria-pressed', on ? 'true' : 'false');
          });
          if (dollarWrap)  dollarWrap.style.display  = markupMode === 'dollar'  ? 'flex' : 'none';
          if (percentWrap) percentWrap.style.display = markupMode === 'percent' ? 'flex' : 'none';
          recalc();
        });
      });

      recalc();
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  })();
</script>
