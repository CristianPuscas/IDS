<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />

<style>
  .sbx-map-wrap {
    position: relative; width: 100%; height: 581px;
    border-radius: 24px; overflow: hidden; background: #2a2c2b; isolation: isolate;
  }
  .sbx-map { position: absolute; inset: 0; }
  .sbx-ph {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: #777; font-size: 16px; text-align: center; padding: 20px;
  }

  .sbx-pin { width: 28px; height: 28px; cursor: pointer; }
  .sbx-pin span {
    display: block; width: 100%; height: 100%; background: #f9e46b;
    border-radius: 50% 50% 50% 0; box-shadow: 0 4px 14px rgba(0,0,0,.5);
    transform: rotate(-45deg); transition: transform .2s ease;
  }
  .sbx-pin:hover span { transform: rotate(-45deg) scale(1.15); }
  .sbx-pin.sbx-on { z-index: 2; }
  .sbx-pin.sbx-on span { transform: rotate(-45deg) scale(1.3); }

  .sbx-tip .maplibregl-popup-content {
    background: #2b2f2d; color: #fff; border-radius: 8px; padding: 6px 10px;
    font-family: inherit; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.4);
  }
  .sbx-tip.maplibregl-popup-anchor-bottom .maplibregl-popup-tip { border-top-color: #2b2f2d; }

  .sbx-map .maplibregl-ctrl-group { background: #2b2f2d; box-shadow: none; }
  .sbx-map .maplibregl-ctrl-group button + button { border-top-color: #3a3f3c; }
  .sbx-map .maplibregl-ctrl-group button .maplibregl-ctrl-icon { filter: invert(1); }
  .sbx-map .maplibregl-ctrl-group button:hover { background: #3a3f3c; }
  .sbx-map .maplibregl-ctrl-attrib { background: rgba(0,0,0,.45); font-size: 10px; }
  .sbx-map .maplibregl-ctrl-attrib, .sbx-map .maplibregl-ctrl-attrib a { color: #999; }
  .sbx-map .maplibregl-ctrl-attrib-button { filter: invert(1); background-color: transparent; }

  .sbx-pop {
    position: absolute; z-index: 5; right: 10.5%; top: 50%; width: 315px;
    max-height: calc(100% - 32px); overflow: auto; box-sizing: border-box;
    display: flex; flex-direction: column; gap: 24px;
    padding: 22px; border-radius: 20px; background: #fff; color: #1f2623;
    box-shadow: 0 20px 50px rgba(0,0,0,.35);
    opacity: 0; visibility: hidden; transform: translate(16px, -50%);
    transition: opacity .3s ease, transform .3s ease, visibility 0s .3s;
  }
  .sbx-pop.sbx-open { opacity: 1; visibility: visible; transform: translate(0, -50%); transition-delay: 0s; }
  .sbx-pop [hidden] { display: none !important; }
  .sbx-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .sbx-state { font-size: 14px; line-height: 1.2; letter-spacing: .02em; text-transform: uppercase; }
  .sbx-x {
    flex: none; width: 20px; height: 20px; border: 0; border-radius: 50%; padding: 0;
    display: grid; place-items: center; background: transparent; color: inherit; cursor: pointer;
    transition: background .2s;
  }
  .sbx-x:hover, .sbx-x:focus-visible { background: #efefec; }
  .sbx-img { display: block; width: 100%; aspect-ratio: 271 / 143; object-fit: cover; border-radius: 10px; }
  .sbx-txt { display: flex; flex-direction: column; gap: 8px; margin-bottom: -8px; }
  .sbx-city { font-size: 26px; font-weight: 400; line-height: 1.2; }
  .sbx-area { font-size: 22px; line-height: 1.25; color: #6b6f6d; }
  .sbx-addr { font-size: 16px; line-height: 1.5; color: #6b6f6d; }
  .sbx-desc { margin: 0; font-size: 14px; line-height: 1.5; }
  .sbx-btn {
    align-self: flex-start; display: inline-flex; align-items: center; gap: 10px;
    padding: 10px 20px; border-radius: 999px; background: #1f2623; color: #fff;
    font-size: 16px; line-height: 1.375; text-decoration: none;
  }
  .sbx-btn svg { color: #f9e46b; }

  @media (max-width: 991px) { .sbx-map-wrap { height: 520px; } }
  @media (max-width: 767px) {
    .sbx-map-wrap { height: 460px; border-radius: 16px; }
    .sbx-pop {
      left: 16px; right: 16px; bottom: 16px; top: auto; width: auto; max-height: 70%;
      padding: 18px; gap: 14px; border-radius: 16px; transform: translateY(16px);
    }
    .sbx-pop.sbx-open { transform: none; }
    .sbx-state { font-size: 14px; }
    .sbx-city { font-size: 22px; }
    .sbx-area { font-size: 18px; }
    .sbx-addr { font-size: 15px; }
  }
</style>

<div class="sbx-map-wrap" id="sbx-wrap">
  <div class="sbx-ph">Map loads on the published site</div>
  <div class="sbx-map" id="sbx-map"></div>
  <div class="sbx-pop" id="sbx-pop" role="dialog" aria-label="Location details" aria-hidden="true">
    <div class="sbx-head">
      <span class="sbx-state"></span>
      <button type="button" class="sbx-x" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13"/></svg>
      </button>
    </div>
    <img class="sbx-img" alt="" hidden>
    <div class="sbx-txt">
      <div class="sbx-city"></div>
      <div class="sbx-area"></div>
      <div class="sbx-addr"></div>
    </div>
    <p class="sbx-desc"></p>
    <a class="sbx-btn" href="#">View location
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11L11 3M4.5 3H11v6.5"/></svg>
    </a>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script>
(function () {
  var MAP_STYLE = 'https://tiles.openfreemap.org/styles/dark';
  var MAP_COLORS = {
    land: '#2a2c2b', park: '#2d322f', water: '#18191a', building: '#343736',
    road: '#454947', roadMajor: '#5c605e', rail: '#4a4d4c', boundary: '#6a6e6c',
    label: '#b4b8b6', labelMajor: '#dfe2e0', halo: '#1f2120'
  };

  // Lighten the dark base style so streets and labels stay readable.
  function recolor(map) {
    var c = MAP_COLORS, has = function (id, words) {
      return words.some(function (w) { return id.indexOf(w) !== -1; });
    };
    var set = function (id, prop, val) { try { map.setPaintProperty(id, prop, val); } catch (e) {} };
    map.getStyle().layers.forEach(function (l) {
      var id = l.id.toLowerCase();
      if (l.type === 'background') set(l.id, 'background-color', c.land);
      else if (l.type === 'fill') {
        set(l.id, 'fill-color', has(id, ['water', 'ocean', 'lake']) ? c.water
          : has(id, ['building']) ? c.building
          : has(id, ['park', 'wood', 'grass', 'forest', 'green']) ? c.park : c.land);
        set(l.id, 'fill-opacity', 1);
      } else if (l.type === 'fill-extrusion') set(l.id, 'fill-extrusion-color', c.building);
      else if (l.type === 'line') {
        if (has(id, ['water', 'river', 'stream', 'canal'])) set(l.id, 'line-color', c.water);
        else if (has(id, ['boundary', 'admin'])) set(l.id, 'line-color', c.boundary);
        else if (has(id, ['rail', 'transit'])) set(l.id, 'line-color', c.rail);
        else set(l.id, 'line-color', has(id, ['motorway', 'trunk', 'primary', 'major', 'highway']) ? c.roadMajor : c.road);
      } else if (l.type === 'symbol' && l.layout && l.layout['text-field']) {
        set(l.id, 'text-color', has(id, ['city', 'country', 'state', 'capital']) ? c.labelMajor : c.label);
        set(l.id, 'text-halo-color', c.halo);
      }
    });
  }

  function txt(root, sel) {
    var n = root.querySelector(sel);
    return n ? n.textContent.trim() : '';
  }

  function init() {
    var el = document.getElementById('sbx-map');
    if (!el || el.dataset.ready || !window.maplibregl) return;
    el.dataset.ready = '1';
    var wrap = el.parentNode, pop = document.getElementById('sbx-pop');
    var ph = wrap.querySelector('.sbx-ph');
    if (ph) ph.remove();
    var q = function (s) { return pop.querySelector(s); };

    var locs = [];
    document.querySelectorAll('[data-map-card]').forEach(function (card) {
      var d = card.dataset, lat = parseFloat(d.lat), lng = parseFloat(d.lng);
      if (isNaN(lat) || isNaN(lng)) return;
      locs.push({
        card: card, lngLat: [lng, lat], state: d.state || '',
        city: txt(card, '[data-map-city]'), area: txt(card, '[data-map-area]'),
        addr: d.address || '', desc: d.desc || '', link: d.link || '', img: d.image || ''
      });
    });

    var bounds = new maplibregl.LngLatBounds();
    locs.forEach(function (l) { bounds.extend(l.lngLat); });
    var pad = function () { return Math.min(80, el.clientWidth / 8); };
    var opts = locs.length
      ? { bounds: bounds, fitBoundsOptions: { padding: pad(), maxZoom: 10 } }
      : { center: [-98.5, 39.5], zoom: 3 };

    var map = new maplibregl.Map(Object.assign({
      container: el,
      style: MAP_STYLE,
      scrollZoom: false,
      dragRotate: false,
      pitchWithRotate: false,
      touchPitch: false,
      attributionControl: { compact: true }
    }, opts));
    map.touchZoomRotate.disableRotation();
    map.on('load', function () { recolor(map); });
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-left');

    var touched = false, active = null;
    var fitAll = function (duration) {
      if (locs.length) map.fitBounds(bounds, { padding: pad(), maxZoom: 10, duration: duration });
    };

    function fill(l) {
      var set = function (sel, v) { var n = q(sel); n.textContent = v; n.hidden = !v; };
      set('.sbx-state', l.state);
      set('.sbx-city', l.city);
      set('.sbx-area', l.area);
      set('.sbx-addr', l.addr);
      set('.sbx-desc', l.desc);
      var img = q('.sbx-img');
      img.hidden = !l.img;
      if (l.img) img.src = l.img; else img.removeAttribute('src');
      img.alt = l.img ? [l.city, l.area].filter(Boolean).join(' – ') : '';
      var btn = q('.sbx-btn');
      btn.hidden = !l.link;
      btn.href = l.link || '#';
    }

    // Offset the target so the pin sits in the free space beside / above the popup.
    function flyOffset() {
      var w = el.clientWidth, h = el.clientHeight;
      if (window.innerWidth <= 767) return [0, Math.max(pop.offsetTop / 2, 50) - h / 2];
      var left = pop.offsetLeft;
      return [left > 120 ? left / 2 - w / 2 : -(w * 0.22), 0];
    }

    function select(l, fromCard) {
      active = l;
      touched = true;
      locs.forEach(function (o) {
        var on = o === l;
        o.card.classList.toggle('is-active', on);
        o.card.setAttribute('aria-pressed', on);
        o.pin.classList.toggle('sbx-on', on);
      });
      fill(l);
      pop.classList.add('sbx-open');
      pop.setAttribute('aria-hidden', 'false');
      map.flyTo({ center: l.lngLat, zoom: 12, speed: 1.4, offset: flyOffset() });
      if (fromCard && window.innerWidth <= 991) {
        var r = wrap.getBoundingClientRect();
        if (r.top < 0 || r.bottom > window.innerHeight) wrap.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function close() {
      if (!active) return;
      active = null;
      pop.classList.remove('sbx-open');
      pop.setAttribute('aria-hidden', 'true');
      locs.forEach(function (o) {
        o.card.classList.remove('is-active');
        o.card.setAttribute('aria-pressed', 'false');
        o.pin.classList.remove('sbx-on');
      });
      fitAll(1200);
      touched = false;
    }

    locs.forEach(function (l) {
      var name = [l.city, l.area].filter(Boolean).join(' – ');
      var pin = document.createElement('div');
      pin.className = 'sbx-pin';
      pin.appendChild(document.createElement('span'));
      pin.setAttribute('aria-label', name);
      l.pin = pin;

      var tip = new maplibregl.Popup({ className: 'sbx-tip', closeButton: false, closeOnClick: false, offset: 30 })
        .setText(name);
      new maplibregl.Marker({ element: pin, anchor: 'bottom' }).setLngLat(l.lngLat).addTo(map);

      pin.addEventListener('mouseenter', function () { tip.setLngLat(l.lngLat).addTo(map); });
      pin.addEventListener('mouseleave', function () { tip.remove(); });
      pin.addEventListener('click', function (e) {
        e.stopPropagation();
        tip.remove();
        select(l);
      });

      var card = l.card;
      card.setAttribute('role', 'button');
      card.setAttribute('tabindex', '0');
      card.setAttribute('aria-pressed', 'false');
      card.addEventListener('click', function () { select(l, true); });
      card.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(l, true); }
      });
    });

    q('.sbx-x').addEventListener('click', close);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });

    // Refit to all pins on resize until the user moves the map.
    map.on('dragstart', function () { touched = true; });
    map.on('zoomstart', function (e) { if (e.originalEvent) touched = true; });
    var refit = function () {
      map.resize();
      if (!touched) fitAll(0);
    };
    if ('ResizeObserver' in window) new ResizeObserver(refit).observe(el);
    window.addEventListener('load', refit);

    // Scroll-zoom only after a click on the map, so page scrolling is not hijacked.
    map.on('click', function (e) {
      map.scrollZoom.enable();
      var t = e.originalEvent && e.originalEvent.target;
      if (!(t && t.closest && t.closest('.sbx-pin'))) close();
    });
    el.addEventListener('mouseleave', function () { map.scrollZoom.disable(); });
  }

  function start() {
    if (window.maplibregl) init();
    else window.addEventListener('load', init);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
