<!-- ============================================================
     SALTBOX MAP (dark) — Webflow Code Embed
     Lipeste tot codul intr-un element "Code Embed" in Webflow.
     Editeaza doar lista LOCATIONS din <script>.
     Harta: Leaflet + CARTO Dark Matter (fara API key).
     ============================================================ -->

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
  .sbx-map-wrap {
    position: relative;
    width: 100%;
    height: 785px;
    border-radius: 24px;
    overflow: hidden;
    background: #1e1e1e;
    isolation: isolate;
  }
  .sbx-map { position: absolute; inset: 0; background: #1e1e1e; font-family: inherit; }

  .sbx-map .leaflet-control-attribution { background: rgba(0,0,0,.45); color: #888; font-size: 10px; }
  .sbx-map .leaflet-control-attribution a { color: #aaa; }
  .sbx-map .leaflet-control-zoom { border: none; margin: 16px; }
  .sbx-map .leaflet-control-zoom a {
    background: #2b2f2d; color: #fff; border: none;
    width: 36px; height: 36px; line-height: 36px;
  }
  .sbx-map .leaflet-control-zoom a:hover { background: #3a3f3c; }

  /* pin galben */
  .sbx-pin { background: none; border: none; }
  .sbx-pin span {
    display: block; width: 100%; height: 100%;
    background: #f9e46b;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    box-shadow: 0 4px 14px rgba(0,0,0,.5);
    transition: transform .2s ease;
  }
  .sbx-pin:hover span { transform: rotate(-45deg) scale(1.15); }

  /* eticheta la hover */
  .sbx-map .leaflet-tooltip.sbx-tip {
    background: #2b2f2d; color: #fff; border: none; border-radius: 8px;
    padding: 6px 10px; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.4);
  }
  .sbx-map .leaflet-tooltip.sbx-tip::before { border-top-color: #2b2f2d; }

  @media (max-width: 991px) { .sbx-map-wrap { height: 600px; } }
  @media (max-width: 767px) { .sbx-map-wrap { height: 460px; border-radius: 16px; } }
</style>

<div class="sbx-map-wrap">
  <div class="sbx-map" id="sbx-map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  /* ================= EDITEAZA AICI =================
     lat/lng: click dreapta pe locatie in Google Maps -> click pe coordonate (se copiaza)
     ================================================= */
  var LOCATIONS = [
    { name: 'Atlanta – Upper Westside',       lat: 33.8005, lng: -84.4310 },
    { name: 'Atlanta – Westside Park',        lat: 33.7890, lng: -84.4470 },
    { name: 'Atlanta – Chamblee',             lat: 33.8920, lng: -84.2990 },
    { name: 'Washington DC – Alexandria',     lat: 38.8048, lng: -77.0469 },
    { name: 'Miami',                          lat: 25.8100, lng: -80.3200 },
    { name: 'Los Angeles – San Gabriel Valley', lat: 34.0686, lng: -118.0276 },
    { name: 'Los Angeles – Torrance',         lat: 33.8417, lng: -118.3160 },
    { name: 'Phoenix – Tempe',                lat: 33.4150, lng: -111.9400 },
    { name: 'Seattle',                        lat: 47.5500, lng: -122.3200 },
    { name: 'Chicago',                        lat: 41.9000, lng: -87.7000 },
    { name: 'Denver',                         lat: 39.7700, lng: -104.9800 },
    { name: 'Dallas – Carrollton',            lat: 32.9756, lng: -96.8900 },
    { name: 'Dallas – Farmers Branch',        lat: 32.9265, lng: -96.8961 }
  ];
  /* ================= STOP EDIT ===================== */

  function init() {
    var el = document.getElementById('sbx-map');
    if (!el || el.dataset.ready) return;
    el.dataset.ready = '1';

    var map = L.map(el, { scrollWheelZoom: false });
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    var icon = L.divIcon({ className: 'sbx-pin', html: '<span></span>', iconSize: [28, 28], iconAnchor: [14, 28] });
    var bounds = [];

    LOCATIONS.forEach(function (l) {
      L.marker([l.lat, l.lng], { icon: icon, title: l.name })
        .bindTooltip(l.name, { className: 'sbx-tip', direction: 'top', offset: [0, -30] })
        .on('click', function () { map.flyTo([l.lat, l.lng], 12, { duration: 1.2 }); })
        .addTo(map);
      bounds.push([l.lat, l.lng]);
    });

    map.fitBounds(bounds, { padding: [50, 50] });

    // zoom cu scroll doar dupa click pe harta (nu blocheaza scroll-ul paginii)
    map.on('click', function () { map.scrollWheelZoom.enable(); });
    el.addEventListener('mouseleave', function () { map.scrollWheelZoom.disable(); });
    window.addEventListener('resize', function () { map.invalidateSize(); });
  }

  if (window.L) init();
  else window.addEventListener('load', init);
})();
</script>
