<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Venom Button</title>
<style>
  :root {
    --bg: #d6d3cc;
    --ink: #0b0b0d;
    --muted: #85827b;
    /* 300px on desktop, shrinks so button + 36px zone fit a 360px phone */
    --bw: max(200px, min(300px, calc(100vw - 104px)));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body {
    font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; color: var(--ink);
  }
  #stage {
    position: fixed; inset: 0; display: grid; place-items: center;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    background: radial-gradient(120% 90% at 50% 45%, #dedbd5 0%, var(--bg) 55%, #c8c4bc 100%);
  }
  #stage.venom, #stage.venom * { cursor: none !important; }

  canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; display: block; }
  #back  { z-index: 1; }   /* tendrils, behind the button */
  #front { z-index: 4; }   /* strands wrapped over the hand */

  #hit { position: relative; z-index: 2; display: block; width: var(--bw); height: calc(var(--bw) * .2533); }
  #btn {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%; margin: 0; padding: 0; border: 0;
    border-radius: 9999px; cursor: pointer; overflow: hidden;
    font: inherit; font-weight: 700; font-size: calc(var(--bw) * .0933);
    letter-spacing: -.035em; color: #fff; white-space: nowrap;
    background: linear-gradient(180deg, #2c2c30 0%, #131315 46%, #060607 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.22),
      inset 0 -8px 16px rgba(0,0,0,.55),
      0 18px 30px -14px rgba(0,0,0,.55),
      0 5px 10px -2px rgba(0,0,0,.22);
    -webkit-tap-highlight-color: transparent; outline: none;
  }
  #btn::before { /* glossy highlight */
    content: ""; position: absolute; left: 7%; right: 7%; top: 5%; height: 46%;
    border-radius: 9999px; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.26), rgba(255,255,255,.05) 70%, rgba(255,255,255,0));
  }
  #btn span { position: relative; top: -.04em; }
  #btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

  #hand {
    position: fixed; left: 0; top: 0; width: 32px; height: 32px; z-index: 3;
    pointer-events: none; display: none;
  }
  #hand.on { display: block; }

  #zone {
    position: fixed; z-index: 6; display: none; pointer-events: none;
    border: 1.5px dashed rgba(11,11,13,.55); border-radius: 9999px;
  }
  body.debug #zone { display: block; }
  #zone b {
    position: absolute; right: 22px; top: -9px; padding: 0 6px;
    font-size: 11px; font-weight: 600; color: #3a3833; background: var(--bg);
  }

  #toast {
    position: fixed; left: 50%; top: 24px; z-index: 7;
    transform: translate(-50%, -8px); opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s;
    background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px;
    font-size: 14px; font-weight: 600; white-space: nowrap; max-width: calc(100vw - 32px);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  #hint {
    position: fixed; left: 16px; right: 16px; z-index: 0; margin: 0;
    bottom: max(20px, env(safe-area-inset-bottom));
    text-align: center; color: var(--muted); font-size: 13px; line-height: 1.5;
  }
  #hint kbd { font: inherit; font-weight: 600; padding: 0 5px; border: 1px solid #aaa69e; border-radius: 4px; }
  .touch-only { display: none; }
  @media (hover: none) { .kb { display: none; } .touch-only { display: inline; } .mouse-only { display: none; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="back"></canvas>
  <span id="hit"><button id="btn" type="button"><span>let's collaborate</span></button></span>
  <svg id="hand" viewBox="0 0 32 32" aria-hidden="true">
    <path d="M11 3.5c1.4 0 2.5 1.1 2.5 2.5v8.2c.4-.2.9-.3 1.4-.3 1.1 0 2 .6 2.4 1.5.4-.3 1-.5 1.6-.5 1.2 0 2.2.8 2.5 1.9.4-.2.8-.3 1.3-.3 1.5 0 2.6 1.2 2.6 2.6v4.4c0 4-3.2 7.3-7.3 7.3h-2.3c-2.4 0-4.6-1.2-6-3.1l-4.8-6.8c-.8-1.1-.5-2.6.6-3.4 1-.7 2.4-.5 3.2.4L8.5 18V6c0-1.4 1.1-2.5 2.5-2.5z"
          fill="#fff" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M13.5 15v4.5M17.3 16v4M21.4 17.4v3.2" stroke="#000" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  </svg>
  <canvas id="front"></canvas>
  <div id="zone"><b>36px</b></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <p id="hint">venom zone: 36px — <span class="mouse-only">hover close to the button, then pull away</span><span class="touch-only">drag your finger close to the button, then pull away</span><span class="kb"> · press <kbd>D</kbd> to show the zone</span></p>
</div>

<script>
(function () {
  'use strict';
  var VENOM_ZONE = 36;     // px from the pill edge where the venom grabs you
  var STRETCH = 170;       // how far past the zone the goo stretches before it snaps
  var M = 12;              // rope points per tendril
  var INK = '#0b0b0d';
  var TAU = Math.PI * 2;
  var HOT_X = 11, HOT_Y = 3.5;    // fingertip hotspot inside the 32px hand svg

  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage'), hit = $('hit'), btn = $('btn'), hand = $('hand'), zoneEl = $('zone'), toast = $('toast');
  var cvB = $('back'), cvF = $('front');
  var bctx = cvB.getContext('2d'), fctx = cvF.getContext('2d');

  var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  /* ---------- pill geometry ---------- */
  var W = 0, H = 0, dpr = 1;
  var R = { cx: 0, cy: 0, w: 0, h: 0, r: 0, L: 0, P: 0, left: 0, top: 0 };

  function measure() {
    var b = hit.getBoundingClientRect();
    R.left = b.left; R.top = b.top; R.w = b.width; R.h = b.height;
    R.cx = b.left + b.width / 2; R.cy = b.top + b.height / 2;
    R.r = R.h / 2; R.L = Math.max(0, R.w - R.h); R.P = 2 * R.L + TAU * R.r;
    var z = VENOM_ZONE, bw = 1.5;   // dashed outline centred exactly 36px outside the pill
    zoneEl.style.left = (R.left - z - bw / 2) + 'px';
    zoneEl.style.top = (R.top - z - bw / 2) + 'px';
    zoneEl.style.width = (R.w + 2 * z + bw) + 'px';
    zoneEl.style.height = (R.h + 2 * z + bw) + 'px';
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cvB.width = cvF.width = Math.round(W * dpr);
    cvB.height = cvF.height = Math.round(H * dpr);
    measure(); wake();
  }

  // signed distance to the pill outline (<0 inside)
  function distanceToPill(x, y) {
    var qx = Math.abs(x - R.cx) - R.L / 2;
    var qy = Math.abs(y - R.cy);
    return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - R.r;
  }

  // point + outward normal on the outline at arc length s (clockwise from top-left)
  function perimPoint(s, o) {
    var L = R.L, r = R.r, hl = L / 2, arc = Math.PI * r, a;
    s = ((s % R.P) + R.P) % R.P;
    if (s < L) { o.x = R.cx - hl + s; o.y = R.cy - r; o.nx = 0; o.ny = -1; }
    else if (s < L + arc) {
      a = -Math.PI / 2 + (s - L) / r;
      o.nx = Math.cos(a); o.ny = Math.sin(a); o.x = R.cx + hl + r * o.nx; o.y = R.cy + r * o.ny;
    } else if (s < 2 * L + arc) { o.x = R.cx + hl - (s - L - arc); o.y = R.cy + r; o.nx = 0; o.ny = 1; }
    else {
      a = Math.PI / 2 + (s - 2 * L - arc) / r;
      o.nx = Math.cos(a); o.ny = Math.sin(a); o.x = R.cx - hl + r * o.nx; o.y = R.cy + r * o.ny;
    }
    return o;
  }

  // arc length of the outline point nearest to (x, y)
  function nearestS(x, y) {
    var L = R.L, r = R.r, hl = L / 2, arc = Math.PI * r, a;
    if (x >= R.cx - hl && x <= R.cx + hl) return y < R.cy ? x - (R.cx - hl) : L + arc + (R.cx + hl - x);
    if (x > R.cx + hl) return L + (Math.atan2(y - R.cy, x - (R.cx + hl)) + Math.PI / 2) * r;
    a = Math.atan2(y - R.cy, x - (R.cx - hl));
    if (a < Math.PI / 2) a += TAU;
    return 2 * L + arc + (a - Math.PI / 2) * r;
  }

  /* ---------- state ---------- */
  var ptr = { x: -1e4, y: -1e4, down: false, type: 'mouse' };
  var handPos = { x: 0, y: 0 };      // where the hand is drawn (fingertip)
  var body = { x: 0, y: 0 };         // centre of the hand, what the tendrils grab
  var tmp = { x: 0, y: 0, nx: 0, ny: 0 };
  var active = false, debug = false, s0 = 0, now = 0;
  var tendrils = [], drops = [];

  function makeTendril(sOff, delay, ang) {
    var root = perimPoint(s0 + sOff, { x: 0, y: 0, nx: 0, ny: 0 }), pts = [];
    for (var i = 0; i < M; i++) pts.push({ x: root.x, y: root.y, px: root.x, py: root.y });
    return {
      s: s0 + sOff, sOff: sOff, root: root, pts: pts, state: 'wait',
      t0: now + delay, dur: rand(140, 230),
      ang: ang, rad: rand(5, 12), spin: rand(-1, 1),
      w0: rand(5, 9), w1: rand(1.8, 3.2), phase: rand(0, TAU), life: 1
    };
  }

  function grab() {
    active = true;
    stage.classList.add('venom');
    hand.classList.add('on');
    handPos.x = ptr.x; handPos.y = ptr.y;
    s0 = nearestS(ptr.x, ptr.y);
    var n = reduced ? 6 : 10 + Math.floor(Math.random() * 6);
    var spread = Math.min(R.w * 0.55, R.P * 0.4);
    for (var i = 0; i < n; i++) {
      var u = (i + 0.5) / n + rand(-0.3, 0.3) / n;
      tendrils.push(makeTendril((u - 0.5) * spread, reduced ? 0 : rand(0, 150), (i / n) * TAU + rand(-0.3, 0.3)));
    }
    wake();
  }

  // goo breaks: outer halves drip away, inner halves spring back into the button
  function snapAll() {
    active = false;
    stage.classList.remove('venom');
    hand.classList.remove('on');
    for (var i = tendrils.length - 1; i >= 0; i--) {
      var t = tendrils[i];
      if (t.state === 'wait') { tendrils.splice(i, 1); continue; }
      if (t.state === 'retract') continue;
      if (!reduced) {
        for (var k = Math.floor(M * 0.55); k < M; k += 2) {
          var p = t.pts[k];
          if (Math.random() < 0.6) spawnDrop(p.x, p.y, (p.x - p.px) * 0.5 + rand(-0.5, 0.5), (p.y - p.py) * 0.5, rand(1.8, 3.4));
        }
      }
      t.state = 'retract'; t.t0 = now;
    }
    wake();
  }

  function evaluate() {
    var d = distanceToPill(ptr.x, ptr.y);
    var canGrab = ptr.type === 'mouse' || ptr.down;
    if (!active && canGrab && d <= VENOM_ZONE) grab();
    else if (active && d > VENOM_ZONE + STRETCH) snapAll();
    wake();
  }

  function spawnDrop(x, y, vx, vy, r) {
    if (drops.length < 90) drops.push({ x: x, y: y, vx: vx, vy: vy, r0: r, r: r, life: 1 });
  }

  /* ---------- simulation ---------- */
  // where the hand is drawn: free inside the zone, then rubber-band resistance
  function updateHand() {
    var d = distanceToPill(ptr.x, ptr.y);
    if (d <= 0) { handPos.x = ptr.x; handPos.y = ptr.y; }
    else {
      perimPoint(nearestS(ptr.x, ptr.y), tmp);
      var dx = ptr.x - tmp.x, dy = ptr.y - tmp.y, len = Math.hypot(dx, dy) || 1;
      var drag = d <= VENOM_ZONE ? d : VENOM_ZONE + (d - VENOM_ZONE) * 0.82;
      handPos.x = tmp.x + dx / len * drag; handPos.y = tmp.y + dy / len * drag;
    }
    body.x = handPos.x + 4.5; body.y = handPos.y + 14;
    hand.style.transform = 'translate(' + (handPos.x - HOT_X).toFixed(1) + 'px,' + (handPos.y - HOT_Y).toFixed(1) + 'px)';
  }

  function easeOutBack(p) { var q = p - 1; return 1 + 2.4 * q * q * q + 1.4 * q * q; }

  // returns false when the tendril is gone
  function stepTendril(t, f) {
    if (t.state === 'wait') {
      if (now < t.t0) return true;
      t.state = 'shoot';
    }
    if (active && t.state !== 'retract') {           // roots slide along the edge to follow
      var ds = (s0 + t.sOff) - t.s;
      ds -= Math.round(ds / R.P) * R.P;
      t.s += ds * 0.04 * f;
    }
    var root = perimPoint(t.s, t.root);
    var rx = root.x - root.nx * 4, ry = root.y - root.ny * 4;   // emerge from just under the edge
    var pts = t.pts, first = pts[0], last = pts[M - 1];
    first.x = first.px = rx; first.y = first.py = ry;

    // target around the hand body
    var a = t.ang + now * 0.0012 * t.spin;
    var rr = t.rad * (1 + (reduced ? 0 : 0.15 * Math.sin(now * 0.006 + t.phase)));
    var tx = body.x + Math.cos(a) * rr, ty = body.y + Math.sin(a) * rr * 0.8;
    var pinned = true;
    if (t.state === 'shoot') {
      var p = clamp((now - t.t0) / t.dur, 0, 1), e = reduced ? p : easeOutBack(p);
      tx = rx + (tx - rx) * e; ty = ry + (ty - ry) * e;
      if (p >= 1) t.state = 'hold';
    } else if (t.state === 'retract') {
      pinned = false;
      var age = now - t.t0;
      t.life = 1 - clamp((age - 250) / 400, 0, 1);
      if (age > 650) return false;
    }
    if (pinned) { last.x = last.px = tx; last.y = last.py = ty; }

    // rest length: slightly slack while held (sags like goo), shrinking while retracting
    var span = Math.hypot(last.x - rx, last.y - ry);
    if (t.state === 'retract') t.rest = (t.rest || span / (M - 1)) * Math.pow(0.8, f);
    else t.rest = span * 1.06 / (M - 1);

    var g = reduced ? 0 : 0.18, damp = Math.pow(0.9, f);
    for (var i = 1; i < M; i++) {
      if (i === M - 1 && pinned) break;
      var q = pts[i], vx = (q.x - q.px) * damp, vy = (q.y - q.py) * damp;
      q.px = q.x; q.py = q.y;
      q.x += vx; q.y += vy + g * f * f;
      if (!reduced && t.state === 'hold') {       // living wobble
        var w = Math.sin(now * 0.005 + t.phase + i * 0.9) * 0.12 * f;
        q.x += w * -(ty - ry) / (span || 1); q.y += w * (tx - rx) / (span || 1);
      }
    }
    for (var it = 0; it < 8; it++) {
      for (var j = 0; j < M - 1; j++) {
        var p1 = pts[j], p2 = pts[j + 1];
        var dx = p2.x - p1.x, dy = p2.y - p1.y, d = Math.hypot(dx, dy) || 1e-6;
        var diff = (d - t.rest) / d;
        var lock1 = j === 0, lock2 = j + 1 === M - 1 && pinned;
        if (lock1 && lock2) continue;
        var k1 = lock1 ? 0 : lock2 ? 1 : 0.5, k2 = lock2 ? 0 : lock1 ? 1 : 0.5;
        p1.x += dx * diff * k1; p1.y += dy * diff * k1;
        p2.x -= dx * diff * k2; p2.y -= dy * diff * k2;
      }
    }
    if (!reduced && t.state === 'hold' && Math.random() < 0.002 * f) {   // the odd drip
      var m = pts[Math.floor(M / 2)];
      spawnDrop(m.x, m.y, 0, 0.5, rand(2, 3));
    }
    return true;
  }

  function stepDrops(f) {
    for (var i = drops.length - 1; i >= 0; i--) {
      var d = drops[i];
      d.vy += 0.3 * f; d.vx *= Math.pow(0.98, f);
      d.x += d.vx * f; d.y += d.vy * f;
      d.life -= f / 70;
      d.r = d.r0 * Math.sqrt(Math.max(d.life, 0));
      if (d.life <= 0 || d.y > H + 20) drops.splice(i, 1);
    }
  }

  /* ---------- drawing ---------- */
  function dot(ctx, x, y, r) {
    if (r <= 0.2) return;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  }

  // Catmull-Rom through the rope points -> smooth polyline
  var SUB = 3, NS = (M - 1) * SUB + 1, sm = [];
  for (var si = 0; si < NS; si++) sm.push({ x: 0, y: 0 });
  var Lx = new Float32Array(NS), Ly = new Float32Array(NS), Rx = new Float32Array(NS), Ry = new Float32Array(NS);
  function smooth(pts) {
    for (var k = 0; k < NS; k++) {
      var i = Math.min(Math.floor(k / SUB), M - 2), s = k / SUB - i;
      var p0 = pts[Math.max(i - 1, 0)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(i + 2, M - 1)];
      var s2 = s * s, s3 = s2 * s;
      sm[k].x = 0.5 * (2 * p1.x + (p2.x - p0.x) * s + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * s2 + (3 * p1.x - p0.x - 3 * p2.x + p3.x) * s3);
      sm[k].y = 0.5 * (2 * p1.y + (p2.y - p0.y) * s + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * s2 + (3 * p1.y - p0.y - 3 * p2.y + p3.y) * s3);
    }
  }

  function drawTendril(t) {
    var pts = t.pts, a = pts[0], b = pts[M - 1];
    var span = Math.hypot(b.x - a.x, b.y - a.y);
    var thin = clamp(70 / (span || 1), 0.32, 1);          // stretched goo gets thinner
    smooth(pts);
    // one filled tapered shape -> no seams between segments
    for (var k = 0; k < NS; k++) {
      var pa = sm[Math.max(k - 1, 0)], pb = sm[Math.min(k + 1, NS - 1)];
      var dx = pb.x - pa.x, dy = pb.y - pa.y, d = Math.hypot(dx, dy) || 1;
      var u = k / (NS - 1);
      var neck = 1 - (1 - thin) * Math.sin(Math.PI * Math.min(u * 1.2, 1));
      var hw = Math.max(0.35, (t.w0 + (t.w1 - t.w0) * Math.pow(u, 0.6)) * neck * t.life) / 2;
      Lx[k] = sm[k].x - dy / d * hw; Ly[k] = sm[k].y + dx / d * hw;
      Rx[k] = sm[k].x + dy / d * hw; Ry[k] = sm[k].y - dx / d * hw;
    }
    bctx.beginPath();
    bctx.moveTo(Lx[0], Ly[0]);
    for (var j1 = 1; j1 < NS; j1++) bctx.lineTo(Lx[j1], Ly[j1]);
    for (var j2 = NS - 1; j2 >= 0; j2--) bctx.lineTo(Rx[j2], Ry[j2]);
    bctx.closePath(); bctx.fill();
    dot(bctx, a.x, a.y, t.w0 * 0.9 * t.life);             // fillet at the button edge
    if (t.state !== 'retract') dot(bctx, b.x, b.y, (t.w1 * 0.5 + 0.8) * t.life);   // sucker on the hand
    // faint gloss along the strand
    if (t.life > 0.6 && span > 12) {
      fctx.beginPath();
      for (var j = 1; j < M - 3; j++) {
        var x = pts[j].x - 1.2, y = pts[j].y - 1.2;
        if (distanceToPill(x, y) < 2) { fctx.moveTo(pts[j + 1].x - 1.2, pts[j + 1].y - 1.2); continue; }
        if (j === 1) fctx.moveTo(x, y); else fctx.lineTo(x, y);
      }
      fctx.stroke();
    }
  }

  // strands wrapped across the hand, drawn above it
  var WRAPS = [[2.7, 0.4, 1], [3.8, 1.1, -1]];
  function drawWrap(g) {
    for (var i = 0; i < WRAPS.length; i++) {
      var a = WRAPS[i][0], b = WRAPS[i][1], bend = WRAPS[i][2];
      var wob = reduced ? 0 : Math.sin(now * 0.004 + a * 3) * 0.12, r0 = 14;
      var ax = body.x + Math.cos(a + wob) * r0, ay = body.y + Math.sin(a + wob) * r0;
      var bx = body.x + Math.cos(b - wob) * r0, by = body.y + Math.sin(b - wob) * r0;
      var dx = bx - ax, dy = by - ay, d = Math.hypot(dx, dy) || 1;
      fctx.lineWidth = 2 * g;
      fctx.beginPath();
      fctx.moveTo(ax, ay);
      fctx.quadraticCurveTo((ax + bx) / 2 - dy / d * bend * 5, (ay + by) / 2 + dx / d * bend * 5, bx, by);
      fctx.stroke();
      dot(fctx, ax, ay, 1.8 * g); dot(fctx, bx, by, 1.8 * g);
    }
  }

  function render() {
    bctx.setTransform(dpr, 0, 0, dpr, 0, 0); bctx.clearRect(0, 0, W, H);
    fctx.setTransform(dpr, 0, 0, dpr, 0, 0); fctx.clearRect(0, 0, W, H);
    if (!tendrils.length && !drops.length) return;
    bctx.fillStyle = bctx.strokeStyle = INK;
    bctx.lineCap = bctx.lineJoin = 'round';
    fctx.lineCap = fctx.lineJoin = 'round';
    fctx.strokeStyle = 'rgba(255,255,255,.16)'; fctx.lineWidth = 1;
    var held = 0;
    for (var i = 0; i < tendrils.length; i++) {
      var t = tendrils[i];
      if (t.state === 'wait') continue;
      drawTendril(t);
      if (t.state === 'hold') held++;
    }
    for (var j = 0; j < drops.length; j++) dot(bctx, drops[j].x, drops[j].y, drops[j].r);
    if (active && held) {
      var g = held / tendrils.length;
      dot(bctx, body.x, body.y, 7 * g);                    // goo mass behind the hand
      fctx.fillStyle = fctx.strokeStyle = INK;
      drawWrap(g);
    }
  }

  /* ---------- loop (sleeps when idle) ---------- */
  var running = false, lastTs = 0;
  function wake() {
    if (running) return;
    running = true; lastTs = performance.now();
    requestAnimationFrame(frame);
  }
  function frame(ts) {
    now = ts;
    var f = clamp((ts - lastTs) / 16.667, 0.25, 3); lastTs = ts;
    if (active) { s0 = nearestS(handPos.x, handPos.y); updateHand(); }
    for (var i = tendrils.length - 1; i >= 0; i--) if (!stepTendril(tendrils[i], f)) tendrils.splice(i, 1);
    stepDrops(f);
    render();
    if (active || tendrils.length || drops.length) requestAnimationFrame(frame);
    else running = false;
  }

  /* ---------- input ---------- */
  function onMove(e) {
    ptr.x = e.clientX; ptr.y = e.clientY; ptr.type = e.pointerType || 'mouse';
    if (e.type === 'pointerdown') ptr.down = true;
    if (active) updateHand();
    evaluate();
  }
  function onUp(e) {
    ptr.down = false;
    if (e.pointerType && e.pointerType !== 'mouse' && active) snapAll();
  }
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerdown', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  document.addEventListener('mouseleave', function () { if (active) snapAll(); });
  window.addEventListener('blur', function () { if (active) snapAll(); });

  var toastTimer = 0;
  btn.addEventListener('click', function () {
    toast.textContent = "🕷️ you've been absorbed. let's collaborate.";
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2500);
  });

  function setDebug(v) { debug = v; document.body.classList.toggle('debug', v); }
  window.addEventListener('keydown', function (e) {
    if ((e.key === 'd' || e.key === 'D') && !e.ctrlKey && !e.metaKey && !e.altKey) setDebug(!debug);
  });
  setDebug(/[?&]debug=1/.test(location.search));

  window.addEventListener('resize', resize);
  if ('ResizeObserver' in window) new ResizeObserver(measure).observe(hit);
  resize();

  // test hooks
  window.__venom = {
    VENOM_ZONE: VENOM_ZONE,
    distanceToPill: distanceToPill,
    isActive: function () { return active; },
    tendrilCount: function () { return tendrils.length; },
    handPos: function () { return { x: handPos.x, y: handPos.y }; },
    tips: function () { return tendrils.map(function (t) { var p = t.pts[M - 1]; return { x: p.x, y: p.y, state: t.state }; }); }
  };
})();
</script>
</body>
